<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Tahoma,Arial,sans-serif;
    color:#fff;
    background:
        radial-gradient(circle at top,#263d83 0,#11182f 45%,#070b18 100%);
}

.container{
    width:min(700px,94%);
    margin:auto;
    padding:18px 0 40px;
}

.card{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.13);
    border-radius:26px;
    padding:22px;
    box-shadow:0 20px 60px rgba(0,0,0,.35);
    backdrop-filter:blur(18px);
}

.hidden{
    display:none!important;
}

.center{
    text-align:center;
}

.logo{
    font-size:65px;
}

h1{
    margin:5px 0 12px;
    font-size:28px;
}

h2{
    line-height:1.9;
}

p{
    line-height:1.9;
    opacity:.8;
}

input{
    width:100%;
    padding:16px;
    margin:8px 0;
    border-radius:16px;
    border:1px solid rgba(255,255,255,.15);
    outline:none;
    background:rgba(0,0,0,.25);
    color:white;
    font-size:16px;
}

input::placeholder{
    color:#aaa;
}

button{
    width:100%;
    border:0;
    border-radius:16px;
    padding:15px;
    margin-top:10px;
    background:#2563eb;
    color:#fff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:active{
    transform:scale(.98);
}

.secondary{
    background:rgba(255,255,255,.1);
}

.category-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    margin-top:20px;
}

.category{
    min-height:135px;
    border-radius:20px;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.07);
    padding:16px;
    cursor:pointer;
    text-align:center;
    transition:.2s;
}

.category:hover{
    transform:translateY(-3px);
    background:rgba(255,255,255,.13);
}

.category-icon{
    font-size:45px;
}

.category-title{
    font-weight:bold;
    margin-top:8px;
}

.category-desc{
    font-size:11px;
    opacity:.65;
    margin-top:5px;
}

.cup{
    font-size:75px;
    text-align:center;
    filter:drop-shadow(0 5px 15px rgba(255,210,0,.3));
}

.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:12px;
}

.question-count{
    font-size:14px;
    opacity:.8;
}

.timer{
    min-width:72px;
    text-align:center;
    padding:11px 12px;
    border-radius:14px;
    background:#dc2626;
    font-size:20px;
    font-weight:bold;
}

.timer.warning{
    animation:pulse .5s infinite alternate;
    background:#991b1b;
}

@keyframes pulse{
    from{transform:scale(1)}
    to{transform:scale(1.08)}
}

.progress{
    height:8px;
    border-radius:10px;
    background:rgba(255,255,255,.1);
    overflow:hidden;
    margin:12px 0 20px;
}

.progress-bar{
    height:100%;
    width:0;
    background:#22c55e;
    transition:.3s;
}

.question{
    font-size:20px;
    line-height:1.9;
    margin:15px 0;
}

.option{
    padding:16px;
    margin:10px 0;
    border-radius:16px;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.07);
    cursor:pointer;
    transition:.15s;
}

.option:hover{
    background:rgba(255,255,255,.13);
}

.option.selected{
    background:#2563eb;
    border-color:#60a5fa;
}

.score{
    font-size:55px;
    font-weight:bold;
    margin:15px;
}

.rank{
    font-size:22px;
    margin:15px;
}

.result-row{
    display:flex;
    justify-content:space-around;
    gap:8px;
    margin:20px 0;
}

.result-box{
    flex:1;
    padding:15px 8px;
    border-radius:16px;
    background:rgba(255,255,255,.07);
}

.result-number{
    font-size:25px;
    font-weight:bold;
}

.result-label{
    font-size:12px;
    opacity:.7;
}

.player{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:15px;
    margin:8px 0;
    border-radius:16px;
    background:rgba(255,255,255,.07);
}

.player:nth-child(1){
    border:1px solid #facc15;
}

.player:nth-child(2){
    border:1px solid #cbd5e1;
}

.player:nth-child(3){
    border:1px solid #d97706;
}

.medal{
    font-size:24px;
}

.score-small{
    font-weight:bold;
    color:#60a5fa;
}

.badge{
    display:inline-block;
    padding:7px 12px;
    border-radius:30px;
    background:rgba(255,255,255,.1);
    font-size:12px;
}

.error{
    color:#fca5a5;
}

@media(max-width:450px){
    .category-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .category{
        min-height:125px;
        padding:12px 8px;
    }

    .category-icon{
        font-size:38px;
    }

    .question{
        font-size:18px;
    }

    h1{
        font-size:24px;
    }
}
</style>
</head>

/* =====================================================
   VARIABLES
===================================================== */

let selectedQuiz=null;
let currentQuestion=0;
let selectedAnswer=null;

let score=0;
let correctCount=0;
let wrongCount=0;

let timeLeft=10;
let timerInterval=null;

let username="";


/* =====================================================
   SUPABASE REQUEST
===================================================== */

async function supabaseRequest(url,options={}){

    const response =
        await fetch(
            SUPABASE_URL+url,
            {
                ...options,

                headers:{
                    "apikey":
                        SUPABASE_ANON_KEY,

                    "Authorization":
                        "Bearer "+
                        SUPABASE_ANON_KEY,

                    "Content-Type":
                        "application/json",

                    ...(options.headers||{})
                }
            }
        );

    if(!response.ok){

        const text =
            await response.text();

        throw new Error(
            text || "Supabase Error"
        );
    }

    return response.json();
}


/* =====================================================
   RENDER CATEGORIES
===================================================== */

function renderCategories(){

    const box =
        document.getElementById(
            "categories"
        );

    box.innerHTML="";

    QUIZZES.forEach(quiz=>{

        const div =
            document.createElement("div");

        div.className="category";

        div.innerHTML=`

            <div class="category-icon">
                ${quiz.icon}
            </div>

            <div class="category-title">
                ${escapeHtml(quiz.title)}
            </div>

            <div class="category-desc">
                ${escapeHtml(quiz.description)}
            </div>

        `;

        div.onclick=()=>{
            startQuiz(quiz.id);
        };

        box.appendChild(div);
    });
}


/* =====================================================
   START QUIZ
===================================================== */

function startQuiz(id){

    username =
        document
        .getElementById("username")
        .value
        .trim();

    if(!username){

        alert(
            "ابتدا نام بازیکن را وارد کنید."
        );

        document
        .getElementById("username")
        .focus();

        return;
    }

    selectedQuiz =
        QUIZZES.find(
            q=>q.id===id
        );

    if(!selectedQuiz)
        return;

    currentQuestion=0;
    selectedAnswer=null;

    score=0;
    correctCount=0;
    wrongCount=0;

    document
    .getElementById("home")
    .classList.add("hidden");

    document
    .getElementById("resultScreen")
    .classList.add("hidden");

    document
    .getElementById("leaderboardScreen")
    .classList.add("hidden");

    document
    .getElementById("quizScreen")
    .classList.remove("hidden");

    document
    .getElementById("categoryBadge")
    .innerText =
        selectedQuiz.icon+
        " "+
        selectedQuiz.title;

    showQuestion();
}


/* =====================================================
   SHOW QUESTION
===================================================== */

function showQuestion(){

    clearInterval(timerInterval);

    selectedAnswer=null;
    timeLeft=10;

    const q =
        selectedQuiz
        .questions[currentQuestion];

    document
    .getElementById("questionCount")
    .innerText =
        `سؤال ${currentQuestion+1} از ${selectedQuiz.questions.length}`;

    document
    .getElementById("questionText")
    .innerText =
        q.q;

    document
    .getElementById("timer")
    .innerText =
        timeLeft;

    document
    .getElementById("timer")
    .classList.remove("warning");

    document
    .getElementById("progressBar")
    .style.width =
        (
            currentQuestion /
            selectedQuiz.questions.length *
            100
        )+"%";

    const options =
        document.getElementById(
            "options"
        );

    options.innerHTML="";

    q.o.forEach(
        (option,index)=>{

            const div =
                document.createElement(
                    "div"
                );

            div.className="option";

            div.innerText=
                option;

            div.onclick=()=>{
                selectAnswer(
                    index,
                    div
                );
            };

            options.appendChild(div);

        }
    );

    document
    .getElementById("nextButton")
    .innerText =
        currentQuestion===
        selectedQuiz.questions.length-1
        ?
        "پایان مسابقه 🏆"
        :
        "تأیید پاسخ ➜";

    startTimer();
}


/* =====================================================
   SELECT ANSWER
===================================================== */

function selectAnswer(
    index,
    element
){

    selectedAnswer=index;

    document
    .querySelectorAll(".option")
    .forEach(el=>{
        el.classList.remove(
            "selected"
        );
    });

    element.classList.add(
        "selected"
    );
}


/* =====================================================
   TIMER
===================================================== */

function startTimer(){

    timerInterval =
        setInterval(()=>{

            timeLeft--;

            document
            .getElementById("timer")
            .innerText=
                timeLeft;

            if(timeLeft<=3){

                document
                .getElementById("timer")
                .classList.add(
                    "warning"
                );
            }

            if(timeLeft<=0){

                clearInterval(
                    timerInterval
                );

                timeUp();
            }

        },1000);
}


/* =====================================================
   TIME UP
===================================================== */

function timeUp(){

    wrongCount++;

    goNext();
}


/* =====================================================
   NEXT QUESTION
===================================================== */

function nextQuestion(){

    if(
        selectedAnswer===null
    ){

        alert(
            "لطفاً یک گزینه را انتخاب کنید."
        );

        return;
    }

    clearInterval(
        timerInterval
    );

    const q =
        selectedQuiz
        .questions[currentQuestion];

    if(
        selectedAnswer===q.a
    ){

        correctCount++;

        score+=10;

    }else{

        wrongCount++;
    }

    goNext();
}


/* =====================================================
   GO NEXT
===================================================== */

function goNext(){

    clearInterval(
        timerInterval
    );

    currentQuestion++;

    if(
        currentQuestion >=
        selectedQuiz.questions.length
    ){

        finishQuiz();

        return;
    }

    showQuestion();
}


/* =====================================================
   FINISH QUIZ
===================================================== */

async function finishQuiz(){

    clearInterval(
        timerInterval
    );

    document
    .getElementById("quizScreen")
    .classList.add("hidden");

    document
    .getElementById("resultScreen")
    .classList.remove("hidden");

    const total =
        selectedQuiz.questions.length;

    document
    .getElementById("score")
    .innerText=
        score;

    document
    .getElementById("correctCount")
    .innerText=
        correctCount;

    document
    .getElementById("wrongCount")
    .innerText=
        wrongCount;

    document
    .getElementById("totalCount")
    .innerText=
        total;

    document
    .getElementById("resultCategory")
    .innerText=
        selectedQuiz.icon+
        " "+
        selectedQuiz.title;

    document
    .getElementById("resultCup")
    .innerText=
        selectedQuiz.cup;

    document
    .getElementById("rank")
    .innerText=
        "در حال ثبت نتیجه...";

    try{

        await supabaseRequest(
            "/rest/v1/quiz_results",
            {
                method:"POST",

                headers:{
                    "Prefer":
                        "return=minimal"
                },

                body:
                    JSON.stringify({

                        quiz_id:
                            selectedQuiz.id,

                        username:
                            username,

                        score:
                            score,

                        total_points:
                            total*10,

                        correct_count:
                            correctCount,

                        wrong_count:
                            wrongCount

                    })
            }
        );

        await calculateRank();

    }
    catch(error){

        console.error(error);

        document
        .getElementById("rank")
        .innerText=
            "امتیاز شما: "+
            score;

        console.log(
            "Supabase error:",
            error
        );
    }
}


/* =====================================================
   CALCULATE RANK
===================================================== */

async function calculateRank(){

    try{

        const players =
            await supabaseRequest(

                "/rest/v1/quiz_results"+
                "?select=score"+
                "&quiz_id=eq."+
                encodeURIComponent(
                    selectedQuiz.id
                )+
                "&order=score.desc"

            );

        let rank=1;

        for(
            const player
            of players
        ){

            if(
                player.score>score
            ){

                rank++;
            }
        }

        let medal="";

        if(rank===1)
            medal="🥇 ";

        else if(rank===2)
            medal="🥈 ";

        else if(rank===3)
            medal="🥉 ";

        document
        .getElementById("rank")
        .innerText=
            medal+
            "رتبه شما: "+
            rank;

    }
    catch(error){

        document
        .getElementById("rank")
        .innerText=
            "رتبه محاسبه نشد";
    }
}


/* =====================================================
   LEADERBOARD
===================================================== */

async function showLeaderboard(){

    document
    .getElementById("resultScreen")
    .classList.add("hidden");

    document
    .getElementById("leaderboardScreen")
    .classList.remove("hidden");

    document
    .getElementById("leaderCup")
    .innerText=
        selectedQuiz.cup;

    document
    .getElementById("leaderTitle")
    .innerText=
        selectedQuiz.title;

    const box =
        document.getElementById(
            "players"
        );

    box.innerHTML=
        "<p class='center'>در حال دریافت...</p>";

    try{

        const players =
            await supabaseRequest(

                "/rest/v1/quiz_results"+
                "?select=username,score,correct_count,created_at"+
                "&quiz_id=eq."+
                encodeURIComponent(
                    selectedQuiz.id
                )+
                "&order=score.desc,created_at.asc"+
                "&limit=50"

            );

        box.innerHTML="";

        if(!players.length){

            box.innerHTML=
                "<p class='center'>هنوز کسی شرکت نکرده است.</p>";

            return;
        }

        players.forEach(
            (player,index)=>{

                const div =
                    document.createElement(
                        "div"
                    );

                div.className="player";

                let medal=
                    "#"+(index+1);

                if(index===0)
                    medal="🥇";

                else if(index===1)
                    medal="🥈";

                else if(index===2)
                    medal="🥉";

                div.innerHTML=`

                    <div>

                        <span class="medal">
                            ${medal}
                        </span>

                        <strong>
                            ${escapeHtml(
                                player.username
                            )}
                        </strong>

                    </div>

                    <div class="score-small">
                        ${player.score} امتیاز
                    </div>

                `;

                box.appendChild(div);
            }
        );

    }
    catch(error){

        console.error(error);

        box.innerHTML=
            "<p class='center error'>خطا در دریافت جدول امتیازات.</p>";
    }
}

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(text){

    const div =
        document.createElement("div");

    div.textContent=text;

    return div.innerHTML;
}
