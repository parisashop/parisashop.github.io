<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<title>Chaty AI</title>


<style>

/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}


html,
body{
    width:100%;
    height:100%;
    min-height:100dvh;
}


body{

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    background:#000;

    color:#fff;

    overflow:hidden;

    overscroll-behavior:none;
}


/* =====================================================
   MAIN APP
===================================================== */

.chaty{

    width:100%;

    max-width:520px;

    height:100dvh;

    min-height:100dvh;

    margin:auto;

    background:#0b0b0b;

    display:flex;

    flex-direction:column;

    overflow:hidden;

}


/* =====================================================
   HEADER
===================================================== */

.header{

    height:72px;

    min-height:72px;

    background:#111;

    border-bottom:
        1px solid #292929;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:
        8px
        14px
        5px;

    padding-top:
        max(
            8px,
            env(safe-area-inset-top)
        );

    flex-shrink:0;

}


.headerTitle{

    display:flex;

    align-items:center;

    gap:10px;

}


.logo{

    width:42px;

    height:42px;

    flex-shrink:0;

    border-radius:50%;

    background:#fff;

    color:#000;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:21px;

    font-weight:bold;

}


.title{

    font-size:18px;

    font-weight:bold;

}


.subtitle{

    font-size:11px;

    color:#888;

    margin-top:3px;

    max-width:130px;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;

}


.characterButton{

    border:0;

    background:#1d1d1d;

    color:#fff;

    border-radius:20px;

    padding:
        9px
        12px;

    font-family:inherit;

    font-size:12px;

    white-space:nowrap;

    flex-shrink:0;

}


/* =====================================================
   MESSAGES
===================================================== */

.messages{

    flex:1;

    min-height:0;

    overflow-y:auto;

    overflow-x:hidden;

    padding:
        15px
        12px
        10px;

    background:
        radial-gradient(
            circle at center,
            #151515,
            #070707 75%
        );

    -webkit-overflow-scrolling:touch;

    overscroll-behavior:contain;

}


.message{

    max-width:82%;

    padding:
        10px
        13px;

    margin-bottom:9px;

    border-radius:16px;

    line-height:1.8;

    font-size:14px;

    word-wrap:break-word;

    overflow-wrap:anywhere;

}


.message.bot{

    background:#202020;

    border-top-right-radius:4px;

    margin-left:auto;

}


.message.user{

    background:#fff;

    color:#000;

    border-top-left-radius:4px;

    margin-right:auto;

}


/* =====================================================
   TYPING
===================================================== */

.typing{

    color:#aaa;

    font-size:13px;

    display:none;

    padding:
        4px
        12px;

    background:#111;

    flex-shrink:0;

}


/* =====================================================
   INPUT AREA
===================================================== */

.inputArea{

    background:#111;

    border-top:
        1px solid #292929;

    padding:
        7px
        9px;

    padding-bottom:
        max(
            7px,
            env(safe-area-inset-bottom)
        );

    display:flex;

    gap:8px;

    align-items:flex-end;

    flex-shrink:0;

    min-height:60px;

}


/* =====================================================
   TEXT INPUT
===================================================== */

#messageInput{

    flex:1;

    width:0;

    min-height:44px;

    max-height:120px;

    resize:none;

    border:
        1px solid #333;

    outline:none;

    border-radius:22px;

    padding:
        11px
        15px;

    background:#1d1d1d;

    color:#fff;

    font-family:inherit;

    font-size:14px;

    line-height:1.5;

    direction:rtl;

}


#messageInput::placeholder{

    color:#777;

}


/* =====================================================
   SEND BUTTON
===================================================== */

#sendButton{

    width:45px;

    height:45px;

    min-width:45px;

    border:0;

    border-radius:50%;

    background:#fff;

    color:#000;

    font-size:19px;

    display:flex;

    align-items:center;

    justify-content:center;

    flex-shrink:0;

}


/* =====================================================
   WELCOME
===================================================== */

.welcome{

    text-align:center;

    padding:
        35px
        15px;

    color:#aaa;

}


.welcomeLogo{

    width:75px;

    height:75px;

    margin:
        0
        auto
        15px;

    border-radius:50%;

    background:#fff;

    color:#000;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:35px;

}


.welcome h2{

    color:#fff;

    margin-bottom:8px;

}


.welcome p{

    line-height:2;

    font-size:13px;

}


/* =====================================================
   CHARACTER PANEL
===================================================== */

.characterPanel{

    position:fixed;

    inset:0;

    background:#000e;

    z-index:100;

    display:none;

    padding:
        15px;

    padding-top:
        max(
            15px,
            env(safe-area-inset-top)
        );

    padding-bottom:
        max(
            15px,
            env(safe-area-inset-bottom)
        );

    overflow-y:auto;

}


.characterBox{

    width:100%;

    max-width:480px;

    margin:
        10px
        auto;

    background:#151515;

    border:
        1px solid #292929;

    border-radius:25px;

    padding:18px;

}


.characterTitle{

    text-align:center;

    font-size:20px;

    font-weight:bold;

    margin-bottom:15px;

}


.characters{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:10px;

}


.character{

    border:
        1px solid #303030;

    background:#202020;

    color:#fff;

    border-radius:18px;

    padding:14px 8px;

    text-align:center;

    font-family:inherit;

    font-size:13px;

}


.character:active{

    background:#fff;

    color:#000;

}


.charIcon{

    width:54px;

    height:54px;

    border-radius:50%;

    background:#333;

    margin:
        0
        auto
        8px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:25px;

}


.closeCharacters{

    width:100%;

    border:0;

    margin-top:14px;

    padding:13px;

    border-radius:15px;

    background:#303030;

    color:#fff;

    font-family:inherit;

}


/* =====================================================
   SMALL PHONES
===================================================== */

@media(max-height:600px){

    .header{

        height:66px;

        min-height:66px;

        padding-top:
            max(
                5px,
                env(safe-area-inset-top)
            );

    }


    .logo{

        width:38px;

        height:38px;

    }


    .characterButton{

        padding:
            7px
            10px;

    }


    .messages{

        padding-top:8px;

    }


    .inputArea{

        min-height:56px;

        padding:
            5px
            8px;

        padding-bottom:
            max(
                5px,
                env(safe-area-inset-bottom)
            );

    }


    #messageInput{

        min-height:42px;

    }


    #sendButton{

        width:43px;

        height:43px;

        min-width:43px;

    }

}


/* =====================================================
   VERY SMALL PHONES
===================================================== */

@media(max-height:480px){

    .header{

        height:60px;

        min-height:60px;

    }


    .title{

        font-size:16px;

    }


    .subtitle{

        display:none;

    }


    .logo{

        width:36px;

        height:36px;

    }


    .welcome{

        padding-top:15px;

        padding-bottom:15px;

    }


    .welcomeLogo{

        width:55px;

        height:55px;

        font-size:27px;

    }

}


/* =====================================================
   LANDSCAPE
===================================================== */

@media(
    orientation:landscape
){

    .characterBox{

        margin:
            5px
            auto;

    }

}


</style>

</head>


<body>


<!-- =====================================================
     CHATY
===================================================== -->

<div class="chaty">


    <!-- HEADER -->

    <div class="header">


        <div class="headerTitle">


            <div class="logo">
                C
            </div>


            <div>

                <div class="title">
                    Chaty AI
                </div>


                <div
                    class="subtitle"
                    id="characterName">

                    Gemma 4 31B

                </div>

            </div>


        </div>


        <button
            class="characterButton"
            id="characterButton">

            👤 کاراکتر

        </button>


    </div>



    <!-- =================================================
         MESSAGES
    ================================================= -->

    <div
        class="messages"
        id="messages">


        <div class="welcome">


            <div class="welcomeLogo">
                C
            </div>


            <h2>
                Chaty AI
            </h2>


            <p>

                سلام 👋

                <br>

                من Chaty AI هستم.

                <br><br>

                یک کاراکتر انتخاب کن تا
                با شخصیت انتخاب‌شده با تو صحبت کنم.

            </p>


        </div>


    </div>



    <!-- TYPING -->

    <div
        class="typing"
        id="typing">

        Chaty در حال فکر کردن...

    </div>



    <!-- =================================================
         INPUT
    ================================================= -->

    <div class="inputArea">


        <textarea
            id="messageInput"
            placeholder="پیامت را بنویس..."
            rows="1"></textarea>


        <button
            id="sendButton">

            ➤

        </button>


    </div>


</div>



<!-- =====================================================
     CHARACTER PANEL
===================================================== -->

<div
    class="characterPanel"
    id="characterPanel">


    <div class="characterBox">


        <div class="characterTitle">

            🎭 انتخاب شخصیت Chaty AI

        </div>


        <div class="characters">


            <button
                class="character"
                data-character="مسی">

                <div class="charIcon">
                    ⚽
                </div>

                مسی

            </button>


            <button
                class="character"
                data-character="رونالدو">

                <div class="charIcon">
                    ⚽
                </div>

                رونالدو

            </button>


            <button
                class="character"
                data-character="پرسپولیس">

                <div class="charIcon">
                    🔴
                </div>

                پرسپولیس

            </button>


            <button
                class="character"
                data-character="استقلال">

                <div class="charIcon">
                    🔵
                </div>

                استقلال

            </button>


            <button
                class="character"
                data-character="بریکینگ بد">

                <div class="charIcon">
                    🧪
                </div>

                بریکینگ بد

            </button>


            <button
                class="character"
                data-character="باب اسفنجی">

                <div class="charIcon">
                    🧽
                </div>

                باب اسفنجی

            </button>


            <button
                class="character"
                data-character="BTS">

                <div class="charIcon">
                    🎤
                </div>

                BTS

            </button>


            <button
                class="character"
                data-character="دیوید بکام">

                <div class="charIcon">
                    ⚽
                </div>

                دیوید بکام

            </button>


            <button
                class="character"
                data-character="هکر">

                <div class="charIcon">
                    💻
                </div>

                هکر

            </button>


            <button
                class="character"
                data-character="شاعر">

                <div class="charIcon">
                    📜
                </div>

                شاعر

            </button>


            <button
                class="character"
                data-character="آشپز">

                <div class="charIcon">
                    👨‍🍳
                </div>

                آشپز

            </button>


            <button
                class="character"
                data-character="تراپیست">

                <div class="charIcon">
                    🧠
                </div>

                تراپیست

            </button>


        </div>


        <button
            class="closeCharacters"
            id="closeCharacters">

            بستن

        </button>


    </div>


</div>



<script>

/* =====================================================
   CHATY CONFIG
===================================================== */

const CHATY_API =
"https://vkqmlfumodqmmylchgdx.supabase.co/functions/v1/bright-endpoint";


const MODEL =
"google/gemma-4-31B-it";


/* =====================================================
   STATE
===================================================== */

let selectedCharacter =
"دستیار هوش مصنوعی";


/* =====================================================
   ELEMENTS
===================================================== */

const messages =
document.getElementById(
    "messages"
);


const input =
document.getElementById(
    "messageInput"
);


const sendButton =
document.getElementById(
    "sendButton"
);


const typing =
document.getElementById(
    "typing"
);


const characterPanel =
document.getElementById(
    "characterPanel"
);


const characterButton =
document.getElementById(
    "characterButton"
);


const closeCharacters =
document.getElementById(
    "closeCharacters"
);


const characterName =
document.getElementById(
    "characterName"
);


/* =====================================================
   CHARACTER PANEL
===================================================== */

characterButton.onclick =
function(){

    characterPanel.style.display =
        "block";

};


closeCharacters.onclick =
function(){

    characterPanel.style.display =
        "none";

};


/* =====================================================
   SELECT CHARACTER
===================================================== */

document
.querySelectorAll(
    ".character"
)
.forEach(
function(button){

    button.onclick =
    function(){

        selectedCharacter =
            this.dataset.character;


        characterName.textContent =
            selectedCharacter +
            " • Gemma 4 31B";


        addBotMessage(
            "🎭 شخصیت «" +
            escapeHTML(
                selectedCharacter
            ) +
            "» انتخاب شد."
        );


        characterPanel.style.display =
            "none";


        input.focus();

    };

});


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text){

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   ADD USER MESSAGE
===================================================== */

function addUserMessage(text){

    const div =
        document.createElement(
            "div"
        );


    div.className =
        "message user";


    div.innerHTML =
        escapeHTML(text)
        .replace(
            /\n/g,
            "<br>"
        );


    messages.appendChild(
        div
    );


    scrollBottom();

}


/* =====================================================
   ADD BOT MESSAGE
===================================================== */

function addBotMessage(text){

    const div =
        document.createElement(
            "div"
        );


    div.className =
        "message bot";


    div.innerHTML =
        text;


    messages.appendChild(
        div
    );


    scrollBottom();

}


/* =====================================================
   SCROLL
===================================================== */

function scrollBottom(){

    requestAnimationFrame(
        function(){

            messages.scrollTop =
                messages.scrollHeight;

        }
    );

}


/* =====================================================
   CHATY API
===================================================== */

async function askChaty(message){

    const response =
        await fetch(
            CHATY_API,
            {

                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json"
                },

                body:JSON.stringify({

                    message:
                        message,

                    character:
                        selectedCharacter,

                    model:
                        MODEL

                })

            }
        );


    if(!response.ok){

        const errorText =
            await response.text();


        throw new Error(
            errorText ||
            "API Error"
        );

    }


    return await response.json();

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

    const text =
        input.value.trim();


    if(!text){

        return;

    }


    input.value =
        "";

    input.style.height =
        "44px";


    addUserMessage(
        text
    );


    typing.style.display =
        "block";


    scrollBottom();


    sendButton.disabled =
        true;


    try{

        const data =
            await askChaty(
                text
            );


        let answer =
            data.answer ||
            data.message ||
            data.response ||
            data.content;


        if(
            data.choices &&
            data.choices[0] &&
            data.choices[0].message
        ){

            answer =
                data.choices[0]
                .message
                .content;

        }


        if(!answer){

            answer =
                "پاسخی از Chaty دریافت نشد.";

        }


        addBotMessage(
            escapeHTML(
                answer
            )
            .replace(
                /\n/g,
                "<br>"
            )
        );


    }catch(error){

        console.error(
            "Chaty error:",
            error
        );


        addBotMessage(
            "❌ خطا در اتصال به Chaty AI.<br><br>" +
            "لطفاً Edge Function با نام bright-endpoint را بررسی کن."
        );

    }


    typing.style.display =
        "none";


    sendButton.disabled =
        false;


    input.focus();

}


/* =====================================================
   SEND BUTTON
===================================================== */

sendButton.onclick =
sendMessage;


/* =====================================================
   ENTER
===================================================== */

input.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =====================================================
   AUTO RESIZE
===================================================== */

input.addEventListener(
    "input",
    function(){

        this.style.height =
            "44px";


        this.style.height =
            Math.min(
                this.scrollHeight,
                120
            ) + "px";

    }
);


/* =====================================================
   KEYBOARD / MOBILE
===================================================== */

window.addEventListener(
    "resize",
    function(){

        setTimeout(
            scrollBottom,
            100
        );

    }
);


/* =====================================================
   INITIAL
===================================================== */

scrollBottom();

input.focus();

</script>

</body>
</html>
