<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Chaty AI</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Arial,Tahoma,sans-serif;
    background:#000;
    color:#fff;
}

/* =========================
   APP
========================= */

.app{
    width:100%;
    max-width:600px;
    height:100dvh;
    min-height:100vh;
    margin:auto;
    background:#000;
    display:flex;
    flex-direction:column;
    position:relative;
}

/* =========================
   HEADER
========================= */

.header{
    height:70px;
    min-height:70px;

    background:#000;

    border-bottom:1px solid #222;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:
        8px
        14px
        8px
        14px;

    position:relative;
    z-index:10;
}

.headerRight{
    display:flex;
    align-items:center;
    gap:10px;
}

.character{
    width:45px;
    height:45px;

    border-radius:50%;

    background:#222;

    object-fit:cover;

    border:1px solid #444;
}

.characterInfo{
    display:flex;
    flex-direction:column;
    gap:3px;
}

.characterName{
    font-size:16px;
    font-weight:bold;
}

.characterModel{
    font-size:11px;
    color:#888;
}

.headerButton{
    width:42px;
    height:42px;

    border:1px solid #333;

    border-radius:50%;

    background:#111;

    color:#fff;

    font-size:20px;
}

/* =========================
   CHAT
========================= */

.chat{
    flex:1;

    overflow-y:auto;

    padding:
        12px
        12px
        110px
        12px;

    display:flex;
    flex-direction:column;

    gap:12px;

    scroll-behavior:smooth;
}

.message{
    max-width:84%;

    padding:11px 14px;

    border-radius:18px;

    line-height:1.8;

    font-size:15px;

    word-wrap:break-word;

    white-space:pre-wrap;
}

.userMessage{
    align-self:flex-start;

    background:#fff;

    color:#000;

    border-bottom-left-radius:5px;
}

.aiMessage{
    align-self:flex-end;

    background:#181818;

    color:#fff;

    border:1px solid #292929;

    border-bottom-right-radius:5px;
}

.messageName{
    font-size:10px;
    color:#777;
    margin-bottom:3px;
}

/* =========================
   TYPING
========================= */

.typing{
    display:none;

    align-self:flex-end;

    background:#181818;

    border:1px solid #292929;

    border-radius:18px;

    padding:10px 15px;

    color:#aaa;
}

.dot{
    display:inline-block;

    width:6px;
    height:6px;

    background:#aaa;

    border-radius:50%;

    margin:0 2px;

    animation:blink 1s infinite;
}

.dot:nth-child(2){
    animation-delay:.2s;
}

.dot:nth-child(3){
    animation-delay:.4s;
}

@keyframes blink{
    0%,100%{
        opacity:.2;
    }

    50%{
        opacity:1;
    }
}

/* =========================
   INPUT AREA
========================= */

.inputArea{
    position:absolute;

    left:10px;
    right:10px;
    bottom:12px;

    min-height:58px;

    background:#111;

    border:1px solid #2b2b2b;

    border-radius:30px;

    display:flex;

    align-items:flex-end;

    gap:8px;

    padding:7px;

    z-index:20;

    box-shadow:
        0 5px 30px #000;
}

#messageInput{
    flex:1;

    min-width:0;

    max-height:110px;

    resize:none;

    border:0;

    outline:none;

    background:transparent;

    color:#fff;

    font-family:inherit;

    font-size:15px;

    line-height:1.6;

    padding:
        9px
        8px;

}

#messageInput::placeholder{
    color:#777;
}

.sendButton{
    width:44px;
    height:44px;

    flex-shrink:0;

    border:0;

    border-radius:50%;

    background:#fff;

    color:#000;

    font-size:20px;

    display:flex;

    align-items:center;
    justify-content:center;
}

.sendButton:disabled{
    opacity:.4;
}

/* =========================
   CHARACTER PANEL
========================= */

.panel{
    position:fixed;

    inset:0;

    z-index:100;

    display:none;

    background:#000;

    padding:
        15px
        12px
        20px;

    overflow-y:auto;
}

.panelHeader{
    height:55px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:10px;
}

.panelTitle{
    font-size:20px;
    font-weight:bold;
}

.closeButton{
    width:40px;
    height:40px;

    border-radius:50%;

    border:1px solid #333;

    background:#111;

    color:white;

    font-size:20px;
}

.characterGrid{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:10px;

    padding-bottom:20px;
}

.characterCard{
    min-height:120px;

    border:1px solid #292929;

    border-radius:18px;

    background:#111;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:8px;

    color:#fff;

    padding:10px;
}

.characterCard img{
    width:62px;
    height:62px;

    border-radius:50%;

    object-fit:cover;

    border:1px solid #444;
}

.characterCard span{
    font-size:13px;
}

/* =========================
   ERROR PANEL
========================= */

.errorBox{
    display:none;

    margin:10px;

    padding:12px;

    border:1px solid #552222;

    background:#180909;

    border-radius:15px;

    color:#ff9999;

    font-size:12px;

    line-height:1.8;

    direction:ltr;

    text-align:left;

    white-space:pre-wrap;

    max-height:220px;

    overflow:auto;
}

.clearError{
    margin-top:8px;

    padding:7px 12px;

    border:1px solid #555;

    background:#111;

    color:white;

    border-radius:10px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-height:650px){

    .header{
        height:62px;
        min-height:62px;
    }

    .character{
        width:38px;
        height:38px;
    }

    .headerButton{
        width:38px;
        height:38px;
    }

    .chat{
        padding-bottom:100px;
    }

}

@media(min-width:601px){

    .inputArea{
        left:50%;

        right:auto;

        transform:translateX(-50%);

        width:
            min(580px,calc(100% - 20px));
    }

}

/* =========================
   LOGIN
========================= */

#loginScreen{
    position:fixed;

    inset:0;

    z-index:9999;

    background:#000;

    display:none;

    align-items:center;

    padding:20px;
}

.loginBox{

.loginText{

.loginInput{

    border-radius:15px;

    margin-bottom:10px;

    direction:ltr;

.loginButton{
    width:100%;

    padding:14px;

    border:0;

    border-radius:15px;

    background:white;

    color:black;

    font-size:15px;
}

</style>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://vkqmlfumodqmmylchgdx.supabase.co";


const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZrcW1sZnVtb2RxbW15bGNoZ2R4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4MzY1MTgsImV4cCI6MjEwMzQxMjUxOH0.nmpfSMDR44_1BB7EdRtgvsde-D2d-uh_QgaSk5fCJ48";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


/* =====================================================
   EDGE FUNCTION
===================================================== */

const EDGE_FUNCTION_URL =
"https://vkqmlfumodqmmylchgdx.supabase.co/functions/v1/bright-endpoint";


/* =====================================================
   MODEL
===================================================== */

const AI_MODEL =
"google/gemma-4-31B-it";


/* =====================================================
   ELEMENTS
===================================================== */

const chat =
document.getElementById("chat");

const messageInput =
document.getElementById("messageInput");

const sendButton =
document.getElementById("sendButton");

const typing =
document.getElementById("typing");

const errorBox =
document.getElementById("errorBox");

const characterPanel =
document.getElementById("characterPanel");

const characterButton =
document.getElementById("characterButton");

const closeCharacterPanel =
document.getElementById("closeCharacterPanel");

const headerCharacter =
document.getElementById("headerCharacter");

const characterName =
document.getElementById("characterName");


/* =====================================================
   CHARACTER
===================================================== */

let selectedCharacter =
"Chaty AI";


let selectedImage =
"https://ui-avatars.com/api/?name=Chaty&background=222&color=fff";


/* =====================================================
   ERROR SYSTEM
===================================================== */

function showError(title,details){

    errorBox.style.display =
        "block";


    errorBox.innerHTML =
        "<b>" +
        escapeHTML(title) +
        "</b>\n\n" +

        escapeHTML(details) +

        "\n\n" +

        "<button class='clearError' " +
        "onclick='clearError()'>" +

        "پاک کردن خطا" +

        "</button>";

}


function clearError(){

    errorBox.style.display =
        "none";

    errorBox.textContent =
        "";

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(text){

    return String(text)

        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   MESSAGE
===================================================== */

function addMessage(
    text,
    type
){

    const div =
    document.createElement("div");

    div.className =
    "message " +
    (
        type === "user"
        ? "userMessage"
        : "aiMessage"
    );


    if(type !== "user"){

        div.innerHTML =
        "<div class='messageName'>" +

        escapeHTML(
            selectedCharacter
        ) +

        "</div>" +

        escapeHTML(text);

    }else{

        div.textContent =
        text;

    }


    chat.insertBefore(
        div,
        typing
    );


    scrollBottom();

}


/* =====================================================
   SCROLL
===================================================== */

function scrollBottom(){

    setTimeout(
        function(){

            chat.scrollTop =
            chat.scrollHeight;

        },
        50
    );

}


/* =====================================================
   CHARACTER PANEL
===================================================== */

characterButton.addEventListener(
"click",
function(){

    characterPanel.style.display =
    "block";

});


closeCharacterPanel.addEventListener(
"click",
function(){

    characterPanel.style.display =
    "none";

});


document
.querySelectorAll(".characterCard")
.forEach(
function(card){

    card.addEventListener(
    "click",
    function(){

        selectedCharacter =
        this.dataset.name;

        selectedImage =
        this.dataset.image;


        characterName.textContent =
        selectedCharacter;

        headerCharacter.src =
        selectedImage;


        characterPanel.style.display =
        "none";


        addMessage(
            "شخصیت «" +
            selectedCharacter +
            "» انتخاب شد.",
            "ai"
        );

    });

});


/* =====================================================
   SYSTEM PROMPT
===================================================== */

function getSystemPrompt(){

    return `تو Chaty AI هستی.

شخصیت انتخاب شده:
${selectedCharacter}

مدل:
${AI_MODEL}

اگر کاربر شخصیت خاصی انتخاب کرده است، پاسخ‌هایت را با لحن مناسب همان شخصیت تنظیم کن.

به زبان کاربر پاسخ بده.

اگر کاربر فارسی صحبت کرد، فارسی پاسخ بده.

پاسخ‌ها طبیعی، مفید و کوتاه باشند.`;

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

    const text =
    messageInput.value.trim();


    if(!text){

        return;

    }


    clearError();


    addMessage(
        text,
        "user"
    );


    messageInput.value =
    "";

    messageInput.style.height =
    "auto";


    sendButton.disabled =
    true;


    typing.style.display =
    "block";


    scrollBottom();


    try{

        const response =
        await fetch(
            EDGE_FUNCTION_URL,
            {

                method:"POST",

                headers:{

                    "Content-Type":
                    "application/json",

                    "Authorization":
                    "Bearer " +
                    SUPABASE_ANON_KEY,

                    "apikey":
                    SUPABASE_ANON_KEY

                },

                body:JSON.stringify({

                    name:text,

                    message:text,

                    prompt:text,

                    model:AI_MODEL,

                    character:selectedCharacter,

                    system:getSystemPrompt()

                })

            }
        );


        /* =========================
           HTTP ERROR
        ========================= */

        if(!response.ok){

            let serverText =
            "";

            try{

                serverText =
                await response.text();

            }catch(e){

                serverText =
                "بدون متن پاسخ";

            }


            throw new Error(

                "HTTP " +
                response.status +
                " " +
                response.statusText +

                "\n\n" +

                "Edge Function URL:\n" +
                EDGE_FUNCTION_URL +

                "\n\n" +

                "Server response:\n" +
                serverText

            );

        }


        /* =========================
           RESPONSE
        ========================= */

        const raw =
        await response.text();


        if(!raw){

            throw new Error(
                "Edge Function پاسخ خالی برگرداند."
            );

        }


        let data;


        try{

            data =
            JSON.parse(raw);

        }catch(e){

            throw new Error(

                "پاسخ Edge Function JSON معتبر نیست.\n\n" +

                "Raw response:\n" +
                raw

            );

        }


        console.log(
            "Chaty response:",
            data
        );


        /* =========================
           POSSIBLE ANSWERS
        ========================= */

        let answer =
        null;


        if(typeof data === "string"){

            answer =
            data;

        }


        else if(
            data.answer
        ){

            answer =
            data.answer;

        }


        else if(
            data.message &&
            typeof data.message === "string"
        ){

            answer =
            data.message;

        }


        else if(
            data.response
        ){

            answer =
            data.response;

        }


        else if(
            data.content
        ){

            answer =
            data.content;

        }


        else if(
            data.text
        ){

            answer =
            data.text;

        }


        /* OpenAI style */

        else if(
            data.choices &&
            data.choices[0] &&
            data.choices[0].message
        ){

            answer =
            data.choices[0]
            .message
            .content;

        }


        /* =========================
           NO ANSWER
        ========================= */

        if(!answer){

            throw new Error(

                "پاسخ هوش مصنوعی در داده دریافتی پیدا نشد.\n\n" +

                "JSON دریافت شده:\n" +

                JSON.stringify(
                    data,
                    null,
                    2
                )

            );

        }


        typing.style.display =
        "none";


        addMessage(
            answer,
            "ai"
        );


    }catch(error){

        console.error(
            "CHATY ERROR:",
            error
        );


        typing.style.display =
        "none";


        let message =
        "";


        if(
            error.name ===
            "TypeError"
        ){

            message =
            "احتمالاً مشکل اتصال اینترنت، CORS یا در دسترس نبودن Edge Function وجود دارد.";

        }


        showError(

            "❌ خطا در اتصال به Chaty AI",

            message +

            "\n\nخطای اصلی:\n" +

            (
                error.message ||
                String(error)
            ) +

            "\n\nEndpoint:\n" +

            EDGE_FUNCTION_URL +

            "\n\nModel:\n" +

            AI_MODEL

        );


        addMessage(
            "❌ پاسخ دریافت نشد. جزئیات خطا را در بخش خطا ببین.",
            "ai"
        );

    }


    sendButton.disabled =
    false;

}


/* =====================================================
   SEND BUTTON
===================================================== */

sendButton.addEventListener(
"click",
sendMessage
);


/* =====================================================
   ENTER
===================================================== */

messageInput.addEventListener(
"keydown",
function(event){

    if(
        event.key === "Enter" &&
        !event.shiftKey
    ){

        event.preventDefault();

        sendMessage();

    }

});


/* =====================================================
   AUTO RESIZE
===================================================== */

messageInput.addEventListener(
"input",
function(){

    this.style.height =
    "auto";

    this.style.height =
    Math.min(
        this.scrollHeight,
        110
    ) + "px";

});

   TEST CONNECTION

    console.log(
        "Testing Chaty Edge Function..."
    );

    console.log(
        "URL:",
        EDGE_FUNCTION_URL
    );

    console.log(
        "Model:",
        AI_MODEL
    );

}

   START

testEdgeFunction();
