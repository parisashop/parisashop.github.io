<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Chaty AI</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:Arial,Tahoma,sans-serif;background:#000;color:#fff}
button,input,textarea{font-family:inherit}
button{cursor:pointer}

.app{
width:100%;
max-width:600px;
height:100dvh;
min-height:100vh;
margin:auto;
background:#000;
display:flex;
flex-direction:column;
position:relative
}

.header{
height:64px;
min-height:64px;
background:#000;
border-bottom:1px solid #222;
display:flex;
align-items:center;
justify-content:space-between;
padding:6px 14px;
position:relative;
z-index:10
}

.headerRight{
display:flex;
align-items:center;
gap:10px
}

.character{
width:43px;
height:43px;
border-radius:50%;
background:#222;
object-fit:cover;
border:1px solid #444
}

.characterInfo{
display:flex;
flex-direction:column;
gap:3px
}

.characterName{
font-size:16px;
font-weight:bold
}

.characterModel{
font-size:11px;
color:#888
}

.headerButton{
width:40px;
height:40px;
border:1px solid #333;
border-radius:50%;
background:#111;
color:#fff;
font-size:20px
}

/* AI SWITCHER */

.aiSwitcher{
position:absolute;
left:50%;
transform:translateX(-50%);
top:9px;
height:46px;
padding:4px;
border:1px solid #292929;
background:#111;
border-radius:24px;
display:flex;
align-items:center;
gap:3px;
z-index:50;
box-shadow:0 5px 20px #000
}

.aiSwitch{
height:36px;
padding:0 12px;
border:0;
border-radius:19px;
background:transparent;
color:#777;
font-size:12px;
font-weight:bold;
white-space:nowrap;
transition:.25s
}

.aiSwitch.active{
background:#fff;
color:#000
}

.aiSwitch:active{
transform:scale(.96)
}

#ahooraSwitch.loading{
background:#222;
color:#fff
}

.switchLoader{
display:none;
width:13px;
height:13px;
border:2px solid #555;
border-top-color:#fff;
border-radius:50%;
animation:spin .7s linear infinite;
vertical-align:-2px;
margin-left:4px
}

#ahooraSwitch.loading .switchLoader{
display:inline-block
}

@keyframes spin{
to{transform:rotate(360deg)}
}

/* CHAT */

.chat{
flex:1;
overflow-y:auto;
padding:12px 12px 92px;
display:flex;
flex-direction:column;
gap:12px;
scroll-behavior:smooth;
-webkit-overflow-scrolling:touch
}

.message{
max-width:84%;
padding:11px 14px;
border-radius:18px;
line-height:1.8;
font-size:15px;
word-wrap:break-word;
white-space:pre-wrap
}

.userMessage{
align-self:flex-start;
background:#fff;
color:#000;
border-bottom-left-radius:5px
}

.aiMessage{
align-self:flex-end;
background:#181818;
color:#fff;
border:1px solid #292929;
border-bottom-right-radius:5px
}

.messageName{
font-size:10px;
color:#777;
margin-bottom:3px
}

.typing{
display:none;
align-self:flex-end;
background:#181818;
border:1px solid #292929;
border-radius:18px;
padding:10px 15px;
color:#aaa
}

.dot{
display:inline-block;
width:6px;
height:6px;
background:#aaa;
border-radius:50%;
margin:0 2px;
animation:blink 1s infinite
}

.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}

@keyframes blink{
0%,100%{opacity:.2}
50%{opacity:1}
}

/* TTS + VOICE */

.ttsButton{
margin-top:9px;
width:34px;
height:34px;
border:1px solid #333;
border-radius:50%;
background:#111;
color:#fff;
font-size:16px;
display:flex;
align-items:center;
justify-content:center;
transition:.2s
}

.ttsButton:active{
transform:scale(.9)
}

.ttsButton.loading{
animation:ttsPulse 1s infinite;
}

@keyframes ttsPulse{
0%,100%{
opacity:.55;
transform:scale(1)
}
50%{
opacity:1;
transform:scale(1.08)
}
}

.voiceButton{
width:44px;
height:44px;
flex-shrink:0;
border:0;
border-radius:50%;
background:#222;
color:#fff;
font-size:20px;
display:flex;
align-items:center;
justify-content:center;
position:relative;
transition:.2s
}

.voiceButton.listening{
background:#fff;
color:#000;
animation:voicePulse 1s infinite
}

@keyframes voicePulse{
0%,100%{
transform:scale(1)
}
50%{
transform:scale(1.12)
}
}

.voiceStatus{
position:absolute;
bottom:70px;
right:18px;
background:#181818;
border:1px solid #333;
border-radius:20px;
padding:8px 13px;
font-size:12px;
color:#aaa;
display:none;
z-index:50;
white-space:nowrap
}

/* INPUT */

.inputArea{
position:absolute;
left:10px;
right:10px;
bottom:calc(10px + env(safe-area-inset-bottom));
min-height:56px;
background:#111;
border:1px solid #2b2b2b;
border-radius:30px;
display:flex;
align-items:flex-end;
gap:8px;
padding:6px;
z-index:20;
box-shadow:0 5px 30px #000

#messageInput{
flex:1;
min-width:0;
max-height:100px;
resize:none;
border:0;
outline:none;
background:transparent;
color:#fff;
font-size:15px;
line-height:1.6;
padding:8px
}

#messageInput::placeholder{
color:#777

.sendButton{
width:44px;
height:44px;
flex-shrink:0;
border:0;
border-radius:50%;
background:#fff;
color:#000;
font-size:20px;
display:flex;
align-items:center;
justify-content:center
}

.sendButton:disabled{
opacity:.4
}

/* PANEL */

.panel{
position:fixed;
inset:0;
z-index:100;
display:none;
background:#000;
padding:calc(10px + env(safe-area-inset-top)) 12px 20px;
overflow-y:auto
}

.panelHeader{
height:55px;
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:10px
}

.panelTitle{
font-size:20px;
font-weight:bold
}

.closeButton{
width:40px;
height:40px;
border-radius:50%;
border:1px solid #333;
background:#111;
color:white;
font-size:20px
}

.characterGrid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
padding-bottom:20px
}

.characterCard{
min-height:120px;
border:1px solid #292929;
border-radius:18px;
background:#111;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:8px;
color:#fff;
padding:10px
}

.characterCard img{
width:62px;
height:62px;
border-radius:50%;
object-fit:cover;
border:1px solid #444
}

.characterCard span{
font-size:13px
}

/* ERROR */

.errorBox{
display:none;
margin:8px 10px 86px;
padding:12px;
border:1px solid #552222;
background:#180909;
border-radius:15px;
color:#ff9999;
font-size:12px;
line-height:1.8;
direction:ltr;
text-align:left;
white-space:pre-wrap;
max-height:220px;
overflow:auto;
position:absolute;
bottom:0;
left:0;
right:0;
z-index:30
}

.clearError{
margin-top:8px;
padding:7px 12px;
border:1px solid #555;
background:#111;
color:white;
border-radius:10px
}

/* LOGIN */

#loginScreen{
position:fixed;
inset:0;
z-index:9999;
background:#000;
display:none;
align-items:center;
justify-content:center;
padding:20px
}

.loginBox{
width:100%;
max-width:400px;
background:#111;
border:1px solid #292929;
border-radius:25px;
padding:25px;
text-align:center
}

.loginTitle{
font-size:28px;
font-weight:bold;
margin-bottom:10px
}

.loginText{
color:#888;
line-height:1.8;
margin-bottom:20px
}

.loginInput{
width:100%;
padding:14px;
background:#080808;
border:1px solid #333;
border-radius:15px;
color:white;
outline:none;
margin-bottom:10px;
font-size:15px;
direction:ltr
}

.loginButton{
width:100%;
padding:14px;
border:0;
border-radius:15px;
background:white;
color:black;
font-size:15px
}

/* AHOORA */

#ahooraLoading{
position:fixed;
inset:0;
z-index:9998;
background:#000;
display:none;
align-items:center;
justify-content:center;
flex-direction:column;
gap:18px;
opacity:0;
transition:opacity .25s

.ahooraLoadingCircle{
width:58px;
height:58px;
border:4px solid #222;
border-top-color:#fff;
border-right-color:#aaa;
border-radius:50%;
animation:spin .8s linear infinite
}

.ahooraLoadingText{
font-size:15px;
color:#aaa
}

.ahooraLoadingSub{
font-size:11px;
color:#555
}

#ahooraFrame{
position:fixed;
inset:0;
width:100%;
height:100%;
border:0;
background:#000;
display:none;
z-index:9997
}

@media(max-height:650px){

.header{
height:58px;
min-height:58px
}

.character{
width:38px;
height:38px
}

.headerButton{
width:38px;
height:38px

.chat{
padding-bottom:88px
}

.aiSwitcher{
top:6px;
height:43px
}

.aiSwitch{
height:33px;
padding:0 9px;
font-size:11px

}

@media(min-width:601px){

.inputArea{
left:50%;
right:auto;
transform:translateX(-50%);
width:min(580px,calc(100% - 20px))
}
}

</style>
</head>

<script>

/* =========================
SUPABASE
========================= */

const SUPABASE_URL=
"https://vkqmlfumodqmmylchgdx.supabase.co";

const SUPABASE_ANON_KEY=
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZrcW1sZnVtb2RxbW15bGNoZ2R4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4MzY1MTgsImV4cCI6MjEwMzQxMjUxOH0.nmpfSMDR44_1BB7EdRtgvsde-D2d-uh_QgaSk5fCJ48";

const supabaseClient=
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);


/* =========================
EDGE FUNCTION
========================= */

const EDGE_FUNCTION_URL=
"https://vkqmlfumodqmmylchgdx.supabase.co/functions/v1/bright-endpoint";


/*
 * مهم:
 * این مدل باید توسط Edge Function
 * مستقیماً به OpenRouter ارسال شود.
 */

const AI_MODEL=
"openrouter/free";


/* =========================
TTS MODEL
========================= */

const TTS_MODEL=
"fish-audio/s2.1-pro-free:free";

let currentAudio=null;

let recognition=null;

let isListening=false;

let speechFinalText="";


/* =========================
ELEMENTS
========================= */

const chat=
document.getElementById("chat");

const messageInput=
document.getElementById("messageInput");

const sendButton=
document.getElementById("sendButton");

const typing=
document.getElementById("typing");

const errorBox=
document.getElementById("errorBox");

const characterPanel=
document.getElementById("characterPanel");

const characterButton=
document.getElementById("characterButton");

const closeCharacterPanel=
document.getElementById("closeCharacterPanel");

const headerCharacter=
document.getElementById("headerCharacter");

const characterName=
document.getElementById("characterName");

const loginScreen=
document.getElementById("loginScreen");

const emailInput=
document.getElementById("emailInput");

const loginButton=
document.getElementById("loginButton");

const verifyButton=
document.getElementById("verifyButton");

const otpInput=
document.getElementById("otpInput");

const otpArea=
document.getElementById("otpArea");

const loginMessage=
document.getElementById("loginMessage");

const chatySwitch=
document.getElementById("chatySwitch");

const ahooraSwitch=
document.getElementById("ahooraSwitch");

const ahooraLoading=
document.getElementById("ahooraLoading");

const ahooraFrame=
document.getElementById("ahooraFrame");

const voiceButton=
document.getElementById("voiceButton");

const voiceStatus=
document.getElementById("voiceStatus");


let selectedCharacter=
"Chaty AI";

let selectedImage=
"https://ui-avatars.com/api/?name=Chaty&background=222&color=fff";

let loginEmail="";

let ahooraLoaded=false;

let ahooraLoadingStarted=false;


/* =========================
HELPERS
========================= */

function escapeHTML(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function showError(title,details){

errorBox.style.display="block";

errorBox.innerHTML=
"<b>"+
escapeHTML(title)+
"</b>\n\n"+
escapeHTML(details)+
"\n\n<button class='clearError' onclick='clearError()'>پاک کردن خطا</button>";

scrollBottom();

}


function clearError(){

errorBox.style.display="none";

errorBox.innerHTML="";

}


function scrollBottom(){

setTimeout(()=>{

chat.scrollTop=
chat.scrollHeight;

},50);

}


function addMessage(text,type){

const div=
document.createElement("div");

div.className=
"message "+
(type==="user"?
"userMessage":
"aiMessage");

if(type!=="user"){

const name=
document.createElement("div");

name.className="messageName";

name.textContent=
selectedCharacter;

const content=
document.createElement("div");

content.className=
"messageText";

content.textContent=text;

const ttsButton=
document.createElement("button");

ttsButton.className=
"ttsButton";

ttsButton.type=
"button";

ttsButton.textContent=
"🔊";

ttsButton.title=
"خواندن پاسخ";

ttsButton.addEventListener(
"click",
()=>speakText(
text,
ttsButton
)
);

div.appendChild(name);

div.appendChild(content);

div.appendChild(ttsButton);

}else{

div.textContent=text;

}

chat.insertBefore(div,typing);

scrollBottom();

return div;

}


/* =========================
TEXT TO SPEECH
========================= */

function stopAudio(){

if(currentAudio){

currentAudio.pause();

currentAudio.currentTime=0;

currentAudio=null;

}

document
.querySelectorAll(".ttsButton")
.forEach(button=>{

button.textContent="🔊";

button.classList.remove(
"loading"
);

});

}


async function speakText(
text,
button
){

if(!text)
return;


if(
currentAudio &&
!currentAudio.paused
){

stopAudio();

return;

}


stopAudio();


if(button){

button.textContent="⏳";

button.classList.add(
"loading"
);

}


try{

const response=
await fetch(
EDGE_FUNCTION_URL,
{

method:"POST",

headers:{

"Content-Type":
"application/json",

"Authorization":
"Bearer "+
SUPABASE_ANON_KEY,

"apikey":
SUPABASE_ANON_KEY

},

body:JSON.stringify({

action:"tts",

text:text,

message:text,

model:TTS_MODEL,

voice:"default"

})

}
);


if(!response.ok){

const errorText=
await response.text();

throw new Error(
"HTTP "+
response.status+
"\n"+
errorText
);

}


/*
اگر Edge Function
فایل صوتی مستقیم برگرداند
*/

const contentType=
response.headers.get(
"content-type"
)||
"";


if(
contentType.includes("audio")
){

const blob=
await response.blob();

const audioURL=
URL.createObjectURL(
blob
);

currentAudio=
new Audio(
audioURL
);


}else{

/*
اگر Edge Function
JSON با audio_url یا audio_base64
برگرداند
*/

const data=
await response.json();


let audioURL=
data.audio_url ||
data.url ||
data.audio ||
null;


if(
!audioURL &&
data.audio_base64
){

const binary=
atob(
data.audio_base64
);

const bytes=
new Uint8Array(
binary.length
);

for(
let i=0;
i<binary.length;
i++
){

bytes[i]=
binary.charCodeAt(i);

}

const blob=
new Blob(
[bytes],
{
type:
data.mime_type ||
"audio/mpeg"
}
);

audioURL=
URL.createObjectURL(
blob
);

}


if(!audioURL){

throw new Error(
"آدرس یا فایل صوتی در پاسخ پیدا نشد."
);

}


currentAudio=
new Audio(
audioURL
);

}


currentAudio.onplay=
()=>{

if(button){

button.textContent=
"⏹️";

button.classList.remove(
"loading"
);

}

};


currentAudio.onended=
()=>{

if(button){

button.textContent=
"🔊";

button.classList.remove(
"loading"
);

}

currentAudio=null;

};


currentAudio.onerror=
()=>{

if(button){

button.textContent=
"🔊";

button.classList.remove(
"loading"
);

}

showError(
"❌ خطا در پخش صدا",
"فایل صوتی قابل پخش نیست."
);

};


await currentAudio.play();


}catch(error){

console.error(
"TTS ERROR:",
error
);

if(button){

button.textContent=
"🔊";

button.classList.remove(
"loading"
);

}

showError(

"❌ خطا در تبدیل متن به صدا",

error.message ||
String(error)

);

}

}


/* =========================
VOICE TO TEXT
========================= */

function setupSpeechRecognition(){

const SpeechRecognition=
window.SpeechRecognition ||
window.webkitSpeechRecognition;


if(!SpeechRecognition){

voiceButton.style.display=
"none";

console.warn(
"SpeechRecognition not supported"
);

return;

}


recognition=
new SpeechRecognition();

recognition.lang=
"fa-IR";

recognition.continuous=
false;

recognition.interimResults=
true;

recognition.maxAlternatives=
1;


recognition.onstart=
()=>{

isListening=true;

speechFinalText="";

voiceButton.classList.add(
"listening"
);

voiceButton.textContent=
"🔴";

voiceStatus.style.display=
"block";

voiceStatus.textContent=
"🎙️ در حال گوش دادن...";

};


recognition.onresult=
event=>{

let interimText="";

let finalText="";


for(
let i=event.resultIndex;
i<event.results.length;
i++
){

const resultText=
event.results[i][0].transcript;

if(
event.results[i].isFinal
){

finalText+=
resultText;

}else{

interimText+=
resultText;

}

}


if(finalText){

speechFinalText+=
finalText;

}


messageInput.value=
(
speechFinalText+
interimText
).trim();


messageInput.dispatchEvent(
new Event("input")
);


voiceStatus.textContent=
"📝 "+
messageInput.value;

};


recognition.onerror=
event=>{

console.error(
"VOICE ERROR:",
event.error
);


if(
event.error==="not-allowed" ||
event.error==="service-not-allowed"
){

showError(

"❌ دسترسی میکروفون",

"اجازه استفاده از میکروفون داده نشده است."

);

}


};


recognition.onend=
()=>{

isListening=false;

voiceButton.classList.remove(
"listening"
);

voiceButton.textContent=
"🎙️";

voiceStatus.style.display=
"none";


const text=
speechFinalText.trim();


speechFinalText="";


if(text){

messageInput.value=text;

messageInput.dispatchEvent(
new Event("input")
);


/*
بعد از پایان صحبت
پیام خودکار ارسال می‌شود
*/

setTimeout(
()=>{

sendMessage();

},
400
);

}

};

}


function toggleVoiceInput(){

if(!recognition){

showError(

"❌ میکروفون پشتیبانی نمی‌شود",

"این نسخه WebView از تبدیل گفتار به متن پشتیبانی نمی‌کند."

);

return;

}


if(isListening){

recognition.stop();

return;

}


try{

recognition.start();

}catch(error){

console.error(
"Recognition start error:",
error
);

}

}


voiceButton.addEventListener(
"click",
toggleVoiceInput
);


setupSpeechRecognition();

/* =========================
EXTRACT REPLY
========================= */

function extractReply(data){

if(typeof data==="string" && data.trim())
return data.trim();

if(data &&
typeof data.reply==="string" &&
data.reply.trim())
return data.reply.trim();

if(data &&
typeof data.answer==="string" &&
data.answer.trim())
return data.answer.trim();

if(data &&
typeof data.message==="string" &&
data.message.trim())
return data.message.trim();

if(data &&
typeof data.response==="string" &&
data.response.trim())
return data.response.trim();

if(data &&
typeof data.content==="string" &&
data.content.trim())
return data.content.trim();

if(data &&
typeof data.text==="string" &&
data.text.trim())
return data.text.trim();

if(
data &&
data.choices &&
data.choices[0]
){

if(
data.choices[0].message &&
typeof data.choices[0].message.content==="string"
)
return data.choices[0].message.content.trim();

if(
typeof data.choices[0].text==="string"
)
return data.choices[0].text.trim();

}

return null;

}


/* =========================
SEND
========================= */

async function sendMessage(){

const text=
messageInput.value.trim();

if(!text || sendButton.disabled)
return;

clearError();

addMessage(text,"user");

messageInput.value="";

messageInput.style.height="auto";

sendButton.disabled=true;

typing.style.display="block";

scrollBottom();


try{

const response=
await fetch(
EDGE_FUNCTION_URL,
{

method:"POST",

headers:{
"Content-Type":"application/json",
"Authorization":
"Bearer "+
SUPABASE_ANON_KEY,
"apikey":
SUPABASE_ANON_KEY
},

body:JSON.stringify({

name:text,

message:text,

prompt:text,

model:AI_MODEL,

character:selectedCharacter,

system:getSystemPrompt()

})

}
);


const raw=
await response.text();


if(!response.ok){

throw new Error(
"HTTP "+
response.status+
" "+
(response.statusText||"")+
"\n\nServer response:\n"+
raw
);

}


if(!raw.trim())
throw new Error(
"Edge Function پاسخ خالی برگرداند."
);


let data;

try{

data=
JSON.parse(raw);

}catch(e){

throw new Error(
"پاسخ Edge Function JSON معتبر نیست.\n\nRaw response:\n"+
raw
);

}


console.log(
"Chaty response:",
data
);


const answer=
extractReply(data);


if(!answer){

throw new Error(
"پاسخ هوش مصنوعی در داده دریافتی پیدا نشد.\n\nJSON دریافت شده:\n"+
JSON.stringify(
data,
null,
2
)
);

}


typing.style.display="none";

addMessage(
answer,
"ai"
);


}catch(error){

console.error(
"CHATY ERROR:",
error
);

typing.style.display="none";


let details="";


if(error instanceof TypeError){

details=
"احتمالاً مشکل اتصال اینترنت، CORS، SSL یا در دسترس نبودن Edge Function وجود دارد.";

}


showError(

"❌ خطا در اتصال به Chaty AI",

(details?
details+
"\n\n":
"")+

"خطای اصلی:\n"+
(error.message||
String(error))+

"\n\nEndpoint:\n"+
EDGE_FUNCTION_URL+

"\n\nModel:\n"+
AI_MODEL

);


addMessage(
"❌ پاسخ دریافت نشد. جزئیات خطا را در بخش خطا ببین.",
"ai"
);

}


sendButton.disabled=false;

}

/* =========================
LOGIN
========================= */

async function checkSession(){

try{

const {
data,
error
}=
await supabaseClient.auth.getSession();

if(error)
throw error;

if(data.session){

loginScreen.style.display="none";

}else{

loginScreen.style.display="flex";

}

}catch(e){

loginScreen.style.display="flex";

loginMessage.textContent=
"خطا در بررسی ورود: "+
e.message;

}

}


loginButton.addEventListener(
"click",
async()=>{

const email=
emailInput.value
.trim()
.toLowerCase();


if(
!email ||
!email.includes("@")
){

loginMessage.textContent=
"لطفاً ایمیل معتبر وارد کن.";

return;

}


loginEmail=email;

loginButton.disabled=true;

loginButton.textContent=
"در حال ارسال...";

loginMessage.textContent="";


try{

const {
error
}=
await supabaseClient.auth.signInWithOtp({

email:email,

options:{
shouldCreateUser:true
}

});


if(error)
throw error;


otpArea.style.display=
"block";

loginButton.style.display=
"none";

loginMessage.textContent=
"✅ کد ورود ارسال شد.";

otpInput.focus();


}catch(e){

loginMessage.textContent=
"❌ "+
e.message;

loginButton.disabled=false;

loginButton.textContent=
"📩 دریافت کد ورود";

}

}
);


verifyButton.addEventListener(
"click",
async()=>{

const token=
otpInput.value
.replace(/[^0-9]/g,"");


if(token.length!==6){

loginMessage.textContent=
"❌ کد باید ۶ رقمی باشد.";

return;

}


verifyButton.disabled=true;

verifyButton.textContent=
"در حال بررسی...";


try{

const {
data,
error
}=
await supabaseClient.auth.verifyOtp({

email:loginEmail,

token:token,

type:"email"

});


if(error)
throw error;


if(data.session){

loginScreen.style.display=
"none";

}else{

throw new Error(
"ورود انجام نشد؛ Session دریافت نشد."
);

}


}catch(e){

loginMessage.textContent=
"❌ "+
e.message;

verifyButton.disabled=false;

verifyButton.textContent=
"🔐 ورود";

}

}
);


otpInput.addEventListener(
"input",
function(){

this.value=
this.value
.replace(/[^0-9]/g,"")
.slice(0,6);

}
);


supabaseClient.auth.onAuthStateChange(
(event,session)=>{

loginScreen.style.display=
session?
"none":
"flex";

}
);


checkSession();

</script>
