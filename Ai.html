<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Ahoora AI</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Vazir:wght@300;400;700;900&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Vazir,sans-serif;
background:#080812;
color:white;
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
direction:rtl;
}

.app{
width:100%;
max-width:480px;
height:100vh;

background:
radial-gradient(
ellipse at 50% 20%,
#191934,
#080812 80%
);

display:flex;
flex-direction:column;
align-items:center;

padding:20px 16px;
overflow:hidden;
}

.header{
width:100%;
display:flex;
justify-content:space-between;
align-items:center;
padding:5px;
}

.title{
font-size:24px;
font-weight:900;

background:
linear-gradient(
135deg,
#00d4ff,
#7b2ffc,
#ff6fd8
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.time{
font-size:14px;
color:#99aacc;
background:rgba(255,255,255,.05);
padding:7px 16px;
border-radius:30px;
}

.orb-wrapper{
width:220px;
height:220px;
margin:15px auto;

position:relative;

display:flex;
justify-content:center;
align-items:center;
}

.orb{
width:150px;
height:150px;
border-radius:50%;

background:
radial-gradient(
circle at 35% 30%,
#0088ff,
#0033aa
);

box-shadow:
0 0 60px rgba(0,100,255,.5),
0 0 120px rgba(0,100,255,.2);

display:flex;
justify-content:center;
align-items:center;

transition:.4s;
}

.inner-glow{
width:70%;
height:70%;
border-radius:50%;

background:
radial-gradient(
circle at 45% 35%,
rgba(255,255,255,.6),
transparent 70%
);
}

.orb.pulse{
animation:pulse 2s infinite;
}

.orb.listening{

background:
radial-gradient(
circle at 35% 30%,
#00ff99,
#00aaff
);

box-shadow:
0 0 80px rgba(0,255,150,.7);

animation:listen 1s infinite;
}

.orb.processing{

background:
radial-gradient(
circle at 35% 30%,
#ffcc00,
#ff6600
);

animation:process .5s infinite;
}

@keyframes pulse{
0%,100%{transform:scale(1);}
50%{transform:scale(1.04);}
}

@keyframes listen{
0%,100%{transform:scale(1);}
50%{transform:scale(1.08);}
}

@keyframes process{
0%,100%{transform:scale(1);}
50%{transform:scale(1.05);}
}

.mic-btn{

width:76px;
height:76px;

border-radius:50%;
border:none;

background:
linear-gradient(
135deg,
#0066ff,
#4400cc
);

color:white;
font-size:36px;

display:flex;
align-items:center;
justify-content:center;

box-shadow:
0 10px 40px rgba(0,80,255,.5);
}

.mic-btn.listening{

background:
linear-gradient(
135deg,
#ff2266,
#cc0066
);

animation:micpulse 1s infinite;
}

@keyframes micpulse{

0%,100%{
box-shadow:0 0 40px rgba(255,0,100,.5);
}

50%{
box-shadow:0 0 90px rgba(255,0,100,.9);
}

}

.status{

margin:10px;
padding:7px 20px;

border-radius:30px;

background:rgba(255,255,255,.05);

color:#aac;

display:flex;

gap:10px;

align-items:center;
}

.dot{

width:10px;
height:10px;

border-radius:50%;

background:#555;
}

.dot.listening{

background:#00ff88;

box-shadow:0 0 15px #00ff88;
}

.dot.processing{

background:#ffaa00;

box-shadow:0 0 15px #ffaa00;
}

.user-text{

width:100%;

min-height:50px;

padding:12px;

border-radius:24px;

background:rgba(255,255,255,.04);

text-align:center;

font-size:17px;
}

.response-card{

width:100%;

max-height:200px;

overflow:auto;

margin-top:10px;

padding:18px;

border-radius:28px;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.07);

text-align:center;

font-size:17px;

line-height:1.8;
}

.action-btn{

border:0;

padding:11px 25px;

border-radius:25px;

background:#00cc77;

color:white;

font-family:inherit;

font-size:16px;

margin:5px;
}

.cancel-btn{

background:#cc3355;
}

</style>
</head>

<body>

<div class="app">

<div class="header">

<div class="title">
✨ Ahoora AI
</div>

<div class="time" id="headerTime">
--:--
</div>

</div>

<div class="orb-wrapper">

<div class="orb pulse" id="orb">

<div class="inner-glow"></div>

</div>

</div>

<button class="mic-btn" id="micBtn">

<i class="fas fa-microphone" id="micIcon"></i>

</button>

<div class="status">

<span class="dot" id="statusDot"></span>

<span id="statusText">
آماده
</span>

</div>

<div class="user-text" id="userText">

برای صحبت دکمه میکروفون را بزنید

</div>

<div class="response-card">

<div id="responseText">

👋 سلام! من اهورا هستم، چطور می‌توانم کمک کنم؟

</div>

</div>

</div>

<script>

"use strict";

/* =========================
   عناصر
========================= */

const orb =
document.getElementById("orb");

const micBtn =
document.getElementById("micBtn");

const micIcon =
document.getElementById("micIcon");

const statusText =
document.getElementById("statusText");

const statusDot =
document.getElementById("statusDot");

const userText =
document.getElementById("userText");

const responseText =
document.getElementById("responseText");

const headerTime =
document.getElementById("headerTime");


let recognition = null;

let listening = false;

let processing = false;

let pendingPhone = null;

let pendingMessage = null;


/* =========================
   Android
========================= */

function androidAvailable(){

return typeof window.Android !== "undefined";

}


/* =========================
   ساعت
========================= */

function clock(){

const d = new Date();

headerTime.textContent =
String(d.getHours()).padStart(2,"0")
+
":"
+
String(d.getMinutes()).padStart(2,"0");

}

clock();

setInterval(clock,10000);


/* =========================
   وضعیت
========================= */

function status(text,type=""){

statusText.textContent = text;

statusDot.className =
"dot " + type;

}


/* =========================
   پاسخ
========================= */

function response(text){

responseText.innerHTML = text;

}


/* =========================
   نرمال سازی فارسی
========================= */

function normalize(text){

return text

.replace(/[۰-۹]/g,function(d){

return String(
"۰۱۲۳۴۵۶۷۸۹".indexOf(d)
);

})

.replace(/ي/g,"ی")
.replace(/ك/g,"ک")

.replace(/ۀ/g,"ه")

.replace(/\s+/g," ")

.trim()
.toLowerCase();

}


/* =========================
   پخش صدای پاسخ
========================= */

function playAnswer(file){

try{

const audio =
new Audio(file);

audio.preload="auto";

audio.play().catch(function(e){

console.log("Audio error:",e);

});

}catch(e){

console.log(e);

}

}


/* =========================
   پاسخ‌های صوتی
========================= */

function voiceOK(){

playAnswer("a.mp3");

}

function voiceError(){

playAnswer("b.mp3");

}

function voiceConfirmCall(){

playAnswer("c.mp3");

}

function voiceErrorCommand(){

playAnswer("d.mp3");

}

function voiceHello(){

playAnswer("e.mp3");

}

function voiceTime(){

playAnswer("f.mp3");

}

function voiceGoogle(){

playAnswer("g.mp3");

}


/* =========================
   باز کردن برنامه
========================= */

function openApp(packageName,name,url){

if(androidAvailable()){

try{

Android.openApp(packageName);

response(
"📱 در حال باز کردن "+name+" ..."
);

voiceOK();

return;

}catch(e){

console.log(e);

}

}

if(url){

window.location.href=url;

}else{

voiceError();

response(
"❌ برنامه "+name+" باز نشد."
);

}

}


/* =========================
   تماس با شماره
========================= */

function callNumber(number){

number=normalize(number);

number=
number.replace(/[^0-9+]/g,"");

if(!number){

voiceError();

return;

}

if(androidAvailable()){

try{

Android.makeCall(number);

response(
"📞 در حال تماس با "+number
);

voiceOK();

return;

}catch(e){

console.log(e);

}

}

window.location.href=
"tel:"+number;

}


/* =========================
   جستجوی مخاطب
========================= */

function findContact(name,action){

if(!androidAvailable()){

voiceError();

response(
"این قابلیت فقط داخل برنامه اندروید فعال است."
);

return;

}

try{

Android.findContact(
name,
action
);

status(
"در حال پیدا کردن مخاطب...",
"processing"
);

}catch(e){

console.log(e);

voiceError();

}

}


/* =========================
   پاسخ Java برای مخاطب
========================= */

window.contactResult=function(
found,
name,
number,
action
){

if(!found){

status("مخاطب پیدا نشد","");

voiceError();

response(
"❌ مخاطب «"+
name+
"» در مخاطبین پیدا نشد."
);

return;

}

number =
number || "";

if(action==="call"){

pendingPhone=number;

status(
"تأیید تماس",
""
);

response(

"📞 با «"+
name+
"» تماس بگیرم؟<br><br>"+

"<button class='action-btn' onclick='confirmCall()'>"+
"تماس"+
"</button>"+

"<button class='action-btn cancel-btn' onclick='cancelAction()'>"+
"لغو"+
"</button>"

);

voiceConfirmCall();

return;

}


if(action==="sms"){

pendingPhone=number;

pendingMessage=
"سلام، این پیام از طرف اهورا AI است.";

status(
"تأیید پیامک",
""
);

response(

"✉️ برای «"+
name+
"» پیام ارسال کنم؟<br><br>"+

"<button class='action-btn' onclick='confirmSMS()'>"+
"ارسال"+
"</button>"+

"<button class='action-btn cancel-btn' onclick='cancelAction()'>"+
"لغو"+
"</button>"

);

return;

}


if(action==="open"){

if(androidAvailable()){

Android.openContactMessages(number);

response(
"💬 در حال باز کردن پیام‌های «"+
name+
"»..."
);

voiceOK();

}

}

};


/* =========================
   تأیید تماس
========================= */

window.confirmCall=function(){

if(pendingPhone){

callNumber(
pendingPhone
);

pendingPhone=null;

}

};


/* =========================
   تأیید SMS
========================= */

window.confirmSMS=function(){

if(!pendingPhone){

return;

}

if(androidAvailable()){

try{

Android.sendSMS(
pendingPhone,
pendingMessage || ""
);

response(
"✉️ پیامک ارسال شد."
);

voiceOK();

}catch(e){

voiceError();

}

}else{

window.location.href=
"sms:"+
pendingPhone+
"?body="+
encodeURIComponent(
pendingMessage || ""
);

}

pendingPhone=null;

pendingMessage=null;

};


/* =========================
   لغو
========================= */

window.cancelAction=function(){

pendingPhone=null;

pendingMessage=null;

status(
"آماده",
""
);

response(
"باشه، لغو شد."
);

};


/* =========================
   دوربین
========================= */

function openCamera(){

if(androidAvailable()){

Android.openCamera();

response(
"📷 دوربین باز شد."
);

voiceOK();

return;

}

const input =
document.createElement("input");

input.type="file";

input.accept="image/*";

input.capture="environment";

input.click();

}


/* =========================
   گالری
========================= */

function openGallery(){

if(androidAvailable()){

Android.openGallery();

response(
"🖼️ گالری باز شد."
);

voiceOK();

return;

}

const input =
document.createElement("input");

input.type="file";

input.accept="image/*,video/*";

input.click();

}


/* =========================
   صدا
========================= */

function volume(direction){

if(androidAvailable()){

Android.adjustVolume(direction);

response(

direction==="up"
?
"🔊 صدا زیاد شد."
:
"🔉 صدا کم شد."

);

voiceOK();

return;

}

response(
"این قابلیت فقط در APK فعال است."
);

}


/* =========================
   موسیقی
========================= */

function musicToggle(){

if(androidAvailable()){

Android.toggleMusic();

response(
"🎵 پخش موسیقی اجرا شد."
);

voiceOK();

}else{

response(
"این قابلیت فقط در APK فعال است."
);

}

}


function musicStop(){

if(androidAvailable()){

Android.stopMusic();

response(
"⏹️ موسیقی متوقف شد."
);

voiceOK();

}

}


/* =========================
   گوگل
========================= */

function searchGoogle(query){

const url =
"https://www.google.com/search?q="+
encodeURIComponent(query);

voiceGoogle();

if(androidAvailable()){

Android.openUrl(url);

}else{

window.location.href=url;

}

response(
"🔎 در حال جستجوی «"+
query+
"» در گوگل..."
);

}


/* =========================
   باز کردن فایل صوتی
========================= */

function playAudioFile(file){

if(androidAvailable()){

Android.playMedia(file);

response(
"🎵 در حال پخش فایل صوتی..."
);

return;

}

const audio =
new Audio(file);

audio.play();

}


/* =========================
   باز کردن ویدیو
========================= */

function playVideo(file){

if(androidAvailable()){

Android.playMedia(file);

response(
"🎬 در حال پخش ویدیو..."
);

return;

}

window.open(file,"_blank");

}


/* =========================
   URL
========================= */

function openURL(url){

if(androidAvailable()){

Android.openUrl(url);

}else{

window.location.href=url;

}

}


/* =========================
   تشخیص گفتار
========================= */

function initRecognition(){

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(!SpeechRecognition){

response(
"❌ تشخیص گفتار در این WebView پشتیبانی نمی‌شود."
);

voiceError();

return false;

}

recognition =
new SpeechRecognition();

recognition.lang =
"fa-IR";

recognition.continuous =
false;

recognition.interimResults =
false;

recognition.maxAlternatives =
1;


recognition.onstart=function(){

listening=true;

processing=false;

status(
"در حال گوش دادن...",
"listening"
);

micBtn.classList.add(
"listening"
);

orb.className =
"orb listening";

micIcon.className =
"fas fa-circle-notch fa-spin";

};


recognition.onresult=function(event){

const text =
event.results[0][0]
.transcript
.trim();

userText.textContent =
text;

listening=false;

processing=true;

micBtn.classList.remove(
"listening"
);

orb.className =
"orb processing";

micIcon.className =
"fas fa-microphone";

processCommand(text);

};


recognition.onerror=function(event){

console.log(event.error);

listening=false;

processing=false;

micBtn.classList.remove(
"listening"
);

orb.className =
"orb pulse";

micIcon.className =
"fas fa-microphone";

status(
"خطا در تشخیص صدا",
""
);

voiceErrorCommand();

response(
"❌ نتوانستم صدای شما را تشخیص بدهم."
);

};


recognition.onend=function(){

listening=false;

micBtn.classList.remove(
"listening"
);

micIcon.className =
"fas fa-microphone";

};

return true;

}


/* =========================
   شروع گوش دادن
========================= */

function startListening(){

if(!recognition){

if(!initRecognition()){

return;

}

}

if(listening){

return;

}

try{

recognition.start();

}catch(e){

console.log(e);

}

}


/* =========================
   پردازش فرمان‌ها
========================= */

function processCommand(original){

const text =
normalize(original);

status(
"در حال پردازش...",
"processing"
);


/* =========================
   سلام
========================= */

if(
/^(سلام|درود|هی|هلو)/.test(text)
){

response(
"👋 سلام! من اهورا هستم."
);

voiceHello();

finish();

return;

}


/* =========================
   تماس با شماره
========================= */

let phone =
text.match(
/(?:با\s*)?(?:شماره\s*)?(\+?[0-9]{10,15})\s*(?:رو\s*)?(?:بگیر|تماس|زنگ)/
);

if(phone){

pendingPhone =
phone[1];

voiceConfirmCall();

response(

"📞 با شماره "+
pendingPhone+
" تماس بگیرم؟<br><br>"+

"<button class='action-btn' onclick='confirmCall()'>"+
"تماس"+
"</button>"+

"<button class='action-btn cancel-btn' onclick='cancelAction()'>"+
"لغو"+
"</button>"

);

status(
"تأیید تماس",
""
);

return;

}


/* =========================
   تماس با مامان / مخاطب
========================= */

if(
/(?:با\s*)?(مامان|مادرم|مادر|بابام|پدرم|همسرم|برادرم|خواهرم).*(?:تماس|زنگ)/.test(text)
){

let m =
text.match(
/(?:با\s*)?(مامان|مادرم|مادر|بابام|پدرم|همسرم|برادرم|خواهرم)/
);

if(m){

findContact(
m[1],
"call"
);

return;

}

}


/* =========================
   پیامک به مخاطب
========================= */

if(
/(?:به\s*)?(مامان|مادرم|مادر|بابام|پدرم|همسرم|برادرم|خواهرم).*(?:پیام|پیامک)/.test(text)
){

let m =
text.match(
/(?:به\s*)?(مامان|مادرم|مادر|بابام|پدرم|همسرم|برادرم|خواهرم)/
);

if(m){

findContact(
m[1],
"sms"
);

return;

}

}


/* =========================
   باز کردن پیام مخاطب
========================= */

if(
/(?:پیام|پیامک).*(مامان|مادرم|مادر|بابام|پدرم|همسرم|برادرم|خواهرم).*(?:باز|بخون)/.test(text)
){

let m =
text.match(
/(?:مامان|مادرم|مادر|بابام|پدرم|همسرم|برادرم|خواهرم)/
);

if(m){

findContact(
m[0],
"open"
);

return;

}

}


/* =========================
   واتساپ
========================= */

if(
/واتساپ.*(?:باز|اجرا)/.test(text)
){

openApp(
"com.whatsapp",
"واتساپ",
"https://www.whatsapp.com/"
);

return;

}


/* =========================
   تلگرام
========================= */

if(
/تلگرام.*(?:باز|اجرا)/.test(text)
){

openApp(
"org.telegram.messenger",
"تلگرام",
"https://telegram.org/"
);

return;

}


/* =========================
   اینستاگرام
========================= */

if(
/اینستاگرام.*(?:باز|اجرا)/.test(text)
){

openApp(
"com.instagram.android",
"اینستاگرام",
"https://www.instagram.com/"
);

return;

}


/* =========================
   یوتیوب
========================= */

if(
/یوتیوب.*(?:باز|اجرا)/.test(text)
){

openApp(
"com.google.android.youtube",
"یوتیوب",
"https://www.youtube.com/"
);

return;

}


/* =========================
   کروم
========================= */

if(
/کروم.*(?:باز|اجرا)/.test(text)
){

openApp(
"com.android.chrome",
"کروم",
"https://www.google.com/chrome/"
);

return;

}


/* =========================
   تنظیمات
========================= */

if(
/تنظیمات.*(?:باز|اجرا)/.test(text)
){

openApp(
"com.android.settings",
"تنظیمات",
null
);

return;

}


/* =========================
   دوربین
========================= */

if(
/دوربین.*باز/.test(text) ||
/عکس بگیر/.test(text)
){

openCamera();

return;

}


/* =========================
   گالری
========================= */

if(
/گالری.*باز/.test(text) ||
/عکس هام/.test(text) ||
/عکسها/.test(text) ||
/ویدیو هام/.test(text)
){

openGallery();

return;

}


/* =========================
   زیاد کردن صدا
========================= */

if(
/صدا.*(?:زیاد|بالا)/.test(text) ||
/ولوم.*(?:زیاد|بالا)/.test(text)
){

volume("up");

return;

}


/* =========================
   کم کردن صدا
========================= */

if(
/صدا.*(?:کم|پایین)/.test(text) ||
/ولوم.*(?:کم|پایین)/.test(text)
){

volume("down");

return;

}


/* =========================
   موسیقی پخش
========================= */

if(
/(?:موسیقی|آهنگ).*(?:پخش|اجرا|ادامه)/.test(text)
){

musicToggle();

return;

}


/* =========================
   توقف موسیقی
========================= */

if(
/(?:موسیقی|آهنگ).*(?:متوقف|قطع|استاپ)/.test(text)
){

musicStop();

return;

}


/* =========================
   گوگل
========================= */

let google =
text.match(
/(?:در\s*)?(?:گوگل|اینترنت)\s*(?:برای\s*)?(?:جستجو\s*)?(?:کن|کنه)?\s*(.+)/
);

if(google){

searchGoogle(
google[1]
);

return;

}


/* =========================
   URL
========================= */

let url =
original.match(
/https?:\/\/[^\s]+/
);

if(url){

openURL(url[0]);

response(
"🌐 لینک باز شد."
);

voiceOK();

finish();

return;

}


/* =========================
   ساعت
========================= */

if(
/ساعت.*(?:چنده|چند است|الان)/.test(text) ||
/الان ساعت/.test(text)
){

const d =
new Date();

const t =
String(d.getHours())
.padStart(2,"0")
+
":"+
String(d.getMinutes())
.padStart(2,"0");

response(
"🕐 ساعت "+t+" است."
);

voiceTime();

finish();

return;

}


/* =========================
   پخش فایل صوتی
========================= */

if(
/فایل صوتی|صوتی رو پخش|a\.mp3/.test(text)
){

playAudioFile("a.mp3");

finish();

return;

}


/* =========================
   پخش ویدیو
========================= */

if(
/ویدیو رو پخش|ویدیو را پخش/.test(text)
){

response(
"🎬 در حال پخش ویدیو..."
);

if(androidAvailable()){

Android.openGallery();

}else{

openGallery();

}

finish();

return;

}


/* =========================
   محاسبه
========================= */

let calc =
text.match(
/([0-9]+)\s*([+\-*\/])\s*([0-9]+)/
);

if(calc){

const a =
parseFloat(calc[1]);

const op =
calc[2];

const b =
parseFloat(calc[3]);

let result=0;

if(op==="+")
result=a+b;

if(op==="-")
result=a-b;

if(op==="*")
result=a*b;

if(op==="/")
result=a/b;

response(
"🧮 نتیجه: "+result
);

finish();

return;

}


/* =========================
   فرمان ناشناخته
========================= */

response(

"🤔 متوجه فرمان نشدم.<br><br>"+

"مثلاً بگو:<br>"+

"«با مامانم تماس بگیر»<br>"+
"«به مامانم پیام بده»<br>"+
"«پیام مامانم رو باز کن»<br>"+
"«با 09123456789 تماس بگیر»<br>"+
"«واتساپ رو باز کن»<br>"+
"«صدا رو زیاد کن»<br>"+
"«موسیقی رو متوقف کن»<br>"+
"«در گوگل ماینکرفت رو جستجو کن»"

);

voiceErrorCommand();

finish();

}


/* =========================
   پایان فرمان
========================= */

function finish(){

processing=false;

status(
"آماده",
""
);

orb.className =
"orb pulse";

}


/* =========================
   میکروفون
========================= */

micBtn.addEventListener(
"click",
function(){

if(listening){

try{

recognition.stop();

}catch(e){}

}else{

startListening();

}

}
);


/* =========================
   شروع
========================= */

response(
"👋 سلام! من اهورا هستم، چطور می‌توانم کمک کنم؟"
);

</script>

</body>
</html>
