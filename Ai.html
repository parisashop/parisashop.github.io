<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ahoora AI</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- فونت وزیر -->
    <link href="https://fonts.googleapis.com/css2?family=Vazir:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        /* reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazir', sans-serif;
            background: #0a0a0f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow: hidden;
            user-select: none;
            direction: rtl;
        }

        /* کانتینر اصلی */
        .app {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 900px;
            background: radial-gradient(circle at 50% 30%, #1a1a2e, #0a0a0f 80%);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px;
            box-shadow: 0 0 40px rgba(0, 150, 255, 0.05);
        }

        /* هدر */
        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 4px;
            z-index: 10;
        }
        .header .title {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #00d2ff, #7b2ffc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        .header .time {
            font-size: 14px;
            color: #aab;
            background: rgba(255,255,255,0.06);
            padding: 6px 14px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* دایره مرکزی + امواج */
        .orb-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 20px auto 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        /* امواج صوتی (پشت دایره) */
        .wave {
            position: absolute;
            border-radius: 50%;
            border: 2px solid rgba(0, 180, 255, 0.15);
            animation: waveAnim 2.5s ease-out infinite;
            pointer-events: none;
        }
        .wave:nth-child(1) { width: 100%; height: 100%; animation-delay: 0s; }
        .wave:nth-child(2) { width: 130%; height: 130%; animation-delay: 0.4s; }
        .wave:nth-child(3) { width: 160%; height: 160%; animation-delay: 0.8s; }
        .wave:nth-child(4) { width: 190%; height: 190%; animation-delay: 1.2s; }
        .wave.active {
            border-color: rgba(0, 200, 255, 0.4);
        }

        @keyframes waveAnim {
            0% { transform: scale(0.8); opacity: 0.8; }
            100% { transform: scale(1.6); opacity: 0; }
        }

        /* دایره اصلی (Orb) */
        .orb {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #00b4ff, #0055ff);
            box-shadow: 0 0 50px rgba(0, 120, 255, 0.6), 0 0 100px rgba(0, 120, 255, 0.3);
            position: relative;
            z-index: 2;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .orb .inner-glow {
            width: 80%;
            height: 80%;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 35%, rgba(255,255,255,0.5), transparent 70%);
            opacity: 0.6;
        }
        .orb.pulse {
            animation: orbPulse 1.8s ease-in-out infinite;
        }
        @keyframes orbPulse {
            0% { box-shadow: 0 0 50px rgba(0, 120, 255, 0.6), 0 0 100px rgba(0, 120, 255, 0.3); transform: scale(1); }
            50% { box-shadow: 0 0 80px rgba(0, 180, 255, 0.9), 0 0 150px rgba(0, 120, 255, 0.5); transform: scale(1.04); }
            100% { box-shadow: 0 0 50px rgba(0, 120, 255, 0.6), 0 0 100px rgba(0, 120, 255, 0.3); transform: scale(1); }
        }
        .orb.listening {
            background: radial-gradient(circle at 35% 30%, #00ffb3, #0088ff);
            box-shadow: 0 0 60px rgba(0, 255, 200, 0.7), 0 0 120px rgba(0, 200, 255, 0.4);
        }
        .orb.processing {
            background: radial-gradient(circle at 35% 30%, #ffbb00, #ff5500);
            box-shadow: 0 0 60px rgba(255, 180, 0, 0.7), 0 0 120px rgba(255, 100, 0, 0.4);
            animation: orbPulse 0.6s ease-in-out infinite;
        }
        .orb.responding {
            background: radial-gradient(circle at 35% 30%, #00ff88, #00bbff);
            box-shadow: 0 0 60px rgba(0, 255, 150, 0.7), 0 0 120px rgba(0, 200, 255, 0.4);
        }

        /* دکمه میکروفون */
        .mic-btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0077ff, #4400ff);
            border: none;
            outline: none;
            color: #fff;
            font-size: 36px;
            box-shadow: 0 8px 30px rgba(0, 100, 255, 0.5);
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 10px;
            z-index: 5;
            position: relative;
        }
        .mic-btn:active {
            transform: scale(0.9);
        }
        .mic-btn.listening {
            background: linear-gradient(135deg, #ff3366, #ff00aa);
            box-shadow: 0 0 50px rgba(255, 0, 100, 0.7);
            animation: micPulse 1s ease-in-out infinite;
        }
        @keyframes micPulse {
            0% { box-shadow: 0 0 30px rgba(255, 0, 100, 0.5); }
            50% { box-shadow: 0 0 70px rgba(255, 0, 100, 0.9); }
            100% { box-shadow: 0 0 30px rgba(255, 0, 100, 0.5); }
        }

        /* وضعیت */
        .status {
            font-size: 15px;
            color: #aac;
            margin: 12px 0 6px;
            background: rgba(255,255,255,0.05);
            padding: 4px 18px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.04);
            min-height: 32px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #666;
            transition: 0.3s;
        }
        .status .dot.idle { background: #666; }
        .status .dot.listening { background: #00ff88; box-shadow: 0 0 12px #00ff88; animation: dotBlink 0.8s infinite; }
        .status .dot.processing { background: #ffaa00; box-shadow: 0 0 12px #ffaa00; animation: dotBlink 0.4s infinite; }
        .status .dot.responding { background: #00ccff; box-shadow: 0 0 12px #00ccff; animation: dotBlink 0.6s infinite; }

        @keyframes dotBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* کارت نمایش متن کاربر */
        .user-text {
            width: 100%;
            max-height: 80px;
            overflow-y: auto;
            text-align: center;
            font-size: 18px;
            font-weight: 300;
            color: #ccd;
            padding: 8px 12px;
            background: rgba(255,255,255,0.04);
            border-radius: 20px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.06);
            margin: 6px 0 4px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: break-word;
            transition: 0.3s;
        }
        .user-text.has-text {
            background: rgba(0,150,255,0.08);
            border-color: rgba(0,150,255,0.15);
        }

        /* کارت پاسخ (Siri-like) */
        .response-card {
            width: 100%;
            max-height: 200px;
            overflow-y: auto;
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 28px;
            padding: 18px 20px;
            margin: 8px 0 12px;
            transition: all 0.4s ease;
            box-shadow: 0 8px 40px rgba(0,0,0,0.3);
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 17px;
            line-height: 1.7;
            color: #eee;
            opacity: 0;
            transform: translateY(8px);
            pointer-events: none;
        }
        .response-card.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        .response-card .response-text {
            width: 100%;
        }

        /* کارت تأیید تماس */
        .confirm-card {
            display: none;
            width: 100%;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 16px 20px;
            margin: 6px 0 10px;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }
        .confirm-card.show {
            display: flex;
        }
        .confirm-card .confirm-text {
            font-size: 16px;
            color: #ddd;
        }
        .confirm-card .confirm-actions {
            display: flex;
            gap: 20px;
        }
        .confirm-card .confirm-actions button {
            padding: 8px 32px;
            border-radius: 40px;
            border: none;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }
        .confirm-card .confirm-actions .btn-call {
            background: linear-gradient(135deg, #00c853, #00e676);
            color: #000;
        }
        .confirm-card .confirm-actions .btn-cancel {
            background: rgba(255,255,255,0.12);
            color: #ccc;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .confirm-card .confirm-actions button:active {
            transform: scale(0.94);
        }

        /* اسکرول بار */
        ::-webkit-scrollbar {
            width: 3px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.15);
            border-radius: 10px;
        }

        /* ریسپانسیو */
        @media (max-width: 420px) {
            .orb-container { width: 160px; height: 160px; }
            .orb { width: 110px; height: 110px; }
            .mic-btn { width: 60px; height: 60px; font-size: 28px; }
            .header .title { font-size: 18px; }
            .user-text { font-size: 16px; min-height: 40px; }
            .response-card { font-size: 15px; padding: 14px 16px; }
        }

        /* انیمیشن‌های ورود */
        .fade-in {
            animation: fadeIn 0.4s ease forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* استایل کاستوم برای دکمه‌ها */
        .icon-btn {
            background: rgba(255,255,255,0.05);
            border: none;
            color: #aab;
            padding: 6px 12px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.04);
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }
        .icon-btn:hover {
            background: rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>

<div class="app" id="app">

    <!-- هدر -->
    <div class="header">
        <span class="title">✨ Ahoora AI</span>
        <span class="time" id="headerTime">--:--</span>
    </div>

    <!-- دایره مرکزی + امواج -->
    <div class="orb-container" id="orbContainer">
        <div class="wave" id="wave1"></div>
        <div class="wave" id="wave2"></div>
        <div class="wave" id="wave3"></div>
        <div class="wave" id="wave4"></div>
        <div class="orb pulse" id="orb">
            <div class="inner-glow"></div>
        </div>
    </div>

    <!-- دکمه میکروفون -->
    <button class="mic-btn" id="micBtn" aria-label="فعال کردن میکروفون">
        <i class="fas fa-microphone" id="micIcon"></i>
    </button>

    <!-- وضعیت -->
    <div class="status" id="status">
        <span class="dot idle" id="statusDot"></span>
        <span id="statusText">آماده</span>
    </div>

    <!-- نمایش متن کاربر -->
    <div class="user-text" id="userText">...</div>

    <!-- کارت پاسخ -->
    <div class="response-card" id="responseCard">
        <div class="response-text" id="responseText">👋 سلام! من اهورا هستم، چطور می‌توانم کمک کنم؟</div>
    </div>

    <!-- کارت تأیید تماس -->
    <div class="confirm-card" id="confirmCard">
        <div class="confirm-text" id="confirmText">می‌خواهید با این شماره تماس بگیرید؟</div>
        <div class="confirm-actions">
            <button class="btn-call" id="confirmCall">تماس</button>
            <button class="btn-cancel" id="confirmCancel">لغو</button>
        </div>
    </div>

</div>

<script>
    (function() {
        'use strict';

        // ============================================================
        // 1. متغیرها و المان‌ها
        // ============================================================
        const orb = document.getElementById('orb');
        const micBtn = document.getElementById('micBtn');
        const micIcon = document.getElementById('micIcon');
        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');
        const userText = document.getElementById('userText');
        const responseCard = document.getElementById('responseCard');
        const responseText = document.getElementById('responseText');
        const confirmCard = document.getElementById('confirmCard');
        const confirmText = document.getElementById('confirmText');
        const confirmCall = document.getElementById('confirmCall');
        const confirmCancel = document.getElementById('confirmCancel');
        const headerTime = document.getElementById('headerTime');
        const waveEls = [document.getElementById('wave1'), document.getElementById('wave2'), document.getElementById('wave3'), document.getElementById('wave4')];

        let isListening = false;
        let isProcessing = false;
        let recognition = null;
        let pendingPhoneNumber = null;

        // ============================================================
        // 2. تنظیمات اولیه
        // ============================================================
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            headerTime.textContent = h + ':' + m;
        }
        updateClock();
        setInterval(updateClock, 10000);

        setTimeout(() => {
            showResponse('👋 سلام! من اهورا هستم، چطور می‌توانم کمک کنم؟', 'e.mp3');
        }, 400);

        // ============================================================
        // 3. تشخیص گفتار (Web Speech API)
        // ============================================================
        function initSpeech() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                setStatus('مرورگر شما از تشخیص گفتار پشتیبانی نمی‌کند.', 'idle');
                return false;
            }
            recognition = new SpeechRecognition();
            recognition.lang = 'fa-IR';
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = function() {
                isListening = true;
                setStatus('در حال گوش دادن ...', 'listening');
                micBtn.classList.add('listening');
                orb.classList.add('listening');
                orb.classList.remove('pulse', 'processing', 'responding');
                waveEls.forEach(w => w.classList.add('active'));
                micIcon.className = 'fas fa-circle-notch fa-spin';
                userText.textContent = '...';
                userText.classList.remove('has-text');
            };

            recognition.onresult = function(event) {
                const last = event.results.length - 1;
                const transcript = event.results[last][0].transcript.trim();
                if (transcript) {
                    userText.textContent = transcript;
                    userText.classList.add('has-text');
                    stopListening();
                    processCommand(transcript);
                } else {
                    stopListening();
                    showResponse('متوجه نشدم، لطفاً دوباره بگویید.', 'd.mp3');
                }
            };

            recognition.onerror = function(event) {
                console.warn('Speech error:', event.error);
                if (event.error === 'not-allowed') {
                    setStatus('دسترسی به میکروفون مجاز نیست.', 'idle');
                    showResponse('لطفاً دسترسی میکروفون را فعال کنید.', 'd.mp3');
                } else {
                    setStatus('خطا در تشخیص صدا', 'idle');
                    showResponse('متأسفانه مشکلی پیش آمد، دوباره تلاش کنید.', 'd.mp3');
                }
                stopListening();
            };

            recognition.onend = function() {
                if (isListening) {
                    stopListening();
                }
            };

            return true;
        }

        function startListening() {
            if (!recognition) {
                if (!initSpeech()) return;
            }
            if (isListening) return;
            try {
                recognition.start();
            } catch (e) {
                console.warn(e);
            }
        }

        function stopListening() {
            if (recognition) {
                try {
                    recognition.stop();
                } catch (e) {}
            }
            isListening = false;
            micBtn.classList.remove('listening');
            orb.classList.remove('listening', 'processing', 'responding');
            orb.classList.add('pulse');
            waveEls.forEach(w => w.classList.remove('active'));
            micIcon.className = 'fas fa-microphone';
            if (!isProcessing) {
                setStatus('آماده', 'idle');
            }
        }

        // ============================================================
        // 4. پخش صدا (MP3 و SpeechSynthesis)
        // ============================================================
        let audioPlayer = new Audio();

        function playSound(file) {
            return new Promise((resolve) => {
                if (!file) return resolve();
                audioPlayer.src = file;
                audioPlayer.onended = function() { resolve(); };
                audioPlayer.onerror = function() { resolve(); };
                audioPlayer.play().catch(() => resolve());
            });
        }

        function speakText(text) {
            if (!text) return;
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fa-IR';
                utterance.rate = 1.0;
                utterance.pitch = 1.0;
                const voices = window.speechSynthesis.getVoices();
                const faVoice = voices.find(v => v.lang.startsWith('fa'));
                if (faVoice) utterance.voice = faVoice;
                window.speechSynthesis.speak(utterance);
            }
        }

        // ============================================================
        // 5. نمایش پاسخ و وضعیت
        // ============================================================
        function setStatus(text, type) {
            statusText.textContent = text;
            statusDot.className = 'dot ' + type;
            if (type === 'listening') {
                isProcessing = false;
            } else if (type === 'processing') {
                isProcessing = true;
            } else {
                isProcessing = false;
            }
        }

        function showResponse(text, audioFile) {
            responseText.textContent = text;
            responseCard.classList.add('show');
            if (audioFile) {
                playSound(audioFile);
            } else {
                speakText(text);
            }
            if (isProcessing) {
                setStatus('آماده', 'idle');
                orb.classList.remove('processing');
                orb.classList.add('pulse');
            }
        }

        // ============================================================
        // 6. مدیریت فرمان‌ها
        // ============================================================
        const appMap = {
            'واتساپ': 'com.whatsapp',
            'تلگرام': 'org.telegram.messenger',
            'اینستاگرام': 'com.instagram.android',
            'یوتیوب': 'com.google.android.youtube',
            'کروم': 'com.android.chrome',
            'گالری': 'com.android.gallery3d',
            'دوربین': 'com.android.camera',
            'تنظیمات': 'com.android.settings'
        };

        const contacts = {
            'علی': '09123456789',
            'احمد': '09129876543',
            'رضا': '09123456780'
        };

        function getPackageName(name) {
            for (let key in appMap) {
                if (name.includes(key)) return appMap[key];
            }
            return null;
        }

        function openApp(packageName, appName) {
            if (window.Android && typeof Android.openApp === 'function') {
                try {
                    Android.openApp(packageName);
                    showResponse('چشم، ' + appName + ' را باز کردم.', 'a.mp3');
                    return true;
                } catch (e) {
                    showResponse('متأسفانه باز نشد.', 'b.mp3');
                    return false;
                }
            } else {
                showResponse('برای باز کردن برنامه‌ها، این قابلیت فقط در نسخه اندروید WebView پشتیبانی می‌شود.', 'b.mp3');
                return false;
            }
        }

        function makeCall(phoneNumber) {
            if (window.Android && typeof Android.makeCall === 'function') {
                try {
                    Android.makeCall(phoneNumber);
                    showResponse('در حال برقراری تماس با ' + phoneNumber, null);
                    return true;
                } catch (e) {
                    showResponse('خطا در برقراری تماس.', 'd.mp3');
                    return false;
                }
            } else {
                const telUrl = 'tel:' + phoneNumber;
                window.location.href = telUrl;
                showResponse('در حال انتقال به شماره‌گیر ...', null);
                return true;
            }
        }

        function sendSMS(phoneNumber, message) {
            if (window.Android && typeof Android.sendSMS === 'function') {
                try {
                    Android.sendSMS(phoneNumber, message || '');
                    showResponse('پیامک در حال ارسال ...', null);
                    return true;
                } catch (e) {
                    showResponse('خطا در ارسال پیامک.', 'd.mp3');
                    return false;
                }
            } else {
                const smsUrl = 'sms:' + phoneNumber + '?body=' + encodeURIComponent(message || '');
                window.location.href = smsUrl;
                showResponse('در حال باز کردن پیامک ...', null);
                return true;
            }
        }

        function openGallery() {
            if (window.Android && typeof Android.openGallery === 'function') {
                try {
                    Android.openGallery();
                    showResponse('گالری باز شد.', 'a.mp3');
                    return true;
                } catch (e) {
                    showResponse('خطا در باز کردن گالری.', 'b.mp3');
                    return false;
                }
            } else {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'image/*,video/*';
                input.onchange = function() {
                    if (this.files && this.files[0]) {
                        showResponse('فایل انتخاب شد: ' + this.files[0].name, null);
                    }
                };
                input.click();
                showResponse('لطفاً فایل مورد نظر را انتخاب کنید.', null);
                return true;
            }
        }

        function openCamera() {
            if (window.Android && typeof Android.openCamera === 'function') {
                try {
                    Android.openCamera();
                    showResponse('دوربین باز شد.', 'a.mp3');
                    return true;
                } catch (e) {
                    showResponse('خطا در باز کردن دوربین.', 'b.mp3');
                    return false;
                }
            } else {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'image/*';
                input.capture = 'environment';
                input.onchange = function() {
                    if (this.files && this.files[0]) {
                        showResponse('عکس گرفته شد.', null);
                    }
                };
                input.click();
                showResponse('لطفاً عکس بگیرید.', null);
                return true;
            }
        }

        function recordVideo() {
            if (window.Android && typeof Android.recordVideo === 'function') {
                try {
                    Android.recordVideo();
                    showResponse('در حال ضبط فیلم ...', null);
                    return true;
                } catch (e) {
                    showResponse('خطا در ضبط فیلم.', 'b.mp3');
                    return false;
                }
            } else {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'video/*';
                input.capture = 'environment';
                input.onchange = function() {
                    if (this.files && this.files[0]) {
                        showResponse('فیلم ضبط شد.', null);
                    }
                };
                input.click();
                showResponse('لطفاً فیلم بگیرید.', null);
                return true;
            }
        }

        function openUrl(url) {
            if (window.Android && typeof Android.openUrl === 'function') {
                try {
                    Android.openUrl(url);
                    showResponse('لینک باز شد.', 'g.mp3');
                    return true;
                } catch (e) {
                    showResponse('خطا در باز کردن لینک.', 'b.mp3');
                    return false;
                }
            } else {
                window.open(url, '_blank');
                showResponse('لینک در مرورگر باز شد.', null);
                return true;
            }
        }

        // ============================================================
        // 7. هسته پردازش فرمان
        // ============================================================
        function processCommand(text) {
            if (!text) return;
            setStatus('در حال پردازش ...', 'processing');
            orb.classList.remove('listening', 'responding', 'pulse');
            orb.classList.add('processing');
            waveEls.forEach(w => w.classList.remove('active'));

            const lower = text.toLowerCase().trim();

            // 1. باز کردن برنامه
            const appMatch = lower.match(/(واتساپ|تلگرام|اینستاگرام|یوتیوب|کروم|گالری|دوربین|تنظیمات)\s*(?:رو\s*)?باز\s*کن/);
            if (appMatch) {
                const appName = appMatch[1];
                const pkg = getPackageName(appName);
                if (pkg) {
                    openApp(pkg, appName);
                } else {
                    showResponse('برنامه مورد نظر شناخته نشد.', 'b.mp3');
                }
                return;
            }

            // 2. تماس با شماره مستقیم
            const phoneMatch = lower.match(/(?:با\s*)?شماره\s*([\d۰-۹]+)\s*(?:رو\s*)?(?:بگیر|تماس\s*بگیر)/);
            if (phoneMatch) {
                let num = phoneMatch[1];
                num = num.replace(/[۰-۹]/g, function(d) {
                    return String.fromCharCode(d.charCodeAt(0) - 1728);
                });
                pendingPhoneNumber = num;
                confirmText.textContent = 'می‌خواهید با شماره ' + num + ' تماس بگیرید؟';
                confirmCard.classList.add('show');
                playSound('c.mp3');
                setStatus('تأیید تماس', 'idle');
                orb.classList.remove('processing');
                orb.classList.add('pulse');
                return;
            }

            // 3. تماس با نام (از دفترچه)
            const nameMatch = lower.match(/با\s*([\u0600-\u06FF\s]+)\s*تماس\s*بگیر/);
            if (nameMatch) {
                const name = nameMatch[1].trim();
                if (contacts[name]) {
                    pendingPhoneNumber = contacts[name];
                    confirmText.textContent = 'می‌خواهید با ' + name + ' (شماره ' + contacts[name] + ') تماس بگیرید؟';
                    confirmCard.classList.add('show');
                    playSound('c.mp3');
                    setStatus('تأیید تماس', 'idle');
                    orb.classList.remove('processing');
                    orb.classList.add('pulse');
                } else {
                    showResponse('متأسفم، شماره ' + name + ' را در دفترچه ندارم.', 'b.mp3');
                }
                return;
            }

            // 4. گالری
            if (/(گالری|عکس‌هام|فیلم‌هام)\s*(?:رو\s*)?باز\s*کن/.test(lower)) {
                openGallery();
                return;
            }

            // 5. دوربین
            if (/دوربین\s*(?:رو\s*)?باز\s*کن/.test(lower)) {
                openCamera();
                return;
            }
            if (/عکس\s*بگیر/.test(lower)) {
                openCamera();
                return;
            }
            if (/فیلم\s*بگیر/.test(lower)) {
                recordVideo();
                return;
            }

            // 6. ارسال پیامک
            const smsMatch = lower.match(/(?:به\s*)?([\d۰-۹]+)\s*پیام\s*(?:بده|بفرست)/);
            if (smsMatch) {
                let num = smsMatch[1].replace(/[۰-۹]/g, function(d) {
                    return String.fromCharCode(d.charCodeAt(0) - 1728);
                });
                const msg = 'سلام، این پیام از اهورا است.';
                sendSMS(num, msg);
                return;
            }

            // 7. واتساپ برای نام
            const waMatch = lower.match(/واتساپ\s*(?:رو\s*)?برای\s*([\u0600-\u06FF\s]+)\s*باز\s*کن/);
            if (waMatch) {
                const name = waMatch[1].trim();
                if (contacts[name]) {
                    const phone = contacts[name];
                    if (window.Android && typeof Android.openApp === 'function') {
                        openApp('com.whatsapp', 'واتساپ');
                        setTimeout(() => {
                            const waUrl = 'https://wa.me/' + phone;
                            if (window.Android && typeof Android.openUrl === 'function') {
                                Android.openUrl(waUrl);
                            } else {
                                window.open(waUrl, '_blank');
                            }
                        }, 500);
                    } else {
                        const waUrl = 'https://wa.me/' + phone;
                        window.open(waUrl, '_blank');
                        showResponse('واتساپ برای ' + name + ' باز شد.', 'a.mp3');
                    }
                } else {
                    showResponse('شماره ' + name + ' را در دفترچه ندارم.', 'b.mp3');
                }
                return;
            }

            // 8. کنترل صدا (فقط با Bridge)
            if (/صدا\s*(?:رو\s*)?زیاد\s*کن/.test(lower)) {
                if (window.Android && typeof Android.adjustVolume === 'function') {
                    try {
                        Android.adjustVolume('up');
                        showResponse('صدا زیاد شد.', null);
                    } catch (e) {
                        showResponse('خطا در کنترل صدا.', 'b.mp3');
                    }
                } else {
                    showResponse('این قابلیت فقط در نسخه اندروید WebView پشتیبانی می‌شود.', 'b.mp3');
                }
                return;
            }
            if (/صدا\s*(?:رو\s*)?کم\s*کن/.test(lower)) {
                if (window.Android && typeof Android.adjustVolume === 'function') {
                    try {
                        Android.adjustVolume('down');
                        showResponse('صدا کم شد.', null);
                    } catch (e) {
                        showResponse('خطا در کنترل صدا.', 'b.mp3');
                    }
                } else {
                    showResponse('این قابلیت فقط در نسخه اندروید WebView پشتیبانی می‌شود.', 'b.mp3');
                }
                return;
            }

            // 9. پخش موسیقی / ویدئو
            if (/موسیقی\s*پخش\s*کن/.test(lower)) {
                const music = new Audio('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3');
                music.play().catch(() => {});
                showResponse('در حال پخش موسیقی ...', null);
                return;
            }
            if (/موسیقی\s*(?:رو\s*)?متوقف\s*کن/.test(lower)) {
                const audios = document.getElementsByTagName('audio');
                for (let a of audios) a.pause();
                showResponse('موسیقی متوقف شد.', null);
                return;
            }
            if (/ویدئو\s*پخش\s*کن/.test(lower)) {
                window.open('https://www.w3schools.com/html/mov_bbb.mp4', '_blank');
                showResponse('ویدئو در مرورگر باز شد.', null);
                return;
            }

            // 10. ساعت
            if (/(ساعت\s*(?:چنده|چند\s*است|رو\s*بگو)|ساعت\s*الان\s*چنده)/.test(lower)) {
                const now = new Date();
                const h = String(now.getHours()).padStart(2, '0');
                const m = String(now.getMinutes()).padStart(2, '0');
                const timeStr = 'ساعت ' + h + ' و ' + m + ' دقیقه است.';
                showResponse(timeStr, 'f.mp3');
                return;
            }

            // 11. تاریخ
            if (/(تاریخ\s*(?:چنده|چند\s*است|رو\s*بگو)|تاریخ\s*امروز\s*چنده)/.test(lower)) {
                const now = new Date();
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                const dateStr = 'امروز ' + year + '/' + month + '/' + day;
                showResponse(dateStr, null);
                return;
            }

            // 12. محاسبات ساده
            const calcMatch = lower.match(/(\d+)\s*([+\-*/])\s*(\d+)/);
            if (calcMatch) {
                try {
                    const a = parseFloat(calcMatch[1]);
                    const op = calcMatch[2];
                    const b = parseFloat(calcMatch[3]);
                    let result;
                    switch (op) {
                        case '+': result = a + b; break;
                        case '-': result = a - b; break;
                        case '*': result = a * b; break;
                        case '/': result = a / b; break;
                        default: result = 'عملیات نامشخص';
                    }
                    showResponse('نتیجه: ' + result, null);
                } catch (e) {
                    showResponse('خطا در محاسبه.', 'd.mp3');
                }
                return;
            }

            // 13. جستجوی گوگل
            const searchMatch = lower.match(/(?:در\s*)?گوگل\s*(?:جستجو\s*کن\s*)?(.+)/);
            if (searchMatch) {
                const query = searchMatch[1].trim();
                if (query) {
                    const url = 'https://www.google.com/search?q=' + encodeURIComponent(query);
                    openUrl(url);
                    return;
                }
            }

            // 14. باز کردن سایت
            const siteMatch = lower.match(/(?:باز\s*کن\s*)?(https?:\/\/\S+)/);
            if (siteMatch) {
                openUrl(siteMatch[1]);
                return;
            }

            // 15. پاسخ عمومی
            const defaultResponses = [
                'من متوجه نشدم. می‌توانی بگویی چه اپی رو باز کنم، یا تماس بگیرم، یا در گوگل جستجو کنم؟',
                'متأسفم، منظور شما را نفهمیدم. لطفاً واضح‌تر بگویید.',
                'دستور شما قابل تشخیص نبود. از من بپرسید ساعت چند است، یا برنامه‌ای را باز کنید.'
            ];
            const rand = defaultResponses[Math.floor(Math.random() * defaultResponses.length)];
            showResponse(rand, 'd.mp3');
        }

        // ============================================================
        // 8. دکمه تأیید تماس
        // ============================================================
        confirmCall.addEventListener('click', function() {
            if (pendingPhoneNumber) {
                makeCall(pendingPhoneNumber);
                pendingPhoneNumber = null;
                confirmCard.classList.remove('show');
                orb.classList.remove('processing');
                orb.classList.add('pulse');
            }
        });

        confirmCancel.addEventListener('click', function() {
            pendingPhoneNumber = null;
            confirmCard.classList.remove('show');
            showResponse('تماس لغو شد.', null);
            orb.classList.remove('processing');
            orb.classList.add('pulse');
            setStatus('آماده', 'idle');
        });

        // ============================================================
        // 9. رویداد دکمه میکروفون
        // ============================================================
        micBtn.addEventListener('click', function() {
            if (isListening) {
                stopListening();
            } else {
                startListening();
            }
        });

        // ============================================================
        // 10. مدیریت Bridge اندروید
        // ============================================================
        if (typeof window.Android === 'undefined') {
            window.Android = {
                openApp: function() {},
                makeCall: function() {},
                openGallery: function() {},
                openImage: function() {},
                openVideo: function() {},
                openCamera: function() {},
                recordVideo: function() {},
                sendSMS: function() {},
                openUrl: function() {},
                adjustVolume: function() {}
            };
        }

        // ============================================================
        // 11. پیش‌بارگذاری صداها
        // ============================================================
        function preloadAudio(files) {
            files.forEach(f => {
                const audio = new Audio();
                audio.src = f;
                audio.load();
            });
        }
        preloadAudio(['a.mp3', 'b.mp3', 'c.mp3', 'd.mp3', 'e.mp3', 'f.mp3', 'g.mp3']);

        // ============================================================
        // 12. تنظیم نهایی
        // ============================================================
        setStatus('آماده', 'idle');
        if ('speechSynthesis' in window) {
            window.speechSynthesis.getVoices();
        }

        console.log('Ahoora AI آماده است!');
    })();
</script>

</body>
</html>
