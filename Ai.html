<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Ahoora AI</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Tahoma,sans-serif;
    background:#080812;
    color:white;
    height:100vh;
    overflow:hidden;
}

.app{
    width:100%;
    max-width:480px;
    height:100vh;
    margin:auto;
    padding:18px;
    display:flex;
    flex-direction:column;
    align-items:center;
    background:
        radial-gradient(circle at 50% 20%,#20204b,#080812 70%);
}

.header{
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.title{
    font-size:24px;
    font-weight:bold;
    background:linear-gradient(135deg,#00d4ff,#7b2ffc,#ff6fd8);
    -webkit-background-clip:text;
    color:transparent;
}

.time{
    background:#ffffff0d;
    padding:7px 15px;
    border-radius:30px;
    color:#9da8c5;
}

.orb-wrapper{
    width:230px;
    height:230px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:15px 0;
}

.orb{
    width:155px;
    height:155px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#008cff,#0033aa);
    box-shadow:0 0 70px #0066ff88,0 0 130px #0066ff33;
    display:flex;
    align-items:center;
    justify-content:center;
    animation:pulse 2s infinite;
}

.inner{
    width:70%;
    height:70%;
    border-radius:50%;
    background:radial-gradient(circle at 40% 30%,#ffffff99,transparent 70%);
}

.listening{
    background:radial-gradient(circle at 35% 30%,#00ff99,#0088ff);
    box-shadow:0 0 90px #00ff9988;
    animation:listen .8s infinite;
}

.processing{
    background:radial-gradient(circle at 35% 30%,#ffcc00,#ff5500);
    animation:process .5s infinite;
}

@keyframes pulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.05)}
}

@keyframes listen{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.1)}
}

@keyframes process{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.06)}
}

.mic{
    width:78px;
    height:78px;
    border:0;
    border-radius:50%;
    background:linear-gradient(135deg,#0066ff,#5500cc);
    color:white;
    font-size:34px;
    box-shadow:0 10px 45px #0066ff88;
}

.mic.active{
    background:linear-gradient(135deg,#ff2266,#bb0066);
    animation:mic 1s infinite;
}

@keyframes mic{
    0%,100%{box-shadow:0 0 40px #ff006688}
    50%{box-shadow:0 0 90px #ff0066dd}
}

.status{
    margin:12px;
    padding:8px 20px;
    background:#ffffff0c;
    border-radius:30px;
    color:#aab4ce;
}

.user{
    width:100%;
    min-height:52px;
    padding:15px;
    background:#ffffff08;
    border-radius:25px;
    text-align:center;
}

.response{
    width:100%;
    margin-top:12px;
    padding:18px;
    background:#ffffff08;
    border:1px solid #ffffff0d;
    border-radius:25px;
    text-align:center;
    line-height:2;
    overflow:auto;
}

.small{
    color:#8993af;
    font-size:13px;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <div class="title">✨ Ahoora AI</div>
        <div class="time" id="time">--:--</div>
    </div>

    <div class="orb-wrapper">
        <div class="orb" id="orb">
            <div class="inner"></div>
        </div>
    </div>

    <button class="mic" id="mic">🎙️</button>

    <div class="status" id="status">
        آماده — بگو «سلام اهورا»
    </div>

    <div class="user" id="user">
        منتظر فرمان صوتی...
    </div>

    <div class="response" id="response">
        👋 سلام! من اهورا هستم.
        <br>
        برای فعال شدن فرمان صوتی بگو:
        <br>
        <b>سلام اهورا</b>
    </div>

    <div class="small">
        Ahoora AI
    </div>

</div>

<script>
"use strict";

/* =========================
   عناصر
========================= */

const orb = document.getElementById("orb");
const mic = document.getElementById("mic");
const statusBox = document.getElementById("status");
const userBox = document.getElementById("user");
const responseBox = document.getElementById("response");
const timeBox = document.getElementById("time");

let recognition = null;
let listening = false;
let commandMode = false;
let pendingNumber = null;
let pendingName = null;


/* =========================
   Android Bridge
========================= */

function android(){

    return typeof window.Android !== "undefined";

}


/* =========================
   ساعت
========================= */

function clock(){

    const d = new Date();

    timeBox.textContent =
        String(d.getHours()).padStart(2,"0")
        + ":" +
        String(d.getMinutes()).padStart(2,"0");

}

clock();

setInterval(clock,10000);


/* =========================
   وضعیت
========================= */

function setStatus(text,type=""){

    statusBox.textContent = text;

    orb.classList.remove(
        "listening",
        "processing"
    );

    if(type){
        orb.classList.add(type);
    }

}


/* =========================
   نرمال‌سازی فارسی
========================= */

function normalize(text){

    return text
        .replace(/[۰-۹]/g,d =>
            String("۰۱۲۳۴۵۶۷۸۹".indexOf(d))
        )
        .replace(/ي/g,"ی")
        .replace(/ك/g,"ک")
        .replace(/ۀ/g,"ه")
        .replace(/\s+/g," ")
        .trim()
        .toLowerCase();

}


/* =========================
   پخش صدا
========================= */

function playVoice(file){

    try{

        const audio = new Audio(file);

        audio.play().catch(()=>{});

    }catch(e){}

}

function voiceA(){
    playVoice("a.mp3");
}

function voiceB(){
    playVoice("b.mp3");
}

function voiceC(){
    playVoice("c.mp3");
}

function voiceD(){
    playVoice("d.mp3");
}

function voiceE(){
    playVoice("e.mp3");
}

function voiceF(){
    playVoice("f.mp3");
}

function voiceG(){
    playVoice("g.mp3");
}


/* =========================
   پاسخ
========================= */

function answer(text,voice=null){

    responseBox.innerHTML = text;

    if(voice){
        voice();
    }

}


/* =========================
   باز کردن برنامه
========================= */

function openApp(packageName,name){

    if(android()){

        try{

            Android.openApp(packageName);

            answer(
                "👁️ چشم، "+name+" را باز کردم.",
                voiceA
            );

            return true;

        }catch(e){

            voiceB();

        }

    }

    answer(
        "❌ نتوانستم "+name+" را باز کنم.",
        voiceB
    );

    return false;

}


/* =========================
   برنامه‌های معروف
========================= */

const apps = {

    "واتساپ":{
        package:"com.whatsapp"
    },

    "تلگرام":{
        package:"org.telegram.messenger"
    },

    "اینستاگرام":{
        package:"com.instagram.android"
    },

    "یوتیوب":{
        package:"com.google.android.youtube"
    },

    "کروم":{
        package:"com.android.chrome"
    },

    "فیسبوک":{
        package:"com.facebook.katana"
    },

    "ایکس":{
        package:"com.twitter.android"
    },

    "تیک تاک":{
        package:"com.zhiliaoapp.musically"
    },

    "اسنپ":{
        package:"com.snapp.passenger"
    },

    "دیوار":{
        package:"ir.divar"
    },

    "روبیکا":{
        package:"ir.resaneh1.iptv"
    },

    "مایکت":{
        package:"ir.mservices.market"
    },

    "بازار":{
        package:"com.farsitel.bazaar"
    },

    "تنظیمات":{
        package:"com.android.settings"
    }

};


/* =========================
   تماس
========================= */

function callNumber(number){

    number = normalize(number)
        .replace(/[^0-9+]/g,"");

    if(!number) return;

    if(android()){

        try{

            Android.makeCall(number);

            answer(
                "📞 در حال تماس با "+number
            );

            return;

        }catch(e){}

    }

    window.location.href="tel:"+number;

}


function callContact(name){

    name = name.trim();

    if(android()){

        try{

            Android.callContact(name);

            answer(
                "📞 در حال تماس با "+name+"..."
            );

            return;

        }catch(e){}

    }

    answer(
        "❌ مخاطب "+name+" پیدا نشد.",
        voiceD
    );

}


/* =========================
   پیامک
========================= */

function smsNumber(number,message){

    number = normalize(number)
        .replace(/[^0-9+]/g,"");

    if(android()){

        try{

            Android.sendSMS(
                number,
                message
            );

            answer(
                "✉️ پیامک ارسال شد."
            );

            return;

        }catch(e){}

    }

    window.location.href =
        "sms:"+number+
        "?body="+
        encodeURIComponent(message);

}


function smsContact(name,message){

    if(android()){

        try{

            Android.sendContactSMS(
                name,
                message
            );

            answer(
                "✉️ پیام برای "+name+" آماده شد."
            );

            return;

        }catch(e){}

    }

}


/* =========================
   جستجو
========================= */

function googleSearch(query){

    const url =
        "https://www.google.com/search?q="+
        encodeURIComponent(query);

    if(android()){

        try{

            Android.openUrl(url);

            answer(
                "🔎 باشه، در گوگل جستجو کردم و لینکش رو باز می‌کنم.",
                voiceG
            );

            return;

        }catch(e){}

    }

    window.location.href=url;

}


/* =========================
   صدا
========================= */

function volumeUp(){

    if(android()){

        Android.adjustVolume("up");

        answer("🔊 صدا زیاد شد.");

    }

}

function volumeDown(){

    if(android()){

        Android.adjustVolume("down");

        answer("🔉 صدا کم شد.");

    }

}


/* =========================
   موسیقی
========================= */

function musicPlay(){

    if(android()){

        try{

            Android.toggleMusic();

            answer("🎵 پخش موسیقی اجرا شد.");

        }catch(e){

            answer("❌ کنترل موسیقی انجام نشد.",voiceB);

        }

    }else{

        answer("🎵 موسیقی");

    }

}


function musicStop(){

    if(android()){

        try{

            Android.stopMusic();

            answer("⏹️ موسیقی متوقف شد.");

        }catch(e){}

    }

}


/* =========================
   دوربین
========================= */

function camera(){

    if(android()){

        Android.openCamera();

        answer(
            "📷 دوربین باز شد.",
            voiceA
        );

    }

}


/* =========================
   گالری
========================= */

function gallery(){

    if(android()){

        Android.openGallery();

        answer(
            "🖼️ گالری باز شد.",
            voiceA
        );

    }

}


/* =========================
   ساعت
========================= */

function sayTime(){

    const d = new Date();

    const h =
        String(d.getHours()).padStart(2,"0");

    const m =
        String(d.getMinutes()).padStart(2,"0");

    answer(
        "🕐 الان ساعت "+h+":"+m+" است.",
        voiceF
    );

}


/* =========================
   تشخیص گفتار
========================= */

function initSpeech(){

    const Speech =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if(!Speech){

        answer(
            "❌ تشخیص گفتار در WebView در دسترس نیست.",
            voiceD
        );

        return false;

    }

    recognition = new Speech();

    recognition.lang = "fa-IR";

    recognition.continuous = false;

    recognition.interimResults = false;

    recognition.maxAlternatives = 3;


    recognition.onstart = function(){

        listening = true;

        setStatus(
            commandMode ?
            "🎙️ در حال گوش دادن به فرمان..." :
            "🎙️ گوش می‌دهم...",
            "listening"
        );

        mic.classList.add("active");

    };


    recognition.onresult = function(event){

        const text =
            event.results[0][0]
            .transcript
            .trim();

        userBox.textContent = text;

        processSpeech(text);

    };


    recognition.onerror = function(event){

        console.log(event.error);

        listening = false;

        mic.classList.remove("active");

        setStatus(
            "آماده — بگو «سلام اهورا»"
        );

        if(event.error !== "no-speech"){

            answer(
                "❌ خطا در تشخیص صدا.",
                voiceD
            );

        }

    };


    recognition.onend = function(){

        listening = false;

        mic.classList.remove("active");

        orb.classList.remove(
            "listening",
            "processing"
        );

    };

    return true;

}


/* =========================
   شروع گوش دادن
========================= */

function listen(){

    if(listening) return;

    if(!recognition){

        if(!initSpeech()) return;

    }

    try{

        recognition.start();

    }catch(e){}

}


/* =========================
   تشخیص سلام اهورا
========================= */

function wakeWord(text){

    const t = normalize(text);

    return (
        t.includes("سلام اهورا") ||
        t.includes("سلام، اهورا") ||
        t.includes("اهورا")
    );

}


/* =========================
   پردازش فرمان
========================= */

function processSpeech(original){

    const text = normalize(original);

    listening = false;

    setStatus(
        "در حال پردازش...",
        "processing"
    );


    /* =====================
       Wake Word
    ===================== */

    if(!commandMode){

        if(wakeWord(text)){

            commandMode = true;

            answer(
                "👋 بله؟ فرمانت را بگو.",
                voiceE
            );

            setStatus(
                "فرمان صوتی فعال شد"
            );

            setTimeout(listen,800);

            return;

        }

        setStatus(
            "برای فعال شدن بگو «سلام اهورا»"
        );

        return;

    }


    /* =====================
       لغو
    ===================== */

    if(
        text === "لغو" ||
        text === "بیخیال" ||
        text === "خروج"
    ){

        commandMode=false;

        answer("باشه.");

        setStatus(
            "آماده — بگو «سلام اهورا»"
        );

        return;

    }


    /* =====================
       ساعت
    ===================== */

    if(
        text.includes("ساعت") &&
        (
            text.includes("چنده") ||
            text.includes("چند") ||
            text.includes("الان")
        )
    ){

        sayTime();

        return;

    }


    /* =====================
       دوربین
    ===================== */

    if(
        text.includes("دوربین") ||
        text.includes("عکس بگیر")
    ){

        camera();

        return;

    }


    /* =====================
       گالری
    ===================== */

    if(
        text.includes("گالری") ||
        text.includes("عکس هام") ||
        text.includes("عکسها")
    ){

        gallery();

        return;

    }


    /* =====================
       افزایش صدا
    ===================== */

    if(
        text.includes("صدا") &&
        (
            text.includes("زیاد") ||
            text.includes("بالا")
        )
    ){

        volumeUp();

        return;

    }


    /* =====================
       کاهش صدا
    ===================== */

    if(
        text.includes("صدا") &&
        (
            text.includes("کم") ||
            text.includes("پایین")
        )
    ){

        volumeDown();

        return;

    }


    /* =====================
       موسیقی پخش
    ===================== */

    if(
        (
            text.includes("آهنگ") ||
            text.includes("موسیقی")
        ) &&
        (
            text.includes("پخش") ||
            text.includes("اجرا") ||
            text.includes("ادامه")
        )
    ){

        musicPlay();

        return;

    }


    /* =====================
       موسیقی توقف
    ===================== */

    if(
        (
            text.includes("آهنگ") ||
            text.includes("موسیقی")
        ) &&
        (
            text.includes("توقف") ||
            text.includes("متوقف") ||
            text.includes("قطع")
        )
    ){

        musicStop();

        return;

    }


    /* =====================
       تماس با شماره
    ===================== */

    let numberMatch =
        text.match(/(?:با\s*)?(?:شماره\s*)?(\+?[0-9]{10,15})/);

    if(
        numberMatch &&
        (
            text.includes("تماس") ||
            text.includes("زنگ") ||
            text.includes("بگیر")
        )
    ){

        const number = numberMatch[1];

        pendingNumber = number;

        answer(
            "📞 با شماره <b>"+
            number+
            "</b> تماس بگیرم؟<br><br>"+
            "<button onclick='confirmCall()' style='padding:12px 25px;border:0;border-radius:20px'>تماس</button>",
            voiceC
        );

        return;

    }


    /* =====================
       تماس با مخاطب
    ===================== */

    if(
        text.includes("تماس") ||
        text.includes("زنگ")
    ){

        let name = text
            .replace(/با/g,"")
            .replace(/تماس/g,"")
            .replace(/زنگ/g,"")
            .replace(/بگیر/g,"")
            .replace(/بزن/g,"")
            .trim();

        if(name){

            pendingName = name;

            answer(
                "📞 با <b>"+
                name+
                "</b> تماس بگیرم؟<br><br>"+
                "<button onclick='confirmContactCall()' style='padding:12px 25px;border:0;border-radius:20px'>تماس</button>",
                voiceC
            );

            return;

        }

    }


    /* =====================
       پیامک به شماره
    ===================== */

    if(
        text.includes("پیامک") ||
        text.includes("پیام بفرست")
    ){

        if(numberMatch){

            smsNumber(
                numberMatch[1],
                "سلام، این پیام از اهورا AI است."
            );

            return;

        }

    }


    /* =====================
       پیام به مخاطب
    ===================== */

    if(
        text.includes("پیام") &&
        !numberMatch
    ){

        let name = text
            .replace(/به/g,"")
            .replace(/پیامک/g,"")
            .replace(/پیام/g,"")
            .replace(/بفرست/g,"")
            .replace(/بده/g,"")
            .trim();

        if(name){

            smsContact(
                name,
                "سلام، این پیام از اهورا AI است."
            );

            return;

        }

    }


    /* =====================
       جستجوی گوگل
    ===================== */

    let searchText = null;

    if(text.startsWith("گوگل")){

        searchText =
            text
            .replace("گوگل","")
            .replace("جستجو","")
            .replace("کن","")
            .trim();

    }

    if(
        text.includes("در گوگل") ||
        text.includes("توی گوگل")
    ){

        searchText =
            text
            .replace("در گوگل","")
            .replace("توی گوگل","")
            .replace("جستجو","")
            .replace("کن","")
            .trim();

    }

    if(searchText){

        googleSearch(searchText);

        return;

    }


    /* =====================
       باز کردن برنامه
    ===================== */

    for(const name in apps){

        if(text.includes(name)){

            if(
                text.includes("باز") ||
                text.includes("اجرا") ||
                text.includes("برو")
            ){

                openApp(
                    apps[name].package,
                    name
                );

                return;

            }

        }

    }


    /* =====================
       باز کردن لینک
    ===================== */

    const url =
        original.match(
            /https?:\/\/[^\s]+/i
        );

    if(url){

        if(android()){

            Android.openUrl(url[0]);

        }else{

            window.location.href=url[0];

        }

        return;

    }


    /* =====================
       فرمان‌های متنی ساده
    ===================== */

    if(text.includes("سلام")){

        answer(
            "👋 سلام! من اهورا هستم.",
            voiceE
        );

        return;

    }


    /* =====================
       نامفهوم
    ===================== */

    answer(
        "🤔 متوجه فرمان نشدم.<br><br>"+
        "مثلاً بگو:<br>"+
        "«سلام اهورا»<br>"+
        "«واتساپ رو باز کن»<br>"+
        "«با مامانم تماس بگیر»<br>"+
        "«به مامانم پیام بده»<br>"+
        "«آهنگ رو پخش کن»<br>"+
        "«صدا رو زیاد کن»<br>"+
        "«در گوگل ماینکرفت رو جستجو کن»",
        voiceD
    );

}


/* =========================
   تأیید تماس
========================= */

window.confirmCall=function(){

    if(pendingNumber){

        callNumber(
            pendingNumber
        );

        pendingNumber=null;

    }

};


window.confirmContactCall=function(){

    if(pendingName){

        callContact(
            pendingName
        );

        pendingName=null;

    }

};


/* =========================
   دکمه میکروفون
========================= */

mic.addEventListener(
    "click",
    function(){

        listen();

    }
);


/* =========================
   اجرای اولیه
========================= */

answer(
    "👋 سلام! من اهورا هستم.<br>"+
    "برای فعال شدن فرمان صوتی بگو:<br>"+
    "<b>سلام اهورا</b>",
    voiceE
);

setStatus(
    "آماده — بگو «سلام اهورا»"
);

</script>

</body>
</html>
