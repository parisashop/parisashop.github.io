<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Ahoora AI</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Vazir:wght@300;400;700;900&display=swap"
rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Vazir,sans-serif;
    background:#080812;
    color:white;
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
}

.app{
    width:100%;
    max-width:480px;
    height:100vh;
    background:
    radial-gradient(ellipse at 50% 20%,#191934,#080812 80%);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px 16px;
}

.header{
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.title{
    font-size:24px;
    font-weight:900;
    background:linear-gradient(135deg,#00d4ff,#7b2ffc,#ff6fd8);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.time{
    font-size:14px;
    color:#99aacc;
    background:rgba(255,255,255,.05);
    padding:7px 16px;
    border-radius:30px;
}

.orb-wrapper{
    width:220px;
    height:220px;
    margin:25px auto 10px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.orb{
    width:150px;
    height:150px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#0088ff,#0033aa);
    box-shadow:0 0 60px rgba(0,100,255,.5),
               0 0 120px rgba(0,100,255,.2);
    display:flex;
    justify-content:center;
    align-items:center;
    transition:.4s;
}

.inner-glow{
    width:70%;
    height:70%;
    border-radius:50%;
    background:radial-gradient(circle at 45% 35%,
    rgba(255,255,255,.6),transparent 70%);
}

.orb.pulse{
    animation:pulse 2s infinite;
}

.orb.listening{
    background:radial-gradient(circle at 35% 30%,#00ff99,#00aaff);
    box-shadow:0 0 80px rgba(0,255,150,.7);
    animation:listen 1s infinite;
}

.orb.processing{
    background:radial-gradient(circle at 35% 30%,#ffcc00,#ff6600);
    animation:process .5s infinite;
}

@keyframes pulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.04)}
}

@keyframes listen{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.08)}
}

@keyframes process{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.05)}
}

.mic-btn{
    width:76px;
    height:76px;
    border-radius:50%;
    border:0;
    background:linear-gradient(135deg,#0066ff,#4400cc);
    color:white;
    font-size:34px;
    box-shadow:0 10px 40px rgba(0,80,255,.5);
}

.mic-btn.listening{
    background:linear-gradient(135deg,#ff2266,#cc0066);
    animation:micpulse 1s infinite;
}

@keyframes micpulse{
    0%,100%{box-shadow:0 0 40px rgba(255,0,100,.5)}
    50%{box-shadow:0 0 90px rgba(255,0,100,.9)}
}

.status{
    margin:12px;
    padding:7px 20px;
    border-radius:30px;
    background:rgba(255,255,255,.05);
    color:#aac;
    display:flex;
    gap:10px;
    align-items:center;
}

.dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#555;
}

.dot.listening{
    background:#00ff88;
    box-shadow:0 0 15px #00ff88;
}

.dot.processing{
    background:#ffaa00;
    box-shadow:0 0 15px #ffaa00;
}

.user-text{
    width:100%;
    min-height:50px;
    padding:12px;
    border-radius:24px;
    background:rgba(255,255,255,.04);
    text-align:center;
    font-size:17px;
}

.response-card{
    width:100%;
    max-height:210px;
    overflow:auto;
    margin-top:10px;
    padding:18px;
    border-radius:28px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.07);
    text-align:center;
    font-size:17px;
    line-height:1.8;
}

/* دکمه فعال کردن حالت دستیار */
.wake-btn{
    margin-top:15px;
    padding:12px 25px;
    border:0;
    border-radius:25px;
    color:white;
    background:linear-gradient(135deg,#7b2ffc,#00aaff);
    font-family:inherit;
    font-size:15px;
}

.wake-btn.active{
    background:linear-gradient(135deg,#00aa66,#00dd99);
}

/* دکمه شناور داخل خود برنامه */
.floating-btn{
    position:fixed;
    left:18px;
    bottom:25px;
    width:58px;
    height:58px;
    border-radius:50%;
    border:0;
    color:white;
    background:linear-gradient(135deg,#0066ff,#7b2ffc);
    box-shadow:0 5px 30px rgba(0,100,255,.6);
    font-size:23px;
    z-index:9999;
}

.floating-btn.active{
    background:linear-gradient(135deg,#00cc77,#00aaff);
    animation:floatpulse 1.5s infinite;
}

@keyframes floatpulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.1)}
}

@media(max-width:420px){
    .orb-wrapper{
        width:180px;
        height:180px;
    }

    .orb{
        width:125px;
        height:125px;
    }

    .mic-btn{
        width:65px;
        height:65px;
        font-size:30px;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <div class="title">✨ Ahoora AI</div>
        <div class="time" id="headerTime">--:--</div>
    </div>

    <div class="orb-wrapper">
        <div class="orb pulse" id="orb">
            <div class="inner-glow"></div>
        </div>
    </div>

    <button class="mic-btn" id="micBtn">
        <i class="fas fa-microphone" id="micIcon"></i>
    </button>

    <button class="wake-btn" id="wakeBtn">
        🎙️ فعال کردن «سلام اهورا»
    </button>

    <div class="status">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">آماده</span>
    </div>

    <div class="user-text" id="userText">
        بگو «سلام اهورا»
    </div>

    <div class="response-card">
        <div id="responseText">
            👋 سلام! من اهورا هستم.
            <br>
            برای فعال شدن فرمان صوتی بگو:
            <br>
            <b>سلام اهورا</b>
        </div>
    </div>

</div>

<!-- دکمه شناور -->
<button class="floating-btn" id="floatingBtn">
    <i class="fas fa-microphone"></i>
</button>

<script>

"use strict";

/* =========================
   عناصر
========================= */

const orb=document.getElementById("orb");
const micBtn=document.getElementById("micBtn");
const micIcon=document.getElementById("micIcon");

const wakeBtn=document.getElementById("wakeBtn");
const floatingBtn=document.getElementById("floatingBtn");

const statusText=document.getElementById("statusText");
const statusDot=document.getElementById("statusDot");

const userText=document.getElementById("userText");
const responseText=document.getElementById("responseText");

const headerTime=document.getElementById("headerTime");

let recognition=null;
let listening=false;
let wakeMode=false;
let processing=false;
let wakeRecognition=null;


/* =========================
   ساعت
========================= */

function clock(){

    const d=new Date();

    headerTime.textContent=
        String(d.getHours()).padStart(2,"0")
        +":"+
        String(d.getMinutes()).padStart(2,"0");
}

clock();
setInterval(clock,10000);


/* =========================
   وضعیت
========================= */

function setStatus(text,type=""){

    statusText.textContent=text;
    statusDot.className="dot "+type;
}


/* =========================
   پاسخ صوتی
========================= */

function playVoice(file){

    try{

        const audio=new Audio(file);

        audio.preload="auto";

        audio.play().catch(function(){});

    }catch(e){}

}


/*
 فایل‌های صوتی کنار ai.html:

 a.mp3 = برنامه باز شد
 b.mp3 = باز نشد
 c.mp3 = تأیید تماس
 d.mp3 = خطا
 e.mp3 = سلام
 f.mp3 = ساعت
 g.mp3 = جستجوی گوگل
*/

function voice(type){

    const files={
        open:"a.mp3",
        fail:"b.mp3",
        call:"c.mp3",
        error:"d.mp3",
        hello:"e.mp3",
        time:"f.mp3",
        google:"g.mp3"
    };

    if(files[type]){
        playVoice(files[type]);
    }
}


/* =========================
   Android Bridge
========================= */

function androidAvailable(){

    return typeof window.Android !== "undefined";
}


/* =========================
   باز کردن برنامه
========================= */

function openApp(packageName,name){

    if(!androidAvailable()){

        responseText.textContent=
            "📱 اجرای برنامه فقط داخل APK فعال است.";

        voice("fail");

        return;
    }

    try{

        Android.openApp(packageName);

        responseText.textContent=
            "📱 در حال باز کردن "+name+" ...";

        voice("open");

    }catch(e){

        voice("fail");

    }
}


/* =========================
   تماس با شماره
========================= */

function callNumber(number){

    if(androidAvailable()){

        try{

            Android.makeCall(number);

            responseText.textContent=
                "📞 در حال تماس با "+number;

            return;

        }catch(e){}
    }

    window.location.href="tel:"+number;
}


/* =========================
   تماس مخاطب
========================= */

function callContact(name){

    if(androidAvailable()){

        try{

            Android.callContact(name);

            responseText.textContent=
                "📞 در حال تماس با "+name;

            return;

        }catch(e){}
    }

    voice("fail");
}


/* =========================
   پیامک مخاطب
========================= */

function smsContact(name,message){

    if(androidAvailable()){

        try{

            Android.sendContactSMS(name,message);

            responseText.textContent=
                "✉️ پیامک برای "+name+" آماده شد.";

            return;

        }catch(e){}
    }

    voice("fail");
}


/* =========================
   گوگل
========================= */

function googleSearch(query){

    const url=
        "https://www.google.com/search?q="+
        encodeURIComponent(query);

    responseText.textContent=
        "🔎 در حال جستجوی «"+query+"»...";

    voice("google");

    if(androidAvailable()){

        try{
            Android.openUrl(url);
            return;
        }catch(e){}
    }

    window.location.href=url;
}


/* =========================
   کنترل موسیقی
========================= */

function musicPlay(){

    if(androidAvailable()){

        try{
            Android.playMusic();
            responseText.textContent="🎵 پخش موسیقی";
            return;
        }catch(e){}
    }

    voice("fail");
}


function musicPause(){

    if(androidAvailable()){

        try{
            Android.pauseMusic();
            responseText.textContent="⏸️ موسیقی متوقف شد";
            return;
        }catch(e){}
    }

    voice("fail");
}


function musicNext(){

    if(androidAvailable()){

        try{
            Android.nextMusic();
            responseText.textContent="⏭️ آهنگ بعدی";
            return;
        }catch(e){}
    }

    voice("fail");
}


/* =========================
   صدا
========================= */

function volumeUp(){

    if(androidAvailable()){
        Android.adjustVolume("up");
        responseText.textContent="🔊 صدا زیاد شد.";
    }
}


function volumeDown(){

    if(androidAvailable()){
        Android.adjustVolume("down");
        responseText.textContent="🔉 صدا کم شد.";
    }
}


/* =========================
   تشخیص گفتار
========================= */

function createRecognition(){

    const SpeechRecognition=
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if(!SpeechRecognition){

        responseText.textContent=
            "❌ تشخیص گفتار در این WebView در دسترس نیست.";

        voice("error");

        return null;
    }

    const r=new SpeechRecognition();

    r.lang="fa-IR";
    r.continuous=false;
    r.interimResults=false;
    r.maxAlternatives=1;

    r.onstart=function(){

        listening=true;

        setStatus("در حال گوش دادن...","listening");

        micBtn.classList.add("listening");

        orb.className="orb listening";

        micIcon.className=
            "fas fa-circle-notch fa-spin";
    };


    r.onresult=function(event){

        const text=
            event.results[0][0].transcript.trim();

        userText.textContent=text;

        listening=false;

        micBtn.classList.remove("listening");

        micIcon.className="fas fa-microphone";

        processCommand(text);
    };


    r.onerror=function(){

        listening=false;

        micBtn.classList.remove("listening");

        micIcon.className="fas fa-microphone";

        orb.className="orb pulse";

        setStatus("آماده");

        voice("error");
    };


    r.onend=function(){

        listening=false;

        micBtn.classList.remove("listening");

        micIcon.className="fas fa-microphone";

        if(!processing){
            orb.className="orb pulse";
        }
    };

    return r;
}


/* =========================
   شروع فرمان
========================= */

function startCommandListening(){

    if(listening)return;

    recognition=createRecognition();

    if(!recognition)return;

    try{
        recognition.start();
    }catch(e){}
}


/* =========================
   نرمال‌سازی فارسی
========================= */

function normalize(text){

    return text

    .replace(/[۰-۹]/g,function(d){
        return String("۰۱۲۳۴۵۶۷۸۹".indexOf(d));
    })

    .replace(/ي/g,"ی")
    .replace(/ك/g,"ک")
    .replace(/\s+/g," ")
    .trim()
    .toLowerCase();
}


/* =========================
   پردازش فرمان‌ها
========================= */

function processCommand(original){

    processing=true;

    orb.className="orb processing";

    setStatus("در حال پردازش...","processing");

    const text=normalize(original);


    /* سلام اهورا */

    if(
        text.includes("سلام اهورا") ||
        text==="اهورا"
    ){

        responseText.textContent=
            "👋 سلام! من اهورا هستم.";

        voice("hello");

        finishCommand();

        return;
    }


    /* واتساپ */

    if(
        text.includes("واتساپ") &&
        /باز|اجرا/.test(text)
    ){

        openApp(
            "com.whatsapp",
            "واتساپ"
        );

        finishCommand();

        return;
    }


    /* تلگرام */

    if(
        text.includes("تلگرام") &&
        /باز|اجرا/.test(text)
    ){

        openApp(
            "org.telegram.messenger",
            "تلگرام"
        );

        finishCommand();

        return;
    }


    /* اینستاگرام */

    if(
        text.includes("اینستاگرام") &&
        /باز|اجرا/.test(text)
    ){

        openApp(
            "com.instagram.android",
            "اینستاگرام"
        );

        finishCommand();

        return;
    }


    /* یوتیوب */

    if(
        text.includes("یوتیوب") &&
        /باز|اجرا/.test(text)
    ){

        openApp(
            "com.google.android.youtube",
            "یوتیوب"
        );

        finishCommand();

        return;
    }


    /* کروم */

    if(
        text.includes("کروم") &&
        /باز|اجرا/.test(text)
    ){

        openApp(
            "com.android.chrome",
            "کروم"
        );

        finishCommand();

        return;
    }


    /* دوربین */

    if(
        text.includes("دوربین") &&
        /باز|اجرا/.test(text)
    ){

        if(androidAvailable()){
            Android.openCamera();
            responseText.textContent="📷 دوربین باز شد.";
            voice("open");
        }

        finishCommand();

        return;
    }


    /* گالری */

    if(
        text.includes("گالری") &&
        /باز|اجرا/.test(text)
    ){

        if(androidAvailable()){
            Android.openGallery();
            responseText.textContent="🖼️ گالری باز شد.";
            voice("open");
        }

        finishCommand();

        return;
    }


    /* تماس با شماره */

    const phone=text.match(
        /(?:با\s*)?(?:شماره\s*)?([0-9+]{10,13})\s*(?:رو\s*)?(?:بگیر|تماس|زنگ)/
    );

    if(phone){

        voice("call");

        responseText.innerHTML=
            "📞 تماس با <b>"+
            phone[1]+
            "</b>";

        callNumber(phone[1]);

        finishCommand();

        return;
    }


    /* تماس با مامان */

    if(
        /مامان|مادر|مامانم/.test(text) &&
        /تماس|زنگ|بگیر/.test(text)
    ){

        voice("call");

        responseText.textContent=
            "📞 در حال تماس با مامان...";

        callContact("مامان");

        finishCommand();

        return;
    }


    /* تماس با مخاطب */

    if(
        /تماس|زنگ/.test(text)
    ){

        const names=[
            "بابا",
            "پدر",
            "مادر",
            "مامان",
            "برادر",
            "خواهر",
            "علی",
            "محمد",
            "رضا",
            "احمد",
            "سارا"
        ];

        for(const name of names){

            if(text.includes(name)){

                voice("call");

                responseText.textContent=
                    "📞 در حال تماس با "+name+"...";

                callContact(name);

                finishCommand();

                return;
            }
        }
    }


    /* پیامک */

    if(
        /پیامک|پیام/.test(text) &&
        /بفرست|ارسال|بده/.test(text)
    ){

        let name=null;

        if(text.includes("مامان")){
            name="مامان";
        }else if(text.includes("بابا")){
            name="بابا";
        }

        if(name){

            const msg="سلام، این پیام از اهورا AI است.";

            smsContact(name,msg);

            finishCommand();

            return;
        }
    }


    /* صدای زیاد */

    if(
        /صدا/.test(text) &&
        /زیاد|بالا/.test(text)
    ){

        volumeUp();

        finishCommand();

        return;
    }


    /* صدای کم */

    if(
        /صدا/.test(text) &&
        /کم|پایین/.test(text)
    ){

        volumeDown();

        finishCommand();

        return;
    }


    /* پخش موسیقی */

    if(
        /موسیقی|آهنگ/.test(text) &&
        /پخش|اجرا|بزن/.test(text)
    ){

        musicPlay();

        finishCommand();

        return;
    }


    /* توقف موسیقی */

    if(
        /موسیقی|آهنگ/.test(text) &&
        /توقف|قطع|متوقف/.test(text)
    ){

        musicPause();

        finishCommand();

        return;
    }


    /* آهنگ بعدی */

    if(
        /آهنگ|موسیقی/.test(text) &&
        /بعدی|بعد/.test(text)
    ){

        musicNext();

        finishCommand();

        return;
    }


    /* گوگل */

    const google=text.match(
        /(?:در\s*)?گوگل\s*(?:جستجو\s*)?(?:کن\s*)?(.+)/
    );

    if(google){

        googleSearch(google[1]);

        finishCommand();

        return;
    }


    /* ساعت */

    if(
        /ساعت/.test(text) &&
        /چنده|چند|الان/.test(text)
    ){

        const d=new Date();

        responseText.textContent=
            "🕐 ساعت "+
            String(d.getHours()).padStart(2,"0")+
            ":"+
            String(d.getMinutes()).padStart(2,"0")+
            " است.";

        voice("time");

        finishCommand();

        return;
    }


    /* محاسبه */

    const calc=text.match(
        /([0-9]+)\s*([+\-*\/])\s*([0-9]+)/
    );

    if(calc){

        const a=parseFloat(calc[1]);
        const b=parseFloat(calc[3]);
        const op=calc[2];

        let result=0;

        if(op==="+")result=a+b;
        if(op==="-")result=a-b;
        if(op==="*")result=a*b;
        if(op==="/")result=a/b;

        responseText.textContent=
            "🧮 نتیجه: "+result;

        finishCommand();

        return;
    }


    /* فرمان ناشناخته */

    responseText.innerHTML=
        "🤔 فرمان را متوجه نشدم.<br><br>"+
        "مثلاً بگو:<br>"+
        "«سلام اهورا»<br>"+
        "«واتساپ رو باز کن»<br>"+
        "«با مامان تماس بگیر»<br>"+
        "«به مامان پیام بده»<br>"+
        "«موسیقی رو پخش کن»<br>"+
        "«آهنگ بعدی»<br>"+
        "«صدا رو زیاد کن»<br>"+
        "«در گوگل ماینکرفت رو جستجو کن»";

    voice("error");

    finishCommand();
}


/* =========================
   پایان فرمان
========================= */

function finishCommand(){

    processing=false;

    setStatus("آماده");

    orb.className="orb pulse";
}


/* =========================
   حالت «سلام اهورا»
========================= */

function startWakeMode(){

    const SpeechRecognition=
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if(!SpeechRecognition){

        responseText.textContent=
            "❌ تشخیص گفتار پشتیبانی نمی‌شود.";

        voice("error");

        return;
    }


    if(wakeMode)return;

    wakeMode=true;

    wakeBtn.classList.add("active");

    wakeBtn.textContent=
        "🟢 «سلام اهورا» فعال است";

    floatingBtn.classList.add("active");

    setStatus("منتظر «سلام اهورا»...","listening");


    wakeRecognition=new SpeechRecognition();

    wakeRecognition.lang="fa-IR";

    wakeRecognition.continuous=true;

    wakeRecognition.interimResults=false;


    wakeRecognition.onresult=function(event){

        const result=
            event.results[event.results.length-1][0]
            .transcript;

        const text=normalize(result);

        if(
            text.includes("سلام اهورا") ||
            text.includes("اهورا")
        ){

            userText.textContent=
                "سلام اهورا";

            voice("hello");

            setStatus(
                "اهورا فعال شد؛ فرمان را بگو",
                "listening"
            );

            setTimeout(function(){

                startCommandListening();

            },500);
        }
    };


    wakeRecognition.onerror=function(){

        if(wakeMode){

            setTimeout(function(){

                try{
                    wakeRecognition.start();
                }catch(e){}

            },1000);
        }
    };


    wakeRecognition.onend=function(){

        if(wakeMode){

            setTimeout(function(){

                try{
                    wakeRecognition.start();
                }catch(e){}

            },300);
        }
    };


    try{
        wakeRecognition.start();
    }catch(e){}
}


/* =========================
   خاموش کردن حالت بیدارباش
========================= */

function stopWakeMode(){

    wakeMode=false;

    wakeBtn.classList.remove("active");

    wakeBtn.textContent=
        "🎙️ فعال کردن «سلام اهورا»";

    floatingBtn.classList.remove("active");

    setStatus("آماده");

    try{

        if(wakeRecognition){
            wakeRecognition.stop();
        }

    }catch(e){}
}


/* =========================
   دکمه فعال‌سازی
========================= */

wakeBtn.addEventListener(
    "click",
    function(){

        if(wakeMode){
            stopWakeMode();
        }else{
            startWakeMode();
        }

    }
);


/* =========================
   دکمه میکروفون
========================= */

micBtn.addEventListener(
    "click",
    function(){

        startCommandListening();

    }
);


/* =========================
   دکمه شناور
========================= */

floatingBtn.addEventListener(
    "click",
    function(){

        startCommandListening();

    }
);


/* =========================
   شروع
========================= */

responseText.innerHTML=
    "👋 سلام! من اهورا هستم.<br>"+
    "دکمه «فعال کردن سلام اهورا» را بزن.";

</script>
