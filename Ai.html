<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ahoora AI</title>
    <link href="https://cdn.fontcdn.ir/Font/Persian/Vazir/Vazir.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazir', sans-serif;
            background: radial-gradient(circle at center, #0d0d0d 0%, #000000 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #fff;
            user-select: none;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .orb-container {
            position: relative;
            width: 180px;
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
        }

        .orb {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #6c5ce7, #0984e3);
            box-shadow: 0 0 80px rgba(108, 92, 231, 0.7), 0 0 150px rgba(9, 132, 227, 0.4);
            animation: pulse 2.5s ease-in-out infinite;
            transition: all 0.3s ease;
            position: relative;
        }

        .orb.listening {
            background: radial-gradient(circle at 30% 30%, #00b894, #00cec9);
            box-shadow: 0 0 80px rgba(0, 206, 201, 0.7), 0 0 150px rgba(0, 184, 148, 0.4);
            animation: pulse-listening 1s ease-in-out infinite;
        }

        .orb.processing {
            background: radial-gradient(circle at 30% 30%, #fdcb6e, #e17055);
            box-shadow: 0 0 80px rgba(225, 112, 85, 0.7), 0 0 150px rgba(253, 203, 110, 0.4);
            animation: pulse-processing 0.8s ease-in-out infinite;
        }

        .orb.speaking {
            background: radial-gradient(circle at 30% 30%, #00b894, #00cec9);
            box-shadow: 0 0 80px rgba(0, 206, 201, 0.9), 0 0 150px rgba(0, 184, 148, 0.6);
            animation: pulse-speaking 0.6s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes pulse-listening {
            0%, 100% { transform: scale(1); box-shadow: 0 0 80px rgba(0, 206, 201, 0.7); }
            50% { transform: scale(1.08); box-shadow: 0 0 120px rgba(0, 206, 201, 1); }
        }

        @keyframes pulse-processing {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1) rotate(5deg); }
        }

        @keyframes pulse-speaking {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.12); }
        }

        .sound-waves {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .sound-waves.active {
            opacity: 1;
        }

        .wave {
            position: absolute;
            top: 50%;
            left: 50%;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.15);
            transform: translate(-50%, -50%) scale(0);
            animation: wave-anim 1.8s ease-out infinite;
        }

        .wave:nth-child(2) { animation-delay: 0.4s; }
        .wave:nth-child(3) { animation-delay: 0.8s; }
        .wave:nth-child(4) { animation-delay: 1.2s; }
        .wave:nth-child(5) { animation-delay: 1.6s; }

        @keyframes wave-anim {
            0% { width: 20px; height: 20px; opacity: 0.8; border-width: 3px; }
            100% { width: 220px; height: 220px; opacity: 0; border-width: 1px; }
        }

        .mic-btn {
            margin-top: 10px;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            z-index: 10;
        }

        .mic-btn:hover {
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.15);
        }

        .mic-btn:active {
            transform: scale(0.92);
        }

        .mic-btn svg {
            width: 36px;
            height: 36px;
            fill: #fff;
            transition: all 0.3s ease;
        }

        .mic-btn.listening svg {
            fill: #00cec9;
        }

        .mic-btn.processing svg {
            fill: #fdcb6e;
        }

        .mic-btn.speaking svg {
            fill: #00b894;
        }

        .status {
            margin-top: 20px;
            font-size: 16px;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 0.5px;
            min-height: 28px;
            font-weight: 300;
            transition: all 0.3s ease;
        }

        .transcript {
            margin-top: 8px;
            font-size: 20px;
            font-weight: 400;
            color: #fff;
            min-height: 30px;
            text-align: center;
            padding: 0 10px;
            word-break: break-word;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 8px 16px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            max-width: 90%;
        }

        .response-card {
            margin-top: 25px;
            width: 100%;
            max-width: 380px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 20px 24px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
            transition: all 0.4s ease;
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
            min-height: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .response-card.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .response-card .title {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .response-card .content {
            font-size: 18px;
            line-height: 1.6;
            color: #fff;
            font-weight: 300;
            max-height: 200px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.1) transparent;
        }
        .response-card .content::-webkit-scrollbar {
            width: 4px;
        }
        .response-card .content::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 8px;
        }

        .response-card .actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .response-card .actions button {
            flex: 1;
            min-width: 80px;
            padding: 10px 12px;
            border: none;
            border-radius: 14px;
            font-family: 'Vazir', sans-serif;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(4px);
            font-weight: 400;
        }

        .btn-confirm {
            background: rgba(0, 206, 201, 0.25);
            color: #00cec9;
            border: 1px solid rgba(0, 206, 201, 0.3);
        }
        .btn-confirm:hover { background: rgba(0, 206, 201, 0.4); }
        .btn-cancel {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
            border: 1px solid rgba(255, 107, 107, 0.25);
        }
        .btn-cancel:hover { background: rgba(255, 107, 107, 0.35); }
        .btn-primary {
            background: rgba(108, 92, 231, 0.25);
            color: #a29bfe;
            border: 1px solid rgba(108, 92, 231, 0.3);
        }
        .btn-primary:hover { background: rgba(108, 92, 231, 0.4); }

        .footer {
            position: absolute;
            bottom: 30px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 1px;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .container {
            animation: fadeInUp 0.8s ease-out;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container" id="app">
    <div class="orb-container">
        <div class="orb" id="orb"></div>
        <div class="sound-waves" id="soundWaves">
            <div class="wave"></div>
            <div class="wave"></div>
            <div class="wave"></div>
            <div class="wave"></div>
            <div class="wave"></div>
        </div>
    </div>

    <div class="mic-btn" id="micBtn" title="برای صحبت کلیک کنید">
        <svg viewBox="0 0 24 24">
            <path d="M12 16c-2.206 0-4-1.794-4-4V6c0-2.206 1.794-4 4-4s4 1.794 4 4v6c0 2.206-1.794 4-4 4zm8-4h-2c0 2.607-1.68 4.88-4 5.737V20h-4v-2.263c-2.32-.857-4-3.13-4-5.737H4c0 3.624 2.582 6.672 6 7.438V22h4v-2.562c3.418-.766 6-3.814 6-7.438z"/>
        </svg>
    </div>

    <div class="status" id="status">روی میکروفون کلیک کن</div>
    <div class="transcript" id="transcript"></div>

    <div class="response-card" id="responseCard">
        <div class="title" id="responseTitle">پاسخ</div>
        <div class="content" id="responseContent"></div>
        <div class="actions" id="responseActions"></div>
    </div>

    <div class="footer">Ahoora AI · v1.0</div>
</div>

<script>
    (function() {
        'use strict';

        // ---------- عناصر DOM ----------
        const orb = document.getElementById('orb');
        const micBtn = document.getElementById('micBtn');
        const statusEl = document.getElementById('status');
        const transcriptEl = document.getElementById('transcript');
        const responseCard = document.getElementById('responseCard');
        const responseTitle = document.getElementById('responseTitle');
        const responseContent = document.getElementById('responseContent');
        const responseActions = document.getElementById('responseActions');
        const soundWaves = document.getElementById('soundWaves');

        const STATE = {
            IDLE: 'idle',
            LISTENING: 'listening',
            PROCESSING: 'processing',
            SPEAKING: 'speaking'
        };

        let currentState = STATE.IDLE;
        let recognition = null;
        let synth = window.speechSynthesis;
        let isSpeaking = false;

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            statusEl.textContent = 'مرورگر از تشخیص گفتار پشتیبانی نمی‌کند';
            micBtn.style.opacity = '0.4';
            micBtn.style.pointerEvents = 'none';
        } else {
            recognition = new SpeechRecognition();
            recognition.lang = 'fa-IR';
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.maxAlternatives = 1;

            recognition.onstart = function() {
                setState(STATE.LISTENING);
                statusEl.textContent = 'در حال گوش دادن...';
                soundWaves.classList.add('active');
                transcriptEl.textContent = '';
            };

            recognition.onresult = function(event) {
                let final = '';
                let interim = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        final += transcript;
                    } else {
                        interim += transcript;
                    }
                }
                const displayText = final || interim;
                transcriptEl.textContent = displayText;
                if (final) {
                    try { recognition.stop(); } catch (e) {}
                    processCommand(final.trim());
                }
            };

            recognition.onerror = function(event) {
                if (event.error === 'not-allowed') {
                    statusEl.textContent = 'دسترسی به میکروفون مجاز نیست';
                } else if (event.error === 'no-speech') {
                    statusEl.textContent = 'صدایی شناسایی نشد، دوباره تلاش کن';
                } else {
                    statusEl.textContent = 'خطا: ' + event.error;
                }
                setState(STATE.IDLE);
                soundWaves.classList.remove('active');
            };

            recognition.onend = function() {
                if (currentState === STATE.LISTENING) {
                    setState(STATE.IDLE);
                    soundWaves.classList.remove('active');
                    statusEl.textContent = 'روی میکروفون کلیک کن';
                }
            };
        }

        function setState(state) {
            currentState = state;
            orb.className = 'orb';
            micBtn.className = 'mic-btn';
            if (state === STATE.LISTENING) {
                orb.classList.add('listening');
                micBtn.classList.add('listening');
            } else if (state === STATE.PROCESSING) {
                orb.classList.add('processing');
                micBtn.classList.add('processing');
            } else if (state === STATE.SPEAKING) {
                orb.classList.add('speaking');
                micBtn.classList.add('speaking');
            }
        }

        function toggleListening() {
            if (!recognition) return;
            if (currentState === STATE.LISTENING) {
                try { recognition.stop(); } catch (e) {}
                setState(STATE.IDLE);
                soundWaves.classList.remove('active');
                statusEl.textContent = 'روی میکروفون کلیک کن';
                return;
            }
            try {
                recognition.start();
            } catch (e) {
                statusEl.textContent = 'خطا در شروع، دوباره تلاش کن';
            }
        }

        micBtn.addEventListener('click', toggleListening);

        // ---------- سنتز گفتار ----------
        function speak(text, callback) {
            if (!synth) {
                if (callback) callback();
                return;
            }
            if (synth.speaking) {
                synth.cancel();
            }
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'fa-IR';
            utterance.rate = 0.9;
            utterance.pitch = 1;
            utterance.volume = 1;

            const voices = synth.getVoices();
            const faVoice = voices.find(v => v.lang.startsWith('fa'));
            if (faVoice) utterance.voice = faVoice;

            setState(STATE.SPEAKING);
            statusEl.textContent = 'در حال پاسخ دادن...';
            isSpeaking = true;

            utterance.onend = function() {
                isSpeaking = false;
                setState(STATE.IDLE);
                statusEl.textContent = 'روی میکروفون کلیک کن';
                if (callback) callback();
            };
            utterance.onerror = function() {
                isSpeaking = false;
                setState(STATE.IDLE);
                statusEl.textContent = 'خطا در پخش صدا';
                if (callback) callback();
            };
            synth.speak(utterance);
        }

        function showResponse(title, content, actions = []) {
            responseTitle.textContent = title || 'پاسخ';
            responseContent.innerHTML = content || '';
            responseActions.innerHTML = '';
            if (actions && actions.length) {
                actions.forEach(a => {
                    const btn = document.createElement('button');
                    btn.textContent = a.label;
                    btn.className = a.className || 'btn-primary';
                    btn.addEventListener('click', a.action);
                    responseActions.appendChild(btn);
                });
            }
            responseCard.classList.add('visible');
        }

        function hideResponse() {
            responseCard.classList.remove('visible');
            responseActions.innerHTML = '';
        }

        // ---------- Android Bridge ----------
        const AndroidBridge = {
            isAvailable: function() {
                return typeof window.Android !== 'undefined' && window.Android !== null;
            },
            openApp: function(packageName) {
                if (this.isAvailable()) {
                    try { window.Android.openApp(packageName); return true; } catch (e) {}
                }
                try { window.location.href = `intent://${packageName}#Intent;package=${packageName};end`; return true; } catch (e) {}
                return false;
            },
            makeCall: function(phoneNumber) {
                if (this.isAvailable()) {
                    try { window.Android.makeCall(phoneNumber); return true; } catch (e) {}
                }
                try { window.location.href = `tel:${phoneNumber}`; return true; } catch (e) {}
                return false;
            },
            openGallery: function() {
                if (this.isAvailable()) {
                    try { window.Android.openGallery(); return true; } catch (e) {}
                }
                this._fallbackFilePicker('image/*,video/*');
                return true;
            },
            openImage: function() {
                if (this.isAvailable()) {
                    try { window.Android.openImage(); return true; } catch (e) {}
                }
                this._fallbackFilePicker('image/*');
                return true;
            },
            openVideo: function() {
                if (this.isAvailable()) {
                    try { window.Android.openVideo(); return true; } catch (e) {}
                }
                this._fallbackFilePicker('video/*');
                return true;
            },
            openCamera: function() {
                if (this.isAvailable()) {
                    try { window.Android.openCamera(); return true; } catch (e) {}
                }
                this._fallbackFilePicker('image/*', true);
                return true;
            },
            recordVideo: function() {
                if (this.isAvailable()) {
                    try { window.Android.recordVideo(); return true; } catch (e) {}
                }
                this._fallbackFilePicker('video/*', true);
                return true;
            },
            sendSMS: function(phoneNumber, message) {
                if (this.isAvailable()) {
                    try { window.Android.sendSMS(phoneNumber, message); return true; } catch (e) {}
                }
                try {
                    let url = `sms:${phoneNumber}`;
                    if (message) url += `?body=${encodeURIComponent(message)}`;
                    window.location.href = url;
                    return true;
                } catch (e) {}
                return false;
            },
            openUrl: function(url) {
                if (this.isAvailable()) {
                    try { window.Android.openUrl(url); return true; } catch (e) {}
                }
                try { window.open(url, '_blank'); return true; } catch (e) {}
                return false;
            },
            _fallbackFilePicker: function(accept, capture = false) {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = accept;
                if (capture) input.capture = 'environment';
                input.style.display = 'none';
                document.body.appendChild(input);
                input.click();
                setTimeout(() => document.body.removeChild(input), 5000);
            }
        };

        // ---------- جستجوی اینترنتی با DuckDuckGo API (خواندن خلاصه) ----------
        async function searchAndRead(query) {
            setState(STATE.PROCESSING);
            statusEl.textContent = 'در حال جستجو...';
            try {
                const url = `https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1&skip_disambig=1`;
                const response = await fetch(url);
                if (!response.ok) throw new Error('Network error');
                const data = await response.json();

                // استخراج خلاصه
                let abstract = data.AbstractText || '';
                let answer = data.Answer || '';
                let definition = data.Definition || '';
                let resultText = abstract || answer || definition;

                if (resultText) {
                    // خلاصه یافت شد
                    const fullText = `نتیجه جستجو برای ${query}: ${resultText}`;
                    speak(fullText);
                    showResponse('نتیجه جستجو',
                        `<strong>${query}</strong><br><br>${resultText}`,
                        [
                            { label: 'باز کردن در گوگل', className: 'btn-primary', action: () => {
                                AndroidBridge.openUrl(`https://www.google.com/search?q=${encodeURIComponent(query)}`);
                            }},
                            { label: 'بستن', className: 'btn-cancel', action: hideResponse }
                        ]
                    );
                } else {
                    // نتیجه‌ای نبود -> باز کردن گوگل
                    const msg = `نتیجه‌ای برای ${query} پیدا نشد. در گوگل جستجو می‌کنم.`;
                    speak(msg);
                    AndroidBridge.openUrl(`https://www.google.com/search?q=${encodeURIComponent(query)}`);
                    showResponse('جستجو', msg, [
                        { label: 'بستن', className: 'btn-cancel', action: hideResponse }
                    ]);
                }
            } catch (error) {
                console.error('Search error:', error);
                // در صورت خطا، فقط گوگل را باز کن
                const msg = `خطا در جستجو، اما لینک گوگل برای ${query} باز می‌شود.`;
                speak(msg);
                AndroidBridge.openUrl(`https://www.google.com/search?q=${encodeURIComponent(query)}`);
                showResponse('جستجو', msg, [
                    { label: 'بستن', className: 'btn-cancel', action: hideResponse }
                ]);
            }
        }

        // ---------- پردازش فرمان ----------
        function processCommand(command) {
            if (!command) return;
            setState(STATE.PROCESSING);
            statusEl.textContent = 'در حال پردازش...';
            hideResponse();

            // 1. باز کردن برنامه
            const appMap = {
                'واتساپ': 'com.whatsapp',
                'تلگرام': 'org.telegram.messenger',
                'اینستاگرام': 'com.instagram.android',
                'یوتیوب': 'com.google.android.youtube',
                'کروم': 'com.android.chrome',
                'گالری': 'com.android.gallery3d',
                'دوربین': 'com.android.camera',
                'تنظیمات': 'com.android.settings'
            };
            for (const [name, pkg] of Object.entries(appMap)) {
                if (command.includes(name) && (command.includes('باز کن') || command.includes('باز کن'))) {
                    const success = AndroidBridge.openApp(pkg);
                    if (success) {
                        speak(`در حال باز کردن ${name}`);
                        showResponse('باز کردن برنامه', `${name} در حال اجرا`, [
                            { label: 'بازگشت', className: 'btn-cancel', action: hideResponse }
                        ]);
                    } else {
                        speak(`متاسفم، نتوانستم ${name} را باز کنم`);
                        showResponse('خطا', `باز کردن ${name} ممکن نیست`, [
                            { label: 'بستن', className: 'btn-cancel', action: hideResponse }
                        ]);
                    }
                    return;
                }
            }

            // 2. تماس تلفنی
            const phoneMatch = command.match(/(?:با\s*)?(\+?[0-9]{10,15})\s*(?:تماس بگیر|بگیر|زنگ بزن)/) ||
                              command.match(/(?:شماره\s*)?(\+?[0-9]{10,15})\s*(?:رو\s*)?(?:بگیر|تماس بگیر)/) ||
                              command.match(/تماس\s*با\s*(\+?[0-9]{10,15})/);
            if (phoneMatch) {
                const number = phoneMatch[1];
                showResponse('تأیید تماس',
                    `می‌خواهی با شماره <strong>${number}</strong> تماس بگیرم؟`,
                    [
                        { label: 'تماس', className: 'btn-confirm', action: () => {
                            AndroidBridge.makeCall(number);
                            hideResponse();
                            speak('در حال برقراری تماس');
                        }},
                        { label: 'لغو', className: 'btn-cancel', action: () => {
                            hideResponse();
                            speak('تماس لغو شد');
                        }}
                    ]
                );
                speak('آیا می‌خواهید با این شماره تماس بگیرم؟');
                return;
            }

            // 3. گالری / عکس / فیلم
            if (command.includes('گالری') && (command.includes('باز کن') || command.includes('نمایش'))) {
                AndroidBridge.openGallery();
                speak('در حال باز کردن گالری');
                showResponse('گالری', 'در حال باز کردن گالری', [
                    { label: 'بستن', className: 'btn-cancel', action: hideResponse }
                ]);
                return;
            }
            if ((command.includes('عکس') && command.includes('باز کن')) || command.includes('عکس‌هام')) {
                AndroidBridge.openImage();
                speak('در حال باز کردن عکس‌ها');
                showResponse('عکس‌ها', 'در حال باز کردن گالری تصاویر', [
                    { label: 'بستن', className: 'btn-cancel', action: hideResponse }
                ]);
                return;
            }
            if ((command.includes('فیلم') && command.includes('باز کن')) || command.includes('فیلم‌هام')) {
                AndroidBridge.openVideo();
                speak('در حال باز کردن فیلم‌ها');
                showResponse('فیلم‌ها', 'در حال باز کردن گالری ویدئو', [
                    { label: 'بستن', className: 'btn-cancel', action: hideResponse }
                ]);
                return;
            }

            // 4. دوربین
            if (command.includes('دوربین') && (command.includes('باز کن') || command.includes('فعال کن'))) {
                AndroidBridge.openCamera();
                speak('در حال باز کردن دوربین');
                showResponse('دوربین', 'دوربین در حال اجرا', [
                    { label: 'بستن', className: 'btn-cancel', action: hideResponse }
                ]);
                return;
            }
            if (command.includes('عکس بگیر')) {
                AndroidBridge.openCamera();
                speak('در حال گرفتن عکس');
                showResponse('دوربین', 'دوربین برای عکس باز شد', [
                    { label: 'بستن', className: 'btn-cancel', action: hideResponse }
                ]);
                return;
            }
            if (command.includes('فیلم بگیر')) {
                AndroidBridge.recordVideo();
                speak('در حال ضبط فیلم');
                showResponse('دوربین', 'ضبط فیلم شروع شد', [
                    { label: 'بستن', className: 'btn-cancel', action: hideResponse }
                ]);
                return;
            }

            // 5. ارسال پیام (SMS)
            const smsMatch = command.match(/(?:برای\s*)?([^\s]+)\s*(?:پیام\s*بفرست|پیام\s*بده|اس‌ام‌اس\s*بفرست)/);
            if (smsMatch) {
                const target = smsMatch[1];
                if (/^[0-9]+$/.test(target)) {
                    AndroidBridge.sendSMS(target, '');
                    speak(`در حال باز کردن پیامک برای شماره ${target}`);
                    showResponse('پیامک', `پیامک برای ${target}`, [
                        { label: 'بستن', className: 'btn-cancel', action: hideResponse }
                    ]);
                } else {
                    speak(`لطفاً شماره ${target} را بگویید`);
                    showResponse('پیامک', `شماره ${target} را وارد کنید`, [
                        { label: 'لغو', className: 'btn-cancel', action: hideResponse }
                    ]);
                }
                return;
            }

            // 6. واتساپ
            if ((command.includes('واتساپ') || command.includes('واتس‌اپ')) && command.includes('باز کن')) {
                AndroidBridge.openApp('com.whatsapp');
                speak('در حال باز کردن واتساپ');
                showResponse('واتساپ', 'واتساپ در حال اجرا', [
                    { label: 'بستن', className: 'btn-cancel', action: hideResponse }
                ]);
                return;
            }

            // 7. کنترل رسانه (ساده)
            if (command.includes('موسیقی پخش کن') || command.includes('آهنگ پخش کن')) {
                speak('در حال پخش موسیقی');
                showResponse('پخش موسیقی', 'در حال پخش یک آهنگ نمونه', [
                    { label: 'توقف', className: 'btn-cancel', action: () => {
                        if (window._ahooraAudio) {
                            window._ahooraAudio.pause();
                            window._ahooraAudio.currentTime = 0;
                            speak('موسیقی متوقف شد');
                        }
                    }}
                ]);
                try {
                    const audio = new Audio('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3');
                    audio.play();
                    window._ahooraAudio = audio;
                } catch (e) {}
                return;
            }
            if (command.includes('موسیقی رو متوقف کن') || command.includes('آهنگ رو متوقف کن')) {
                if (window._ahooraAudio) {
                    window._ahooraAudio.pause();
                    window._ahooraAudio.currentTime = 0;
                    speak('موسیقی متوقف شد');
                    showResponse('توقف', 'موسیقی متوقف شد', [
                        { label: 'بستن', className: 'btn-cancel', action: hideResponse }
                    ]);
                } else {
                    speak('هیچ موسیقی در حال پخش نیست');
                }
                return;
            }
            if (command.includes('صدا رو زیاد کن') || command.includes('بلندی صدا')) {
                if (AndroidBridge.isAvailable()) {
                    try { window.Android.volumeUp(); } catch (e) {}
                }
                speak('صدا زیاد شد');
                showResponse('صدا', 'بلندی صدا افزایش یافت', [
                    { label: 'بستن', className: 'btn-cancel', action: hideResponse }
                ]);
                return;
            }
            if (command.includes('صدا رو کم کن') || command.includes('کم کردن صدا')) {
                if (AndroidBridge.isAvailable()) {
                    try { window.Android.volumeDown(); } catch (e) {}
                }
                speak('صدا کم شد');
                showResponse('صدا', 'بلندی صدا کاهش یافت', [
                    { label: 'بستن', className: 'btn-cancel', action: hideResponse }
                ]);
                return;
            }

            // 8. زمان و تاریخ
            if (command.includes('ساعت') || command.includes('چند') || (command.includes('وقت') && command.includes('چنده'))) {
                const now = new Date();
                const time = now.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
                const date = now.toLocaleDateString('fa-IR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                const responseText = `ساعت ${time} و تاریخ ${date} است.`;
                speak(responseText);
                showResponse('زمان و تاریخ', responseText, [
                    { label: 'بستن', className: 'btn-cancel', action: hideResponse }
                ]);
                return;
            }

            // 9. محاسبات ساده
            const calcMatch = command.match(/([0-9]+)\s*([+\-*/])\s*([0-9]+)/);
            if (calcMatch) {
                const a = parseFloat(calcMatch[1]);
                const op = calcMatch[2];
                const b = parseFloat(calcMatch[3]);
                let result;
                switch (op) {
                    case '+': result = a + b; break;
                    case '-': result = a - b; break;
                    case '*': result = a * b; break;
                    case '/': result = b !== 0 ? a / b : 'خطا'; break;
                }
                const responseText = `حاصل ${a} ${op} ${b} برابر است با ${result}`;
                speak(responseText);
                showResponse('محاسبه', responseText, [
                    { label: 'بستن', className: 'btn-cancel', action: hideResponse }
                ]);
                return;
            }

            // 10. باز کردن سایت
            const urlMatch = command.match(/(?:باز کن\s*)(?:سایت\s*)?([^\s]+\.\w+)/);
            if (urlMatch) {
                let url = urlMatch[1];
                if (!url.startsWith('http')) url = 'https://' + url;
                AndroidBridge.openUrl(url);
                speak(`در حال باز کردن ${url}`);
                showResponse('باز کردن سایت', `در حال باز کردن ${url}`, [
                    { label: 'بستن', className: 'btn-cancel', action: hideResponse }
                ]);
                return;
            }

            // 11. جستجوی اینترنتی (با خواندن نتیجه)
            if (command.includes('جستجو') || command.includes('بگرد') || command.includes('سرچ')) {
                const query = command.replace(/جستجو|بگرد|سرچ|برای من|لطفاً/gi, '').trim();
                if (query) {
                    searchAndRead(query);
                } else {
                    speak('چه چیزی را جستجو کنم؟');
                }
                return;
            }

            // 12. دستورات عمومی
            if (command.includes('سلام') || command.includes('درود')) {
                speak('سلام! چطور می‌توانم کمک کنم؟');
                showResponse('سلام', 'سلام! چطور می‌توانم کمک کنم؟', [
                    { label: 'بستن', className: 'btn-cancel', action: hideResponse }
                ]);
                return;
            }
            if (command.includes('خوبی') || command.includes('چطوری')) {
                speak('خوبم، ممنون! شما چطورید؟');
                showResponse('احوالپرسی', 'خوبم، ممنون! شما چطورید؟', [
                    { label: 'بستن', className: 'btn-cancel', action: hideResponse }
                ]);
                return;
            }
            if (command.includes('متشکرم') || command.includes('مرسی') || command.includes('سپاس')) {
                speak('خواهش می‌کنم!');
                showResponse('تشکر', 'خواهش می‌کنم!', [
                    { label: 'بستن', className: 'btn-cancel', action: hideResponse }
                ]);
                return;
            }

            // 13. خواندن متن
            const readMatch = command.match(/(?:بخوان|بگو|گفتن)\s*(.+)/);
            if (readMatch) {
                const text = readMatch[1];
                speak(text);
                showResponse('خواندن متن', text, [
                    { label: 'بستن', className: 'btn-cancel', action: hideResponse }
                ]);
                return;
            }

            // 14. پاسخ پیش‌فرض
            const fallback = 'متاسفم، متوجه نشدم. لطفاً دوباره بگویید.';
            speak(fallback);
            showResponse('متوجه نشدم', fallback, [
                { label: 'بستن', className: 'btn-cancel', action: hideResponse }
            ]);
        }

        // ---------- مقداردهی اولیه ----------
        function init() {
            if (synth) {
                synth.getVoices();
                synth.onvoiceschanged = function() {
                    synth.getVoices();
                };
            }
            statusEl.textContent = 'روی میکروفون کلیک کن';
            setTimeout(() => {
                speak('سلام، من آهورا هستم. چطور می‌توانم کمک کنم؟');
            }, 600);
        }

        init();

        window.AhooraAI = {
            processCommand,
            speak,
            toggleListening,
            setState,
            AndroidBridge,
            searchAndRead
        };

    })();
</script>

</body>
</html>
