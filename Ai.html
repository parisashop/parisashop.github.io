<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Ahoora AI</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Vazir:wght@300;400;700;900&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:Vazir,sans-serif;

background:#080812;

color:white;

height:100vh;

overflow:hidden;

display:flex;

justify-content:center;

align-items:center;

direction:rtl;

}

.app{

width:100%;

max-width:480px;

height:100vh;

background:
radial-gradient(
ellipse at 50% 20%,
#191934,
#080812 80%
);

display:flex;

flex-direction:column;

align-items:center;

padding:20px 16px;

overflow:hidden;

}

.header{

width:100%;

display:flex;

justify-content:space-between;

align-items:center;

padding:5px;

}

.title{

font-size:24px;

font-weight:900;

background:
linear-gradient(
135deg,
#00d4ff,
#7b2ffc,
#ff6fd8
);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

}

.time{

font-size:14px;

color:#99aacc;

background:rgba(255,255,255,.05);

padding:7px 16px;

border-radius:30px;

}

.orb-wrapper{

width:220px;

height:220px;

margin:15px auto;

position:relative;

display:flex;

justify-content:center;

align-items:center;

}

.orb{

width:150px;

height:150px;

border-radius:50%;

background:
radial-gradient(
circle at 35% 30%,
#0088ff,
#0033aa
);

box-shadow:

0 0 60px rgba(0,100,255,.5),

0 0 120px rgba(0,100,255,.2);

display:flex;

justify-content:center;

align-items:center;

transition:.4s;

}

.inner-glow{

width:70%;

height:70%;

border-radius:50%;

background:
radial-gradient(
circle at 45% 35%,
rgba(255,255,255,.6),
transparent 70%
);

}

.orb.pulse{

animation:pulse 2s infinite;

}

.orb.listening{

background:
radial-gradient(
circle at 35% 30%,
#00ff99,
#00aaff
);

box-shadow:
0 0 80px rgba(0,255,150,.7);

animation:listen 1s infinite;

}

.orb.processing{

background:
radial-gradient(
circle at 35% 30%,
#ffcc00,
#ff6600
);

animation:process .5s infinite;

}

@keyframes pulse{

0%,100%{

transform:scale(1);

}

50%{

transform:scale(1.04);

}

}

@keyframes listen{

0%,100%{

transform:scale(1);

}

50%{

transform:scale(1.08);

}

}

@keyframes process{

0%,100%{

transform:scale(1);

}

50%{

transform:scale(1.05);

}

}

.mic-btn{

width:76px;

height:76px;

border-radius:50%;

border:none;

background:
linear-gradient(
135deg,
#0066ff,
#4400cc
);

color:white;

font-size:36px;

display:flex;

align-items:center;

justify-content:center;

box-shadow:

0 10px 40px rgba(0,80,255,.5);

}

.mic-btn.listening{

background:
linear-gradient(
135deg,
#ff2266,
#cc0066
);

animation:micpulse 1s infinite;

}

@keyframes micpulse{

0%,100%{

box-shadow:0 0 40px rgba(255,0,100,.5);

}

50%{

box-shadow:0 0 90px rgba(255,0,100,.9);

}

}

.status{

margin:10px;

padding:7px 20px;

border-radius:30px;

background:rgba(255,255,255,.05);

color:#aac;

display:flex;

gap:10px;

align-items:center;

}

.dot{

width:10px;

height:10px;

border-radius:50%;

background:#555;

}

.dot.listening{

background:#00ff88;

box-shadow:0 0 15px #00ff88;

}

.dot.processing{

background:#ffaa00;

box-shadow:0 0 15px #ffaa00;

}

.user-text{

width:100%;

min-height:50px;

padding:12px;

border-radius:24px;

background:rgba(255,255,255,.04);

text-align:center;

font-size:17px;

}

.response-card{

width:100%;

max-height:200px;

overflow:auto;

margin-top:10px;

padding:18px;

border-radius:28px;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.07);

text-align:center;

font-size:17px;

line-height:1.8;

}

@media(max-width:420px){

.orb-wrapper{

width:180px;

height:180px;

}

.orb{

width:125px;

height:125px;

}

.mic-btn{

width:65px;

height:65px;

font-size:30px;

}

}

</style>

</head>


<body>


<div class="app">

<div class="header">

<div class="title">

✨ Ahoora AI

</div>

<div class="time" id="headerTime">

--:--

</div>

</div>


<div class="orb-wrapper">

<div class="orb pulse" id="orb">

<div class="inner-glow"></div>

</div>

</div>


<button class="mic-btn" id="micBtn">

<i class="fas fa-microphone" id="micIcon"></i>

</button>


<div class="status">

<span class="dot" id="statusDot"></span>

<span id="statusText">

آماده

</span>

</div>


<div class="user-text" id="userText">

برای صحبت دکمه میکروفون را بزنید

</div>


<div class="response-card" id="responseCard">

<div id="responseText">

👋 سلام! من اهورا هستم، چطور می‌توانم کمک کنم؟

</div>

</div>

</div>


<script>

"use strict";


const orb =
document.getElementById("orb");

const micBtn =
document.getElementById("micBtn");

const micIcon =
document.getElementById("micIcon");

const statusText =
document.getElementById("statusText");

const statusDot =
document.getElementById("statusDot");

const userText =
document.getElementById("userText");

const responseText =
document.getElementById("responseText");

const headerTime =
document.getElementById("headerTime");


let recognition=null;

let listening=false;

let processing=false;

let pendingPhone=null;


function clock(){

const d=new Date();

headerTime.textContent=

String(d.getHours()).padStart(2,"0")
+
":"
+
String(d.getMinutes()).padStart(2,"0");

}

clock();

setInterval(clock,10000);


function status(text,type){

statusText.textContent=text;

statusDot.className="dot "+type;

}


function response(text){

responseText.innerHTML=text;

}


function normalize(text){

return text

.replace(/[۰-۹]/g,function(d){

return String(
"۰۱۲۳۴۵۶۷۸۹".indexOf(d)
);

})

.replace(/ي/g,"ی")

.replace(/ك/g,"ک")

.replace(/\s+/g," ")

.trim()

.toLowerCase();

}


function androidAvailable(){

return typeof window.Android !== "undefined";

}


function openApp(packageName,name,url){

if(androidAvailable()){

try{

Android.openApp(packageName);

response(
"📱 در حال باز کردن "+name+" ..."
);

return;

}catch(e){}

}

if(url){

window.location.href=url;

}

}


function callNumber(number){

number=normalize(number);

number=number.replace(/[^0-9+]/g,"");

if(androidAvailable()){

Android.makeCall(number);

response(
"📞 در حال باز کردن شماره‌گیر برای "+number
);

}else{

window.location.href="tel:"+number;

}

}


function sendSMS(number,message){

number=normalize(number);

number=number.replace(/[^0-9+]/g,"");

if(androidAvailable()){

Android.sendSMS(number,message);

response("✉️ پیامک آماده ارسال شد.");

}else{

window.location.href=
"sms:"+number+
"?body="+
encodeURIComponent(message);

}

}


function openCamera(){

if(androidAvailable()){

Android.openCamera();

response("📷 دوربین باز شد.");

}else{

const input=document.createElement("input");

input.type="file";

input.accept="image/*";

input.capture="environment";

input.click();

}

}


function openGallery(){

if(androidAvailable()){

Android.openGallery();

response("🖼️ گالری باز شد.");

}else{

const input=document.createElement("input");

input.type="file";

input.accept="image/*,video/*";

input.click();

}

}


function volume(direction){

if(androidAvailable()){

Android.adjustVolume(direction);

response(
direction==="up"
?
"🔊 صدا زیاد شد."
:
"🔉 صدا کم شد."
);

}else{

response("این قابلیت فقط در APK اندروید فعال است.");

}

}


function musicToggle(){

if(androidAvailable()){

Android.toggleMusic();

response("🎵 کنترل پخش موسیقی اجرا شد.");

}else{

response("این قابلیت فقط در APK اندروید فعال است.");

}

}


function musicStop(){

if(androidAvailable()){

Android.stopMusic();

response("⏹️ موسیقی متوقف شد.");

}else{

response("این قابلیت فقط در APK اندروید فعال است.");

}

}


function searchGoogle(query){

const url=
"https://www.google.com/search?q="+
encodeURIComponent(query);

if(androidAvailable()){

Android.openUrl(url);

}else{

window.location.href=url;

}

response(
"🔎 در حال جستجوی «"+query+"» در گوگل..."
);

}


function initRecognition(){

const SpeechRecognition=
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(!SpeechRecognition){

response(
"❌ تشخیص گفتار در این WebView پشتیبانی نمی‌شود."
);

return false;

}

recognition=new SpeechRecognition();

recognition.lang="fa-IR";

recognition.continuous=false;

recognition.interimResults=false;

recognition.maxAlternatives=1;


recognition.onstart=function(){

listening=true;

processing=false;

status(
"در حال گوش دادن...",
"listening"
);

micBtn.classList.add("listening");

orb.className="orb listening";

micIcon.className=
"fas fa-circle-notch fa-spin";

};


recognition.onresult=function(event){

const text=
event.results[0][0].transcript.trim();

userText.textContent=text;

listening=false;

processing=true;

micBtn.classList.remove("listening");

orb.className="orb processing";

micIcon.className="fas fa-microphone";

processCommand(text);

};


recognition.onerror=function(event){

console.log(event.error);

listening=false;

processing=false;

micBtn.classList.remove("listening");

orb.className="orb pulse";

micIcon.className="fas fa-microphone";

status("خطا در تشخیص صدا","");

response(
"❌ نتوانستم صدای شما را تشخیص بدهم."
);

};


recognition.onend=function(){

listening=false;

micBtn.classList.remove("listening");

micIcon.className="fas fa-microphone";

};

return true;

}


function startListening(){

if(!recognition){

if(!initRecognition()){

return;

}

}

if(listening)return;

try{

recognition.start();

}catch(e){

console.log(e);

}

}


function processCommand(original){

const text=normalize(original);

status("در حال پردازش...","processing");


// ============================
// باز کردن برنامه‌ها
// ============================

if(/واتساپ.*(باز|اجرا)/.test(text)){

openApp(
"com.whatsapp",
"واتساپ",
"https://www.whatsapp.com/"
);

return;

}


if(/تلگرام.*(باز|اجرا)/.test(text)){

openApp(
"org.telegram.messenger",
"تلگرام",
"https://telegram.org/"
);

return;

}


if(/اینستاگرام.*(باز|اجرا)/.test(text)){

openApp(
"com.instagram.android",
"اینستاگرام",
"https://www.instagram.com/"
);

return;

}


if(/یوتیوب.*(باز|اجرا)/.test(text)){

openApp(
"com.google.android.youtube",
"یوتیوب",
"https://www.youtube.com/"
);

return;

}


if(/کروم.*(باز|اجرا)/.test(text)){

openApp(
"com.android.chrome",
"کروم",
"https://www.google.com/chrome/"
);

return;

}


if(/تنظیمات.*(باز|اجرا)/.test(text)){

openApp(
"com.android.settings",
"تنظیمات",
null
);

return;

}


// ============================
// دوربین
// ============================

if(

/دوربین.*باز/.test(text) ||

/عکس بگیر/.test(text)

){

openCamera();

return;

}


// ============================
// گالری
// ============================

if(

/گالری.*باز/.test(text) ||

/عکس هام/.test(text) ||

/عکسها/.test(text)

){

openGallery();

return;

}


// ============================
// تماس با شماره
// ============================

let phone=text.match(

/(?:با\s*)?(?:شماره\s*)?([0-9+]{10,13})\s*(?:رو\s*)?(?:بگیر|تماس)/

);

if(phone){

pendingPhone=phone[1];

response(

"📞 می‌خواهید با شماره "+
pendingPhone+
" تماس بگیرید؟<br><br>"+

"<button onclick=\"confirmCall()\" style=\"padding:10px 25px;border:0;border-radius:20px;background:#00cc77\">تماس</button>"

);

status("تأیید تماس","");

return;

}


// ============================
// تماس با نام
// ============================

const contacts={

"علی":"09123456789",

"احمد":"09129876543",

"رضا":"09123456780",

"محمد":"09121234567",

"سارا":"09128765432"

};


for(const name in contacts){

if(

text.includes(name) &&

/تماس|زنگ/.test(text)

){

pendingPhone=contacts[name];

response(

"📞 تماس با "+
name+
"؟<br><br>"+

"<button onclick=\"confirmCall()\" style=\"padding:10px 25px;border:0;border-radius:20px;background:#00cc77\">تماس</button>"

);

status("تأیید تماس","");

return;

}

}


// ============================
// SMS
// ============================

let sms=text.match(

/(?:به\s*)?([0-9+]{10,13})\s*(?:پیامک|پیام)\s*(?:بفرست|بده)/

);

if(sms){

sendSMS(

sms[1],

"سلام، این پیام از اهورا AI است."

);

return;

}


// ============================
// زیاد کردن صدا
// ============================

if(

/صدا.*(زیاد|بالا)/.test(text)

){

volume("up");

return;

}


// ============================
// کم کردن صدا
// ============================

if(

/صدا.*(کم|پایین)/.test(text)

){

volume("down");

return;

}


// ============================
// موسیقی
// ============================

if(

/موسیقی.*(متوقف|قطع)/.test(text) ||

/آهنگ.*(متوقف|قطع)/.test(text)

){

musicStop();

return;

}


if(

/موسیقی.*(پخش|اجرا)/.test(text) ||

/آهنگ.*(پخش|اجرا)/.test(text)

){

musicToggle();

return;

}


// ============================
// گوگل
// ============================

let google=text.match(

/(?:در\s*)?گوگل\s*(?:جستجو\s*)?(?:کن\s*)?(.+)/

);

if(google){

searchGoogle(google[1]);

return;

}


// ============================
// سایت
// ============================

let url=text.match(

/https?:\/\/[^\s]+/

);

if(url){

if(androidAvailable()){

Android.openUrl(url[0]);

}else{

window.location.href=url[0];

}

return;

}


// ============================
// ساعت
// ============================

if(

/ساعت.*(چنده|چند است|الان)/.test(text)

){

const d=new Date();

response(

"🕐 ساعت "+
String(d.getHours()).padStart(2,"0")+
":"+
String(d.getMinutes()).padStart(2,"0")+
" است."

);

status("آماده","");

orb.className="orb pulse";

return;

}


// ============================
// محاسبه
// ============================

let calc=text.match(

/([0-9]+)\s*([+\-*\/])\s*([0-9]+)/

);

if(calc){

const a=parseFloat(calc[1]);

const op=calc[2];

const b=parseFloat(calc[3]);

let result=0;

if(op==="+")result=a+b;

if(op==="-")result=a-b;

if(op==="*")result=a*b;

if(op==="/")result=a/b;

response(

"🧮 نتیجه: "+result

);

status("آماده","");

orb.className="orb pulse";

return;

}


// ============================
// پاسخ پیشفرض
// ============================

response(

"🤔 متوجه فرمان نشدم.<br><br>"+
"مثلاً بگو:<br>"+
"«واتساپ رو باز کن»<br>"+
"«با 09123456789 تماس بگیر»<br>"+
"«به 09123456789 پیامک بفرست»<br>"+
"«صدا رو زیاد کن»<br>"+
"«موسیقی رو متوقف کن»<br>"+
"«در گوگل ماینکرفت رو جستجو کن»"

);

status("آماده","");

orb.className="orb pulse";

processing=false;

}


// ============================
// تأیید تماس
// ============================

window.confirmCall=function(){

if(pendingPhone){

callNumber(pendingPhone);

pendingPhone=null;

}

};


// ============================
// میکروفون
// ============================

micBtn.addEventListener(

"click",

function(){

if(listening){

try{

recognition.stop();

}catch(e){}

}else{

startListening();

}

}

);


// ============================
// شروع
// ============================

response(

"👋 سلام! من اهورا هستم، چطور می‌توانم کمک کنم؟"

);

</script>

</body>

</html>
