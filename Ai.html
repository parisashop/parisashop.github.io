const FLAME_COST_AHOORA = 1;      // هر فرمان: 1 شعله
const DAILY_FLAMES = 10;

let currentFlames = 0;
let userEmail = '';
let userId = null;

// تابع دریافت شعله‌ها از Supabase
async function fetchFlames() {
    try {
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (!user) return null;
        
        userId = user.id;
        userEmail = user.email || '';
        
        // نمایش ایمیل در هدر
        const emailDisplay = document.getElementById('flameEmail');
        if (emailDisplay && userEmail) {
            emailDisplay.textContent = userEmail.split('@')[0] + '...';
            emailDisplay.title = userEmail;
        }
        
        // دریافت یا ایجاد رکورد شعله
        let { data, error } = await supabaseClient
            .from('user_flames')
            .select('flames, last_reset')
            .eq('user_id', userId)
            .single();
        
        if (error && error.code === 'PGRST116') {
            // رکورد وجود ندارد، ایجاد می‌کنیم
            const { data: newData, error: insertError } = await supabaseClient
                .from('user_flames')
                .insert({
                    user_id: userId,
                    email: userEmail,
                    flames: DAILY_FLAMES,
                    last_reset: new Date().toISOString().split('T')[0]
                })
                .select('flames, last_reset')
                .single();
            
            if (insertError) throw insertError;
            data = newData;
        } else if (error) {
            throw error;
        }
        
        // بررسی ریست روزانه
        const today = new Date().toISOString().split('T')[0];
        if (data.last_reset !== today) {
            const { data: resetData, error: resetError } = await supabaseClient
                .from('user_flames')
                .update({
                    flames: DAILY_FLAMES,
                    last_reset: today,
                    updated_at: new Date().toISOString()
                })
                .eq('user_id', userId)
                .select('flames')
                .single();
            
            if (resetError) throw resetError;
            data.flames = resetData.flames;
        }
        
        currentFlames = data.flames;
        updateFlameDisplay();
        return currentFlames;
        
    } catch (error) {
        console.error('Error fetching flames (Ahoora):', error);
        return null;
    }
}

// تابع مصرف شعله
async function useFlames(cost) {
    if (currentFlames < cost) {
        setStatus('🔥 شعله کافی نیست!', '');
        responseBox.innerHTML = 
            `🔥 شعله کافی نیست!<br><br>` +
            `شما ${currentFlames} شعله دارید.<br>` +
            `هر فرمان ${FLAME_COST_AHOORA} شعله مصرف می‌کند.<br><br>` +
            `⏳ صبر کنید تا فردا شعله‌ها ریست شوند.`;
        return false;
    }
    
    try {
        const newFlames = currentFlames - cost;
        
        const { data, error } = await supabaseClient
            .from('user_flames')
            .update({
                flames: newFlames,
                updated_at: new Date().toISOString()
            })
            .eq('user_id', userId)
            .select('flames')
            .single();
        
        if (error) throw error;
        
        currentFlames = data.flames;
        updateFlameDisplay();
        return true;
        
    } catch (error) {
        console.error('Error using flames (Ahoora):', error);
        return false;
    }
}

// تابع به‌روزرسانی نمایش شعله
function updateFlameDisplay() {
    const display = document.getElementById('flameContainer');
    const count = document.getElementById('flameCount');
    if (count) count.textContent = currentFlames;
    
    if (display && currentFlames <= 3) {
        display.classList.add('low');
    } else if (display) {
        display.classList.remove('low');
    }
}

/* =====================================================

async function sendOTP() {
    var email = emailInput.value.trim().toLowerCase();
    if (!email) {
        loginMessage.textContent = "لطفاً ایمیل را وارد کن.";
        return;
    }
    if (!email.includes("@")) {
        loginMessage.textContent = "ایمیل وارد شده صحیح نیست.";
        return;

    sendOtpButton.disabled = true;
    sendOtpButton.textContent = "در حال ارسال...";
    loginMessage.textContent = "";
    try {
        var result = await supabaseClient.auth.signInWithOtp({
            email: email,
            options: { shouldCreateUser: true }
        });
        if (result.error) {
            console.log(result.error);

            sendOtpButton.disabled = false;
            sendOtpButton.textContent = "📩 دریافت کد ورود";

/* =====================================================
   NORMALIZE
===================================================== */

function normalize(text) {
    return String(text)
        .replace(/[۰-۹]/g, function(d) {
            return String("۰۱۲۳۴۵۶۷۸۹".indexOf(d));
        })
        .replace(/ي/g, "ی")
        .replace(/ك/g, "ک")
        .replace(/ۀ/g, "ه")
        .replace(/[،,]/g, " ")
        .replace(/\s+/g, " ")
        .trim()
        .toLowerCase();
}

/* =====================================================
   CONTACTS (همان کد قبلی)
===================================================== */

function getContacts() {
    try {
        return JSON.parse(localStorage.getItem("ahoora_contacts") || "[]");
    } catch (e) {
        return [];
    }
}

function saveContacts(data) {
    localStorage.setItem("ahoora_contacts", JSON.stringify(data));
}

function isPersianName(name) {
    return /[\u0600-\u06FF]/.test(name);
}

function escapeHTML(text) {
    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function addContact() {
    if (!isLoggedIn) return;
    var name = contactName.value.trim();
    var number = normalize(contactNumber.value).replace(/[^0-9+]/g, "");
    if (!name) {
        alert("لطفاً نام مخاطب را وارد کن.");
        return;
    }
    if (!isPersianName(name)) {
        alert("نام مخاطب باید فارسی باشد.");
        return;
    }
    if (number.length < 10) {
        alert("شماره تلفن صحیح نیست.");
        return;
    }
    var contacts = getContacts();
    var old = contacts.findIndex(function(c) {
        return normalize(c.name) === normalize(name);
    });
    if (old >= 0) {
        contacts[old].number = number;
    } else {
        contacts.push({ name: name, number: number });
    }
    saveContacts(contacts);
    contactName.value = "";
    contactNumber.value = "";
    renderContacts();
    answer("✅ مخاطب «" + escapeHTML(name) + "» ذخیره شد.");
}

function renderContacts() {
    var contacts = getContacts();
    contactsList.innerHTML = "";
    if (!contacts.length) {
        contactsList.innerHTML = "<div style='color:#8993af;margin-top:15px;text-align:center'>هنوز مخاطبی ذخیره نشده است.</div>";
        return;
    }
    contacts.forEach(function(contact, index) {
        var div = document.createElement("div");
        div.className = "savedContact";
        div.innerHTML =
            "<div><b>" + escapeHTML(contact.name) + "</b><br><small>" + escapeHTML(contact.number) + "</small></div>" +
            "<button class='deleteContact' data-index='" + index + "'>حذف</button>";
        contactsList.appendChild(div);
    });
    document.querySelectorAll(".deleteContact").forEach(function(btn) {
        btn.onclick = function() {
            var index = Number(this.dataset.index);
            var contacts = getContacts();
            contacts.splice(index, 1);
            saveContacts(contacts);
            renderContacts();
        };
    });
}

/* =====================================================
   FIND CONTACT
===================================================== */

function findContact(name) {
    var contacts = getContacts();
    var target = normalize(name);
    return contacts.find(function(c) {
        return normalize(c.name) === target || target.indexOf(normalize(c.name)) >= 0;
    });
}

/* =====================================================
   RELATIONS
===================================================== */

var relationAliases = {
    "پدر": "پدرم", "پدرم": "پدرم", "بابا": "پدرم", "بابام": "پدرم",
    "مادر": "مادرم", "مادرم": "مادرم", "مامان": "مادرم", "مامانم": "مادرم",
    "دایی": "دایی", "داییم": "دایی",
    "عمو": "عمو", "عموم": "عمو",
    "عمه": "عمه", "عمم": "عمه",
    "خاله": "خاله", "خالم": "خاله",
    "برادر": "برادرم", "برادرم": "برادرم",
    "خواهر": "خواهرم", "خواهرم": "خواهرم"
};

function normalizeRelation(text) {
    var t = normalize(text);
    for (var key in relationAliases) {
        if (t.indexOf(key) >= 0) {
            return relationAliases[key];
        }
    }
    return null;
}

/* =====================================================
   CALL
===================================================== */

function callNumber(number) {
    if (!isLoggedIn) return;
    number = normalize(number).replace(/[^0-9+]/g, "");
    if (!number) return;
    if (android()) {
        try {
            Android.makeCall(number);
            answer("📞 در حال تماس با " + number + "...");
            return;
        } catch (e) {}
    }
    window.location.href = "tel:" + number;
}

function callContact(name) {
    var contact = findContact(name);
    if (!contact) {
        answer("❌ برای «" + escapeHTML(name) + "» شماره‌ای ذخیره نشده است.", voiceD);
        return;
    }
    callNumber(contact.number);
}

/* =====================================================
   SMS
===================================================== */

function smsContact(name, message) {
    var contact = findContact(name);
    if (!contact) {
        answer("❌ برای «" + escapeHTML(name) + "» شماره‌ای ذخیره نشده است.", voiceD);
        return;
    }
    if (android()) {
        try {
            Android.sendSMS(contact.number, message);
            answer("✉️ پیام برای " + escapeHTML(contact.name) + " ارسال شد.");
            return;
        } catch (e) {}
    }
    window.location.href = "sms:" + contact.number + "?body=" + encodeURIComponent(message);
}

function extractMessage(text) {
    var result = text;
    result = result
        .replace(/به\s+/g, "")
        .replace(/پیامک/g, "")
        .replace(/پیام/g, "")
        .replace(/بفرست/g, "")
        .replace(/بده/g, "")
        .replace(/ارسال کن/g, "")
        .trim();
    var contacts = getContacts();
    for (var i = 0; i < contacts.length; i++) {
        var n = normalize(contacts[i].name);
        if (result.indexOf(n) >= 0) {
            result = result.replace(n, "").trim();
            break;
        }
    }
    return result;
}

/* =====================================================
   EXTRACT CONTACT
===================================================== */

function extractContactFromCommand(text) {
    var contacts = getContacts();
    for (var i = 0; i < contacts.length; i++) {
        if (text.indexOf(normalize(contacts[i].name)) >= 0) {
            return contacts[i].name;
        }
    }
    var relation = normalizeRelation(text);
    if (relation) {
        return relation;
    }
    return null;
}

/* =====================================================
   SPEECH RECOGNITION
===================================================== */

var recognition = null;
var listening = false;
var commandMode = false;
var manualStop = false;
var waitingForCommand = false;
var autoRestart = true;

function initSpeech() {
    var Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!Speech) {
        answer("❌ تشخیص گفتار در WebView در دسترس نیست.", voiceD);
        return false;
    }
    recognition = new Speech();
    recognition.lang = "fa-IR";
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.maxAlternatives = 3;

    recognition.onstart = function() {
        if (!isLoggedIn) {
            stopListening();
            return;
        }
        listening = true;
        mic.classList.add("active");
        setStatus(commandMode ? "🎙️ فرمانت را بگو..." : "🎙️ منتظر Ahoora AI...", "listening");
    };

    recognition.onresult = function(event) {
        if (!isLoggedIn) return;
        var text = event.results[0][0].transcript.trim();
        userBox.textContent = text;
        var t = normalize(text);

        if (!commandMode) {
            if (t.indexOf("ahoora ai") >= 0 || t.indexOf("ahoor a i") >= 0 ||
                t.indexOf("اهورا ای") >= 0 || t.indexOf("اهورا آی") >= 0 || t.indexOf("اهورا") >= 0) {
                commandMode = true;
                waitingForCommand = true;
                answer("👋 بله؟ فرمانت را بگو.", voiceE);
                setStatus("🎙️ فرمان صوتی فعال شد");
                setTimeout(function() {
                    if (commandMode && isLoggedIn) {
                        startListening();
                    }
                }, 1200);
            }
            return;
        }
        waitingForCommand = false;
        processSpeech(text, true);
    };

    recognition.onerror = function(event) {
        listening = false;
        mic.classList.remove("active");
        console.log("Speech error:", event.error);
        if (autoRestart && !manualStop && isLoggedIn) {
            if (event.error === "no-speech" || event.error === "aborted") {
                setTimeout(function() {
                    if (autoRestart && !manualStop && isLoggedIn) {
                        startListening();
                    }
                }, 600);
                return;
            }
            if (event.error === "not-allowed") {
                answer("❌ اجازه استفاده از میکروفن داده نشده است.", voiceD);
                setStatus("اجازه میکروفن لازم است");
                return;
            }
        }
    };

    recognition.onend = function() {
        listening = false;
        mic.classList.remove("active");
        orb.classList.remove("listening", "processing");
        if (manualStop) {
            manualStop = false;
            autoRestart = false;
            setStatus("میکروفن خاموش شد");
            return;
        }
        if (autoRestart && isLoggedIn) {
            setTimeout(function() {
                if (!manualStop && autoRestart && isLoggedIn) {
                    startListening();
                }
            }, 600);
        }
    };
    return true;
}

function startListening() {
    if (!isLoggedIn) return;
    if (listening) return;
    if (!recognition) {
        if (!initSpeech()) return;
    }
    autoRestart = true;
    manualStop = false;
    try {
        recognition.start();
    } catch (e) {
        console.log("start error", e);
    }
}

function stopListening() {
    manualStop = true;
    autoRestart = false;
    listening = false;
    if (recognition) {
        try { recognition.stop(); } catch (e) {}
    }
    mic.classList.remove("active");
    orb.classList.remove("listening", "processing");
    setStatus("میکروفن خاموش شد");
}

/* =====================================================
   PROCESS SPEECH - اصلاح شده با مصرف شعله
===================================================== */

async function processSpeech(original, fromButton) {
    if (!isLoggedIn) return;
    
    // بررسی شعله قبل از پردازش فرمان
    if (!await useFlames(FLAME_COST_AHOORA)) {
        commandMode = false;
        setStatus("آماده — بگو «Ahoora AI»");
        return;
    }
    
    var text = normalize(original);
    setStatus("در حال پردازش...", "processing");
    
    if (fromButton) {
        commandMode = true;
    }
    
    if (text === "لغو" || text === "بیخیال" || text === "خروج") {
        commandMode = false;
        answer("باشه.");
        setStatus("آماده — بگو «Ahoora AI»");
        return;
    }
    
    // ============================================
    // تمام دستورات (بدون تغییر در منطق)
    // ============================================
    
    if ((text.indexOf("چراغ قوه") >= 0 || text.indexOf("فلاش") >= 0) &&
        (text.indexOf("خاموش") >= 0 || text.indexOf("قطع") >= 0)) {
        flashlightOff();
        return;
    }
    
    if ((text.indexOf("چراغ قوه") >= 0 || text.indexOf("فلاش") >= 0) &&
        (text.indexOf("روشن") >= 0 || text.indexOf("فعال") >= 0)) {
        flashlightOn();
        return;
    }
    
    if (text.indexOf("وای فای") >= 0 || text.indexOf("وایفای") >= 0 || text.indexOf("wifi") >= 0) {
        wifi();
        return;
    }
    
    if (text.indexOf("بلوتوث") >= 0 || text.indexOf("bluetooth") >= 0) {
        bluetooth();
        return;
    }
    
    if (text.indexOf("اینترنت همراه") >= 0 || text.indexOf("دیتای همراه") >= 0 ||
        text.indexOf("دیتا همراه") >= 0 || text.indexOf("داده همراه") >= 0) {
        mobileData();
        return;
    }
    
    if (text.indexOf("مکان") >= 0 || text.indexOf("لوکیشن") >= 0 || text.indexOf("gps") >= 0) {
        locationSettings();
        return;
    }
    
    if (text.indexOf("هات اسپات") >= 0 || text.indexOf("هات‌اسپات") >= 0 || text.indexOf("نقطه اتصال") >= 0) {
        hotspot();
        return;
    }
    
    if ((text.indexOf("نور") >= 0 || text.indexOf("روشنایی") >= 0) &&
        (text.indexOf("زیاد") >= 0 || text.indexOf("بالا") >= 0)) {
        brightnessUp();
        return;
    }
    
    if ((text.indexOf("نور") >= 0 || text.indexOf("روشنایی") >= 0) &&
        (text.indexOf("کم") >= 0 || text.indexOf("پایین") >= 0)) {
        brightnessDown();
        return;
    }
    
    if ((text.indexOf("آهنگ") >= 0 || text.indexOf("موزیک") >= 0 || text.indexOf("موسیقی") >= 0) &&
        (text.indexOf("بعدی") >= 0 || text.indexOf("بعد") >= 0)) {
        musicNext();
        return;
    }
    
    if ((text.indexOf("آهنگ") >= 0 || text.indexOf("موزیک") >= 0 || text.indexOf("موسیقی") >= 0) &&
        (text.indexOf("قبلی") >= 0 || text.indexOf("قبل") >= 0)) {
        musicPrevious();
        return;
    }
    
    if ((text.indexOf("آهنگ") >= 0 || text.indexOf("موزیک") >= 0 || text.indexOf("موسیقی") >= 0) &&
        (text.indexOf("توقف") >= 0 || text.indexOf("متوقف") >= 0 || text.indexOf("قطع") >= 0 || text.indexOf("بایست") >= 0)) {
        musicStop();
        return;
    }
    
    if ((text.indexOf("آهنگ") >= 0 || text.indexOf("موزیک") >= 0 || text.indexOf("موسیقی") >= 0) &&
        (text.indexOf("پخش") >= 0 || text.indexOf("اجرا") >= 0 || text.indexOf("ادامه") >= 0 || text.indexOf("شروع") >= 0)) {
        musicPlay();
        return;
    }
    
    if (text.indexOf("صدا") >= 0 && (text.indexOf("زیاد") >= 0 || text.indexOf("بالا") >= 0)) {
        volumeUp();
        return;
    }
    
    if (text.indexOf("صدا") >= 0 && (text.indexOf("کم") >= 0 || text.indexOf("پایین") >= 0)) {
        volumeDown();
        return;
    }
    
    if (text.indexOf("ساعت") >= 0) {
        sayTime();
        return;
    }
    
    if (text.indexOf("دوربین") >= 0 || text.indexOf("عکس بگیر") >= 0) {
        camera();
        return;
    }
    
    if (text.indexOf("گالری") >= 0 || text.indexOf("عکس هام") >= 0 || text.indexOf("عکسها") >= 0) {
        gallery();
        return;
    }
    
    if (text.indexOf("تماس") >= 0 || text.indexOf("زنگ") >= 0 || text.indexOf("بگیر") >= 0) {
        var contact = extractContactFromCommand(text);
        if (contact) {
            callContact(contact);
            return;
        }
        var match = text.match(/(\+?[0-9]{10,15})/);
        if (match) {
            callNumber(match[1]);
            return;
        }
    }
    
    if (text.indexOf("پیام") >= 0 || text.indexOf("پیامک") >= 0) {
        var smsContactName = extractContactFromCommand(text);
        if (smsContactName) {
            var message = extractMessage(text);
            if (!message) {
                message = "سلام";
            }
            smsContact(smsContactName, message);
            return;
        }
    }
    
    var searchText = null;
    if (text.indexOf("در گوگل") >= 0 || text.indexOf("توی گوگل") >= 0) {
        searchText = text.replace("در گوگل", "").replace("توی گوگل", "").replace("جستجو", "").replace("کن", "").trim();
    } else if (text.indexOf("گوگل") === 0) {
        searchText = text.replace("گوگل", "").replace("جستجو", "").replace("کن", "").trim();
    }
    if (searchText) {
        googleSearch(searchText);
        return;
    }
    
    if (openNamedApp(text)) {
        return;
    }
    
    var url = original.match(/https?:\/\/[^\s]+/i);
    if (url) {
        if (android()) {
            try { Android.openUrl(url[0]); } catch (e) {}
        } else {
            window.location.href = url[0];
        }
        return;
    }
    
    if (text.indexOf("سلام") >= 0) {
        answer("👋 سلام! من اهورا هستم.", voiceE);
        return;
    }
    
    answer(
        "🤔 متوجه فرمان نشدم.<br><br>" +
        "مثلاً بگو:<br>" +
        "«چراغ قوه رو روشن کن»<br>" +
        "«وای فای رو باز کن»<br>" +
        "«بلوتوث رو باز کن»<br>" +
        "«آهنگ بعدی»<br>" +
        "«واتساپ رو باز کن»<br>" +
        "«با پدرم تماس بگیر»<br>" +
        "«به پدرم پیام بده سلام»",
        voiceD
    );
}
