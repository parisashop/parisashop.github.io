<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل ادمین - درخواست‌های امداد</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .status-badge { padding: 5px 15px; border-radius: 20px; font-size: 12px; }
        .status-new { background: #fef3c7; color: #92400e; }
        .status-progress { background: #dbeafe; color: #1e40af; }
        .status-done { background: #d1fae5; color: #065f46; }
        .status-cancel { background: #fee2e2; color: #991b1b; }
        .comment-box { border-right: 4px solid #dc2626; background: #f8f9fa; padding: 10px; border-radius: 8px; }
        .admin-card { transition: all 0.3s; }
        .admin-card:hover { box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-danger"><i class="fas fa-user-shield"></i> پنل مدیریت درخواست‌ها</h2>
        <button class="btn btn-danger" onclick="refreshData()"><i class="fas fa-sync"></i> بروزرسانی</button>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <select id="statusFilter" class="form-select" onchange="filterRequests()">
                <option value="all">همه وضعیت‌ها</option>
                <option value="جدید">جدید</option>
                <option value="در حال انجام">در حال انجام</option>
                <option value="انجام شده">انجام شده</option>
                <option value="لغو شده">لغو شده</option>
            </select>
        </div>
        <div class="col-md-4">
            <input type="text" id="searchInput" class="form-control" placeholder="جستجو در نام یا شماره..." onkeyup="filterRequests()">
        </div>
        <div class="col-md-4">
            <span class="badge bg-danger fs-6 p-2" id="totalCount">۰ درخواست</span>
        </div>
    </div>

    <div id="requestsList"></div>
</div>

<!-- Modal -->
<div class="modal fade" id="commentModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title"><i class="fas fa-comment"></i> افزودن کامنت</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="commentRequestId">
                <div class="mb-3">
                    <label class="form-label">وضعیت درخواست</label>
                    <select id="modalStatus" class="form-select">
                        <option value="جدید">جدید</option>
                        <option value="در حال انجام">در حال انجام</option>
                        <option value="انجام شده">انجام شده</option>
                        <option value="لغو شده">لغو شده</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">کامنت ادمین</label>
                    <textarea id="modalComment" class="form-control" rows="3" placeholder="توضیحات تکمیلی..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">لغو</button>
                <button class="btn btn-danger" onclick="saveComment()"><i class="fas fa-save"></i> ذخیره</button>
            </div>
        </div>
    </div>
</div>

<script>
    // ============================================
    // 🔧 CONFIGURATION - Supabase (Your Credentials)
    // ============================================
    const SUPABASE_URL = 'https://xunkrqqfjaaopprgzwqf.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh1bmtycXFmamFhb3Bwcmd6d3FmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0MjM0NTAsImV4cCI6MjEwMzk5OTQ1MH0.UmIJ3hg101fBbw0LD9Q1isTiTLIO_T93O97B41iByuI';

    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let allRequests = [];

    async function loadRequests() {
        try {
            const { data, error } = await supabase
                .from('requests')
                .select('*')
                .order('created_at', { ascending: false });
            if (error) throw error;
            allRequests = data;
            document.getElementById('totalCount').textContent = `${data.length} درخواست`;
            filterRequests();
        } catch (error) {
            console.error('Error loading requests:', error);
            document.getElementById('requestsList').innerHTML = `<div class="alert alert-danger"><i class="fas fa-exclamation-triangle"></i> خطا در دریافت درخواست‌ها</div>`;
        }
    }

    function filterRequests() {
        const statusFilter = document.getElementById('statusFilter').value;
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        let filtered = allRequests;
        if (statusFilter !== 'all') filtered = filtered.filter(r => r.status === statusFilter);
        if (searchTerm) filtered = filtered.filter(r => r.full_name.toLowerCase().includes(searchTerm) || r.phone.includes(searchTerm));
        renderRequests(filtered);
    }

    function renderRequests(requests) {
        const container = document.getElementById('requestsList');
        if (requests.length === 0) {
            container.innerHTML = `<div class="text-center py-5"><i class="fas fa-inbox fa-3x text-muted"></i><p class="mt-3">هیچ درخواستی یافت نشد</p></div>`;
            return;
        }
        let html = '';
        requests.forEach(req => {
            const statusClass = `status-${req.status === 'جدید' ? 'new' : req.status === 'در حال انجام' ? 'progress' : req.status === 'انجام شده' ? 'done' : 'cancel'}`;
            const coords = req.latitude && req.longitude ? `${req.latitude.toFixed(6)}, ${req.longitude.toFixed(6)}` : 'موقعیت نامشخص';
            const mapLink = req.latitude && req.longitude ? `https://www.google.com/maps?q=${req.latitude},${req.longitude}` : '#';
            html += `
                <div class="card admin-card mb-3">
                    <div class="card-body">
                        <div class="row align-items-center">
                            <div class="col-md-3"><h6 class="mb-1">${req.full_name}</h6><small class="text-muted"><i class="fas fa-phone"></i> ${req.phone}</small></div>
                            <div class="col-md-2"><span class="badge ${statusClass}">${req.status || 'جدید'}</span></div>
                            <div class="col-md-3"><small class="d-block"><i class="fas fa-service"></i> ${req.service_type}</small><small class="text-muted"><i class="fas fa-map-pin"></i> <a href="${mapLink}" target="_blank">${coords}</a></small></div>
                            <div class="col-md-2"><small class="text-muted"><i class="fas fa-clock"></i> ${new Date(req.created_at).toLocaleString('fa-IR')}</small></div>
                            <div class="col-md-2 text-end">
                                <button class="btn btn-sm btn-outline-danger me-1" onclick="openCommentModal(${req.id})"><i class="fas fa-comment"></i></button>
                                <button class="btn btn-sm btn-outline-danger" onclick="deleteRequest(${req.id})"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                        ${req.admin_comment ? `<div class="comment-box mt-2"><small><i class="fas fa-comment-dots text-danger"></i> ${req.admin_comment}</small></div>` : ''}
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    function openCommentModal(id) {
        const request = allRequests.find(r => r.id === id);
        if (!request) return;
        document.getElementById('commentRequestId').value = id;
        document.getElementById('modalStatus').value = request.status || 'جدید';
        document.getElementById('modalComment').value = request.admin_comment || '';
        new bootstrap.Modal(document.getElementById('commentModal')).show();
    }

    async function saveComment() {
        const id = parseInt(document.getElementById('commentRequestId').value);
        const status = document.getElementById('modalStatus').value;
        const comment = document.getElementById('modalComment').value.trim();
        try {
            const { error } = await supabase.from('requests').update({ status, admin_comment: comment || null }).eq('id', id);
            if (error) throw error;
            const request = allRequests.find(r => r.id === id);
            if (request) { request.status = status; request.admin_comment = comment || null; }
            bootstrap.Modal.getInstance(document.getElementById('commentModal')).hide();
            filterRequests();
            showAlert('✅ کامنت و وضعیت با موفقیت ذخیره شد', 'success');
        } catch (error) {
            console.error('Error saving comment:', error);
            showAlert('❌ خطا در ذخیره کامنت', 'danger');
        }
    }

    async function deleteRequest(id) {
        if (!confirm('آیا از حذف این درخواست مطمئن هستید؟')) return;
        try {
            const { error } = await supabase.from('requests').delete().eq('id', id);
            if (error) throw error;
            allRequests = allRequests.filter(r => r.id !== id);
            filterRequests();
            showAlert('✅ درخواست با موفقیت حذف شد', 'success');
        } catch (error) {
            console.error('Error deleting request:', error);
            showAlert('❌ خطا در حذف درخواست', 'danger');
        }
    }

    function refreshData() {
        document.getElementById('requestsList').innerHTML = '<div class="text-center"><i class="fas fa-spinner fa-spin fa-2x"></i></div>';
        loadRequests();
    }

    function showAlert(message, type = 'success') {
        const alertDiv = document.createElement('div');
        alertDiv.className = `alert alert-${type} alert-dismissible fade show position-fixed top-0 start-50 translate-middle-x mt-3`;
        alertDiv.style.zIndex = '9999';
        alertDiv.innerHTML = `${message} <button type="button" class="btn-close" data-bs-dismiss="alert"></button>`;
        document.body.prepend(alertDiv);
        setTimeout(() => alertDiv.remove(), 4000);
    }

    document.addEventListener('DOMContentLoaded', loadRequests);
    setInterval(loadRequests, 30000);
    console.log('🛠️ پنل ادمین آماده است!');
</script>
</body>
</html>
