<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>پنل مدیریت | الیگودرز کالا</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    background:#f4f6f9;
    color:#1e2a41;
}

header{
    background:#fff;
    padding:18px 20px;
    box-shadow:0 3px 15px rgba(0,0,0,.07);
    position:sticky;
    top:0;
    z-index:20;
}

.header-inner{
    max-width:1400px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.logo{
    font-size:22px;
    font-weight:bold;
}

.logo span{
    color:#e63946;
}

.refresh-btn{
    border:0;
    background:#1e2a41;
    color:white;
    padding:10px 18px;
    border-radius:30px;
    cursor:pointer;
}

.container{
    max-width:1400px;
    margin:auto;
    padding:25px 15px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
    gap:15px;
    margin-bottom:25px;
}

.stat{
    background:#fff;
    padding:20px;
    border-radius:18px;
    box-shadow:0 3px 12px rgba(0,0,0,.04);
}

.stat-title{
    color:#777;
    font-size:14px;
}

.stat-number{
    font-size:28px;
    font-weight:bold;
    margin-top:8px;
}

.orders{
    display:grid;
    gap:18px;
}

.order{
    background:#fff;
    border-radius:22px;
    padding:20px;
    box-shadow:0 4px 18px rgba(0,0,0,.05);
    border:1px solid #edf0f4;
}

.order-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    padding-bottom:15px;
    border-bottom:1px solid #eee;
}

.tracking{
    font-weight:bold;
    font-size:18px;
}

.date{
    color:#777;
    font-size:13px;
}

.status{
    padding:7px 13px;
    border-radius:30px;
    font-size:13px;
    font-weight:bold;
}

.status.pending{
    background:#fff3cd;
    color:#856404;
}

.status.confirmed{
    background:#dbeafe;
    color:#1d4ed8;
}

.status.preparing{
    background:#e0e7ff;
    color:#4338ca;
}

.status.ready{
    background:#dcfce7;
    color:#166534;
}

.status.delivered{
    background:#d1fae5;
    color:#065f46;
}

.status.rejected{
    background:#fee2e2;
    color:#991b1b;
}

.info-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
    margin:18px 0;
}

.info{
    background:#f8fafc;
    border-radius:14px;
    padding:14px;
}

.info-title{
    color:#777;
    font-size:12px;
    margin-bottom:6px;
}

.info-value{
    font-weight:bold;
    line-height:1.8;
}

.items{
    background:#fafafa;
    border-radius:15px;
    padding:15px;
    margin-top:10px;
}

.item{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:9px 0;
    border-bottom:1px solid #eee;
}

.item:last-child{
    border-bottom:0;
}

.total{
    display:flex;
    justify-content:space-between;
    margin-top:15px;
    padding-top:15px;
    border-top:2px solid #eee;
    font-size:18px;
    font-weight:bold;
}

.progress{
    margin:20px 0;
}

.progress-line{
    height:8px;
    background:#e5e7eb;
    border-radius:20px;
    overflow:hidden;
}

.progress-fill{
    height:100%;
    border-radius:20px;
    transition:.4s;
}

.progress-labels{
    display:flex;
    justify-content:space-between;
    margin-top:8px;
    font-size:11px;
    color:#777;
}

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:9px;
    margin-top:20px;
}

.btn{
    border:0;
    padding:11px 17px;
    border-radius:30px;
    cursor:pointer;
    font-weight:bold;
}

.btn-confirm{
    background:#2563eb;
    color:#fff;
}

.btn-preparing{
    background:#6366f1;
    color:#fff;
}

.btn-ready{
    background:#16a34a;
    color:#fff;
}

.btn-delivered{
    background:#059669;
    color:#fff;
}

.btn-reject{
    background:#dc2626;
    color:#fff;
}

.btn:hover{
    opacity:.85;
}

.empty{
    text-align:center;
    background:#fff;
    border-radius:20px;
    padding:50px;
    color:#777;
}

.loading{
    text-align:center;
    padding:40px;
}

.error{
    background:#fee2e2;
    color:#991b1b;
    padding:18px;
    border-radius:15px;
    margin-bottom:20px;
    display:none;
    white-space:pre-wrap;
}

.search-box{
    background:#fff;
    border-radius:18px;
    padding:15px;
    margin-bottom:20px;
    display:flex;
    gap:10px;
}

.search-box input,
.search-box select{
    border:2px solid #eee;
    border-radius:12px;
    padding:12px;
    outline:none;
    flex:1;
}

.search-box input:focus,
.search-box select:focus{
    border-color:#e63946;
}

@media(max-width:600px){
    .header-inner{
        flex-direction:column;
        align-items:stretch;
    }

    .order{
        padding:15px;
    }

    .actions .btn{
        flex:1;
        min-width:130px;
    }
}
</style>
</head>

<body>

<header>
<div class="header-inner">

<div class="logo">
پنل مدیریت <span>الیگودرز کالا</span>
</div>

<button class="refresh-btn" onclick="loadOrders()">
<i>↻</i> بروزرسانی
</button>

</div>
</header>


<main class="container">

<div id="errorBox" class="error"></div>

<div class="stats">

<div class="stat">
<div class="stat-title">کل سفارش‌ها</div>
<div class="stat-number" id="totalOrders">۰</div>
</div>

<div class="stat">
<div class="stat-title">در انتظار تأیید</div>
<div class="stat-number" id="pendingOrders">۰</div>
</div>

<div class="stat">
<div class="stat-title">در حال آماده‌سازی</div>
<div class="stat-number" id="preparingOrders">۰</div>
</div>

<div class="stat">
<div class="stat-title">تحویل داده شده</div>
<div class="stat-number" id="deliveredOrders">۰</div>
</div>

</div>


<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="جستجوی کد پیگیری، شماره تلفن..."
oninput="renderOrders()"
>

<select id="statusFilter" onchange="renderOrders()">

<option value="all">همه سفارش‌ها</option>
<option value="pending">در انتظار تأیید</option>
<option value="confirmed">تأیید شده</option>
<option value="preparing">در حال آماده‌سازی</option>
<option value="ready">آماده ارسال</option>
<option value="delivered">تحویل داده شده</option>
<option value="rejected">رد شده</option>

</select>

</div>


<div id="ordersContainer">

<div class="loading">
در حال دریافت سفارش‌ها...
</div>

</div>

</main>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
'https://mqohsmxpvqwqgmwubfyr.supabase.co';

/*
   ANON / PUBLISHABLE KEY
*/

const SUPABASE_ANON_KEY =
'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1xb2hzbXhwdnF3cWdtd3ViZnlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE0MzE1OTMsImV4cCI6MjA5NzAwNzU5M30.6a_Bdvhb-ZbDDkxDNuIPxTHS4JvBjxkqOiHfNSgBUC4';


/*
   مهم:
   از window.supabase استفاده شده تا با نام متغیر
   تداخل ایجاد نشود.
*/

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


/* =========================================================
   STATE
========================================================= */

let orders = [];


/* =========================================================
   نمایش خطا
========================================================= */

function showError(message){

    const box = document.getElementById('errorBox');

    box.style.display = 'block';

    box.textContent =
        'خطا:\n' + message;

}

function hideError(){

    document.getElementById('errorBox').style.display = 'none';

}


/* =========================================================
   وضعیت فارسی
========================================================= */

function statusText(status){

    const map = {

        pending:
        'در انتظار تأیید',

        confirmed:
        'تأیید شده',

        preparing:
        'در حال آماده‌سازی',

        ready:
        'آماده ارسال',

        delivered:
        'تحویل داده شده',

        rejected:
        'رد شده'

    };

    return map[status] || status;

}


/* =========================================================
   درصد پیشرفت
========================================================= */

function getProgress(status){

    switch(status){

        case 'pending':
            return 15;

        case 'confirmed':
            return 35;

        case 'preparing':
            return 60;

        case 'ready':
            return 80;

        case 'delivered':
            return 100;

        case 'rejected':
            return 0;

        default:
            return 10;
    }

}


/* =========================================================
   تاریخ
========================================================= */

function formatDate(date){

    if(!date) return '-';

    try{

        return new Date(date).toLocaleString(
            'fa-IR',
            {
                dateStyle:'short',
                timeStyle:'short'
            }
        );

    }catch(e){

        return date;

    }

}


/* =========================================================
   دریافت سفارش‌ها
========================================================= */

async function loadOrders(){

    hideError();

    document.getElementById('ordersContainer').innerHTML =
        '<div class="loading">در حال دریافت سفارش‌ها...</div>';

    try{

        /*
           سفارش‌ها را می‌گیریم
        */

        const {
            data,
            error
        } = await db
            .from('orders')
            .select('*')
            .order('created_at',{
                ascending:false
            });


        if(error){

            console.error(error);

            throw new Error(
                error.message +
                '\nکد خطا: ' +
                error.code
            );

        }


        orders = data || [];


        /*
           گرفتن کاربران
        */

        if(orders.length > 0){

            const userIds = [
                ...new Set(
                    orders
                    .map(o => o.user_id)
                    .filter(Boolean)
                )
            ];


            if(userIds.length > 0){

                const {
                    data: users,
                    error: userError
                } = await db
                    .from('users')
                    .select(
                        'id,phone,street,alley,plaque'
                    )
                    .in('id',userIds);


                if(!userError && users){

                    orders = orders.map(order => {

                        order.user =
                            users.find(
                                u => String(u.id) === String(order.user_id)
                            ) || null;

                        return order;

                    });

                }

            }

        }


        updateStats();

        renderOrders();

    }catch(error){

        console.error(error);

        showError(error.message);

        document.getElementById('ordersContainer').innerHTML =
            '<div class="empty">دریافت سفارش‌ها ناموفق بود.</div>';

    }

}


/* =========================================================
   آمار
========================================================= */

function updateStats(){

    document.getElementById('totalOrders').textContent =
        orders.length.toLocaleString('fa-IR');


    document.getElementById('pendingOrders').textContent =
        orders.filter(
            o => o.status === 'pending'
        ).length.toLocaleString('fa-IR');


    document.getElementById('preparingOrders').textContent =
        orders.filter(
            o =>
                o.status === 'confirmed' ||
                o.status === 'preparing'
        ).length.toLocaleString('fa-IR');


    document.getElementById('deliveredOrders').textContent =
        orders.filter(
            o => o.status === 'delivered'
        ).length.toLocaleString('fa-IR');

}


/* =========================================================
   نمایش سفارش‌ها
========================================================= */

function renderOrders(){

    const container =
        document.getElementById('ordersContainer');

    const search =
        document
        .getElementById('searchInput')
        .value
        .trim()
        .toLowerCase();


    const status =
        document
        .getElementById('statusFilter')
        .value;


    let filtered = orders.filter(order => {

        const user = order.user;

        const tracking =
            String(order.tracking_code || '')
            .toLowerCase();

        const phone =
            String(user?.phone || '')
            .toLowerCase();

        const matchesSearch =
            !search ||
            tracking.includes(search) ||
            phone.includes(search);


        const matchesStatus =
            status === 'all' ||
            order.status === status;


        return matchesSearch && matchesStatus;

    });


    if(filtered.length === 0){

        container.innerHTML =
            '<div class="empty">سفارشی پیدا نشد.</div>';

        return;

    }


    container.innerHTML =
        filtered.map(order => createOrderHTML(order)).join('');

}


/* =========================================================
   ساخت HTML سفارش
========================================================= */

function createOrderHTML(order){

    const user = order.user || {};

    const progress =
        getProgress(order.status);


    let items = [];

    try{

        if(Array.isArray(order.items)){

            items = order.items;

        }else if(typeof order.items === 'string'){

            items = JSON.parse(order.items);

        }

    }catch(e){

        items = [];

    }


    const itemsHTML =
        items.length
        ?
        items.map(item => `

            <div class="item">

                <span>
                    ${escapeHTML(item.name || 'محصول')}
                    × ${item.qty || 1}
                </span>

                <strong>
                    ${Number(
                        (item.price || 0) *
                        (item.qty || 1)
                    ).toLocaleString('fa-IR')}
                    تومان
                </strong>

            </div>

        `).join('')
        :
        '<div>اطلاعات محصولات موجود نیست</div>';


    const address = [

        user.street,
        user.alley
            ? 'کوچه ' + user.alley
            : '',
        user.plaque
            ? 'پلاک ' + user.plaque
            : ''

    ]
    .filter(Boolean)
    .join('، ');


    return `

    <div class="order">

        <div class="order-top">

            <div>

                <div class="tracking">

                    کد پیگیری:
                    ${escapeHTML(
                        order.tracking_code || order.id || '-'
                    )}

                </div>

                <div class="date">

                    ثبت:
                    ${formatDate(order.created_at)}

                </div>

            </div>


            <span class="status ${escapeHTML(order.status)}">

                ${statusText(order.status)}

            </span>

        </div>


        <div class="info-grid">

            <div class="info">

                <div class="info-title">
                    مشتری
                </div>

                <div class="info-value">
                    ${escapeHTML(user.phone || 'نامشخص')}
                </div>

            </div>


            <div class="info">

                <div class="info-title">
                    آدرس
                </div>

                <div class="info-value">
                    ${escapeHTML(address || 'ثبت نشده')}
                </div>

            </div>


            <div class="info">

                <div class="info-title">
                    وضعیت
                </div>

                <div class="info-value">

                    ${statusText(order.status)}

                </div>

            </div>

        </div>


        <div class="items">

            <strong>
                محصولات سفارش
            </strong>

            <div style="margin-top:10px">

                ${itemsHTML}

            </div>

        </div>


        <div class="total">

            <span>
                مبلغ سفارش
            </span>

            <span>
                ${Number(
                    order.total || 0
                ).toLocaleString('fa-IR')}
                تومان
            </span>

        </div>


        ${
            order.status !== 'rejected'
            ?
            `

            <div class="progress">

                <div class="progress-line">

                    <div
                        class="progress-fill"
                        style="
                            width:${progress}%;
                            background:#e63946;
                        "
                    ></div>

                </div>


                <div class="progress-labels">

                    <span>ثبت</span>
                    <span>تأیید</span>
                    <span>آماده‌سازی</span>
                    <span>ارسال</span>
                    <span>تحویل</span>

                </div>

            </div>

            `
            :
            ''
        }


        <div class="actions">

            ${
                order.status === 'pending'
                ?
                `
                <button
                    class="btn btn-confirm"
                    onclick="changeStatus('${order.id}','confirmed')"
                >
                    ✓ تأیید سفارش
                </button>

                <button
                    class="btn btn-reject"
                    onclick="changeStatus('${order.id}','rejected')"
                >
                    ✕ رد سفارش
                </button>
                `
                :
                ''
            }


            ${
                order.status === 'confirmed'
                ?
                `
                <button
                    class="btn btn-preparing"
                    onclick="changeStatus('${order.id}','preparing')"
                >
                    🔧 شروع آماده‌سازی
                </button>
                `
                :
                ''
            }


            ${
                order.status === 'preparing'
                ?
                `
                <button
                    class="btn btn-ready"
                    onclick="changeStatus('${order.id}','ready')"
                >
                    ✓ آماده ارسال
                </button>
                `
                :
                ''
            }


            ${
                order.status === 'ready'
                ?
                `
                <button
                    class="btn btn-delivered"
                    onclick="changeStatus('${order.id}','delivered')"
                >
                    🚚 تحویل داده شد
                </button>
                `
                :
                ''
            }


            ${
                order.status === 'rejected'
                ?
                `
                <button
                    class="btn btn-confirm"
                    onclick="changeStatus('${order.id}','confirmed')"
                >
                    ↻ تأیید مجدد
                </button>
                `
                :
                ''
            }

        </div>

    </div>

    `;

}


/* =========================================================
   تغییر وضعیت سفارش
========================================================= */

async function changeStatus(orderId,newStatus){

    const order =
        orders.find(
            o => String(o.id) === String(orderId)
        );


    if(!order) return;


    const names = {

        confirmed:'تأیید سفارش',
        preparing:'شروع آماده‌سازی',
        ready:'آماده ارسال',
        delivered:'تحویل داده شد',
        rejected:'رد سفارش'

    };


    const confirmMessage =
        'آیا مطمئن هستید که سفارش را «' +
        (names[newStatus] || newStatus) +
        '» می‌کنید؟';


    if(!confirm(confirmMessage)){

        return;

    }


    hideError();


    try{

        const updateData = {

            status:newStatus

        };


        /*
           اگر ستون‌های زمانی در جدول وجود داشته باشند
           این زمان‌ها هم ثبت می‌شوند.
        */

        if(newStatus === 'confirmed'){

            updateData.confirmed_at =
                new Date().toISOString();

        }


        if(newStatus === 'delivered'){

            updateData.delivered_at =
                new Date().toISOString();

        }


        const {
            data,
            error
        } = await db
            .from('orders')
            .update(updateData)
            .eq('id',orderId)
            .select()
            .single();


        if(error){

            console.error(error);

            throw new Error(
                error.message +
                '\nکد: ' +
                error.code
            );

        }


        /*
           آپدیت محلی
        */

        order.status = newStatus;


        if(newStatus === 'confirmed'){

            order.confirmed_at =
                updateData.confirmed_at;

        }


        if(newStatus === 'delivered'){

            order.delivered_at =
                updateData.delivered_at;

        }


        updateStats();

        renderOrders();


        alert(
            '✅ وضعیت سفارش با موفقیت تغییر کرد.'
        );


    }catch(error){

        console.error(error);

        showError(
            'تغییر وضعیت انجام نشد:\n' +
            error.message
        );

    }

}


/* =========================================================
   جلوگیری از HTML Injection
========================================================= */

function escapeHTML(value){

    if(value === null || value === undefined){

        return '';

    }


    return String(value)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#039;');

}


/* =========================================================
   REALTIME
========================================================= */

const channel =
    db
    .channel('admin-orders')
    .on(
        'postgres_changes',
        {
            event:'*',
            schema:'public',
            table:'orders'
        },
        function(){

            loadOrders();

        }
    )
    .subscribe();


/* =========================================================
   شروع
========================================================= */

document.addEventListener(
    'DOMContentLoaded',
    function(){

        loadOrders();

    }
);


/*
   هر 30 ثانیه هم سفارش‌ها دوباره بررسی می‌شوند.
*/

setInterval(
    loadOrders,
    30000
);

</script>

</body>
</html>
